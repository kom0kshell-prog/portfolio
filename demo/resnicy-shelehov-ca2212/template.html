<!doctype html>
<html lang="ru">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Студия Нежность</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap">
<style>
/* Стиль 12 «Мягкий»: как мобильное приложение. Простой: выбор касанием, нижняя панель и шторка с заявкой. */
:root{--accent:#2f6f5e;--bg:#eef0f4;--app:#f8f9fb;--card:#ffffff;--ink:#1f2330;--muted:#7a8091;--line:#e6e8ee;--f:"Ubuntu",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f)}
.app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--app);padding-bottom:110px}
.head{background:var(--accent);color:#fff;padding:34px 22px 64px;border-radius:0 0 36px 36px;position:relative;overflow:hidden}
.head::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.head h1{margin:0;font-size:30px;font-weight:700;position:relative;overflow-wrap:anywhere}
.head p{margin:8px 0 0;opacity:.88;position:relative}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:-34px 16px 0;position:relative}
.chip{background:var(--card);border-radius:14px;padding:10px 14px;font-size:13px;box-shadow:0 6px 18px rgba(20,30,60,.08)}
.chip b{display:block;font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
h2{font-size:18px;margin:28px 22px 12px}
.works{display:flex;gap:10px;overflow-x:auto;padding:0 22px 4px;scroll-snap-type:x mandatory;scrollbar-width:none}
.works::-webkit-scrollbar{display:none}
.w{flex:0 0 120px;height:120px;border-radius:20px;scroll-snap-align:start;background:linear-gradient(140deg,color-mix(in srgb,var(--accent) 65%,#fff),color-mix(in srgb,var(--accent) 25%,#fff));position:relative;overflow:hidden;display:flex;align-items:flex-end}
.w img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.w span{position:relative;margin:8px;font-size:11px;background:rgba(255,255,255,.9);padding:3px 8px;border-radius:999px}
.group{margin:0 16px 8px;background:var(--card);border-radius:22px;overflow:hidden}
.gt{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:16px 18px 4px}
.it{display:flex;align-items:center;gap:14px;width:100%;padding:14px 18px;border:0;background:none;text-align:left;font:inherit;color:inherit;cursor:pointer;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.it:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.it .t{flex:1;min-width:0}
.it .t b{display:block;font-weight:500}
.it .t small{color:var(--muted);font-size:13px}
.it .p{font-weight:700;white-space:nowrap}
.tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:grid;place-items:center;transition:.15s}
.it[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent)}
.it[aria-pressed="true"] .tick::after{content:"";width:9px;height:5px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.contact{margin:24px 16px 0;padding:18px;background:var(--card);border-radius:22px;display:grid;gap:4px;font-size:14px;color:var(--muted)}
.contact b{color:var(--ink)}
.bar{position:fixed;left:50%;bottom:16px;transform:translate(-50%,150%);width:min(488px,calc(100% - 32px));background:var(--ink);color:#fff;border-radius:22px;padding:12px 12px 12px 20px;display:flex;align-items:center;gap:12px;transition:transform .3s;z-index:20}
.bar.show{transform:translate(-50%,0)}
.bar div{flex:1;font-size:14px}.bar div b{display:block;font-size:17px}
.btn{border:0;border-radius:16px;padding:13px 20px;background:var(--accent);color:#fff;font:700 15px var(--f);cursor:pointer}
.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.shade{position:fixed;inset:0;background:rgba(15,20,35,.45);opacity:0;pointer-events:none;transition:.25s;z-index:30}
.shade.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(520px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;padding:10px 20px 24px;transform:translate(-50%,100%);transition:transform .3s;z-index:31}
.sheet.open{transform:translate(-50%,0)}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 14px}
.sheet h3{margin:0 0 8px;font-size:20px}
.sheet label{display:block;font-size:13px;color:var(--muted);margin-top:12px}
.sheet input{display:block;width:100%;margin-top:4px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--app);font:16px var(--f);color:var(--ink)}
.sheet textarea{width:100%;min-height:170px;margin-top:14px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--app);font:14px/1.5 var(--f);color:var(--ink);resize:vertical}
.ms{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ms a,.ms button{display:flex;justify-content:center;padding:12px;border-radius:14px;text-decoration:none;font-weight:700;font-size:14px;color:#fff;border:0;cursor:pointer;font-family:var(--f)}
.ms .tg{background:#229ed9}.ms .wa{background:#25a244}.ms .vk{background:#0077ff}.ms .tel,.ms button{background:var(--ink)}
</style>
</head>
<body>
<div class="app">
  <header class="head"><h1 id="brand"></h1><p id="tag"></p></header>
  <div class="chips" id="chips"></div>
  <h2 id="wt">Наши работы</h2>
  <div class="works" id="works"></div>
  <h2 id="st"></h2>
  <div id="list"></div>
  <div class="contact" id="contact"></div>
</div>
<div class="bar" id="bar" aria-live="polite"><div id="sum"></div><button class="btn" id="next" type="button">Далее</button></div>
<div class="shade" id="shade"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh">
  <div class="grab"></div>
  <h3 id="sh">Ваша заявка</h3>
  <div id="sel"></div>
  <label>Ваше имя<input id="fName" autocomplete="name"></label>
  <label><span id="whenLbl"></span><input id="fWhen"></label>
  <textarea id="txt" readonly aria-label="Текст заявки"></textarea>
  <div class="ms" id="ms"></div>
</div>
<script>
const CONFIG = (function () { var d = /*CONFIG*/{}/*/CONFIG*/; try { if (/[?&]preview/.test(location.search)) { var p = localStorage.getItem("draft:" + location.pathname.replace(/[^/]*$/, "")); if (p) return JSON.parse(p); } } catch (e) {} return d; })();
</script>
<script>
/* ===== ЯДРО: корзина, текст заявки, мессенджеры. Менять не нужно. ===== */
const K = (function () {
  const C = CONFIG;
  const money = (n) => new Intl.NumberFormat("ru-RU").format(n) + " " + C.currency;
  const KEY = "k:" + location.pathname + ":" + C.brand;
  const st = { cart: {}, form: {} };
  try { Object.assign(st, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
  const byId = (id) => C.services.find((s) => s.id === id);
  Object.keys(st.cart).forEach((id) => { if (!byId(id)) delete st.cart[id]; });
  const subs = [];
  const emit = () => { save(); subs.forEach((f) => f()); };
  const pad = (n) => String(n).padStart(2, "0");
  const toMin = (t) => { const [a, b] = t.split(":").map(Number); return a * 60 + b; };
  const B = Object.assign({ open: "10:00", close: "20:00", step: 60, days: [0, 1, 2, 3, 4, 5, 6] }, C.booking);

  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (v == null || v === false) return;
      if (k === "class") e.className = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    });
    kids.flat().forEach((c) => { if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c)); });
    return e;
  }

  const st0 = document.createElement("style");
  st0.textContent = "[hidden]{display:none!important}.k-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:#111;color:#fff;padding:11px 18px;border-radius:12px;font:14px/1.4 system-ui,sans-serif;opacity:0;transition:.25s;z-index:999;pointer-events:none;max-width:calc(100% - 32px);text-align:center}.k-toast.show{opacity:1;transform:translate(-50%,0)}";
  document.head.prepend(st0);
  let toastEl, toastT;
  function toast(msg) {
    if (!toastEl) { toastEl = h("div", { class: "k-toast", role: "status" }); document.body.append(toastEl); }
    toastEl.textContent = msg; toastEl.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove("show"), 2400);
  }

  const api = {
    C, h, money, byId, toast, pad,
    qty: (id) => st.cart[id] || 0,
    set(id, q) { if (q <= 0) delete st.cart[id]; else st.cart[id] = Math.min(q, 99); emit(); },
    toggle(id) { api.set(id, api.qty(id) ? 0 : 1); },
    clear() { st.cart = {}; emit(); },
    items: () => Object.keys(st.cart).map((id) => ({ s: byId(id), q: st.cart[id] })).filter((x) => x.s),
    count: () => api.items().reduce((a, x) => a + x.q, 0),
    total: () => api.items().reduce((a, x) => a + (x.s.price || 0) * x.q, 0),
    onRequest: () => api.items().some((x) => !x.s.price),
    on: (f) => subs.push(f),
    field(k, v) { if (v === undefined) return st.form[k] || ""; st.form[k] = v; save(); },
    cats: () => [...new Set(C.services.map((s) => s.category).filter(Boolean))],
    price: (s) => (s.price ? money(s.price) : "по договорённости"),

    /* текст заявки; extra — массив [подпись, значение] */
    text(extra) {
      const L = [C.order.greeting, ""];
      api.items().forEach((x, i) => L.push((i + 1) + ". " + x.s.name + (x.q > 1 ? " × " + x.q : "") + " — " + (x.s.price ? money(x.s.price * x.q) : "по договорённости")));
      if (!api.items().length) L.push("(услуги обсудим)");
      L.push("");
      if (api.total() > 0) L.push("Итого: " + money(api.total()) + (api.onRequest() ? " + позиции по договорённости" : ""));
      (extra || []).forEach(([k, v]) => { if (v && String(v).trim()) L.push(k + ": " + String(v).trim()); });
      if (C.order.closing) L.push("", C.order.closing);
      return L.join("\n");
    },

    /* ссылки на мессенджеры владельца */
    links(text) {
      const m = C.messengers || {}, out = [];
      if (m.telegram) out.push({ k: "tg", label: "Telegram", href: "https://t.me/" + m.telegram });
      if (m.whatsapp) out.push({ k: "wa", label: "WhatsApp", href: "https://wa.me/" + m.whatsapp + (text ? "?text=" + encodeURIComponent(text) : "") });
      if (m.vk) out.push({ k: "vk", label: "ВКонтакте", href: "https://vk.me/" + m.vk });
      if (C.phone) out.push({ k: "tel", label: "Позвонить", href: "tel:" + C.phone.replace(/[^\d+]/g, "") });
      return out;
    },
    tel: () => (C.phone ? "tel:" + C.phone.replace(/[^\d+]/g, "") : null),

    copy(text) {
      const ok = () => toast("Текст скопирован — вставьте его в чат");
      const fb = () => {
        const t = h("textarea", { style: "position:fixed;opacity:0" }); t.value = text; document.body.append(t); t.select();
        let done = false; try { done = document.execCommand("copy"); } catch (e) {}
        t.remove(); done ? ok() : toast("Не получилось скопировать — выделите текст вручную");
      };
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, fb); else fb();
    },


    /* готовый блок заявки: список, поля, итог, текст, мессенджеры. Оформляется классами op-* */
    panel(box, opt) {
      opt = opt || {};
      const UI = C.ui || {};
      const fields = opt.fields || [["fName", "Ваше имя"], ["fWhen", UI.whenLabel || "Когда удобно"], ["fNote", "Комментарий"]];
      const list = h("div", { class: "op-list" }), total = h("div", { class: "op-total" });
      const ta = h("textarea", { class: "op-text", readonly: true, "aria-label": "Текст заявки" });
      const links = h("div", { class: "op-links" });
      const inputs = fields.map(([id, label]) => {
        const i = h("input", { id: "op-" + id }); i.value = api.field(id);
        i.addEventListener("input", () => { api.field(id, i.value); refreshText(); });
        return h("label", { class: "op-field" }, h("span", {}, label), i);
      });
      box.append(list, h("div", { class: "op-fields" }, inputs), total, ta, links);
      const extra = () => fields.map(([id, label]) => [id === "fWhen" ? (UI.whenText || "Когда") : id === "fName" ? "Имя" : label.replace(/ \(.*\)$/, ""), api.field(id)]).concat(opt.extra ? opt.extra() : []);
      function refreshText() {
        const t = api.text(extra()); ta.value = t; links.innerHTML = "";
        links.append(h("button", { type: "button", class: "op-copy", onclick: () => api.copy(t) }, "Скопировать текст"));
        api.links(t).forEach((x) => links.append(h("a", { class: "op-" + x.k, href: x.href, target: x.k === "tel" ? null : "_blank", rel: "noopener", onclick: () => x.k !== "wa" && x.k !== "tel" && api.copy(t) }, x.label)));
      }
      function refresh() {
        list.innerHTML = "";
        if (!api.items().length) list.append(h("p", { class: "op-empty" }, opt.empty || "Пока ничего не выбрано."));
        api.items().forEach((x) => list.append(h("div", { class: "op-row" },
          h("div", { class: "op-nm" }, x.s.name, h("small", {}, x.s.price ? api.money(x.s.price * x.q) : "по договорённости")),
          h("div", { class: "op-qty" },
            h("button", { type: "button", "aria-label": "Меньше", onclick: () => api.set(x.s.id, x.q - 1) }, "−"),
            h("span", {}, String(x.q)),
            h("button", { type: "button", "aria-label": "Больше", onclick: () => api.set(x.s.id, x.q + 1) }, "+")))));
        total.innerHTML = "";
        if (api.total()) total.append(h("span", {}, "Итого"), h("b", {}, api.money(api.total())));
        refreshText();
      }
      api.on(refresh); refresh();
      return { refresh };
    },
    /* график: открыто ли сейчас, ближайшие рабочие дни, свободное время */
    status() {
      if (!B.status) return { open: false, text: "" };
      const d = new Date(), m = d.getHours() * 60 + d.getMinutes();
      const open = B.days.includes(d.getDay()) && m >= toMin(B.open) && m < toMin(B.close);
      return open ? { open: true, text: "Открыто до " + B.close } : { open: false, text: "Сейчас закрыто · откроемся в " + B.open };
    },
    days(n) {
      const out = [], d = new Date(); d.setHours(0, 0, 0, 0);
      for (let i = 0; out.length < n && i < 60; i++) {
        const x = new Date(d); x.setDate(d.getDate() + i);
        if (B.days.includes(x.getDay())) out.push(x);
      }
      return out;
    },
    slots(date) {
      const out = [], now = new Date(), today = date.toDateString() === now.toDateString();
      for (let t = toMin(B.open); t + B.step <= toMin(B.close); t += B.step) {
        if (today && t <= now.getHours() * 60 + now.getMinutes() + 30) continue;
        out.push(pad(Math.floor(t / 60)) + ":" + pad(t % 60));
      }
      return out;
    },
    dayLabel(d) {
      const now = new Date(); now.setHours(0, 0, 0, 0);
      const diff = Math.round((d - now) / 864e5);
      const wd = d.toLocaleDateString("ru-RU", { weekday: "short" });
      return diff === 0 ? "Сегодня" : diff === 1 ? "Завтра" : wd.charAt(0).toUpperCase() + wd.slice(1) + ", " + d.getDate();
    },
    dateText: (d) => d.toLocaleDateString("ru-RU", { day: "numeric", month: "long", weekday: "long" })
  };
  return api;
})();

</script>
<script>
(function () {
  const { C, h } = K, $ = (id) => document.getElementById(id);
  document.documentElement.style.setProperty("--accent", C.accent);
  $("brand").textContent = C.brand; $("tag").textContent = C.tagline;
  $("st").textContent = (C.ui && C.ui.servicesTitle) || "Услуги";
  [["Сейчас", K.status().text], ["Часы", C.hours], ["Адрес", C.address]].forEach(([k, v]) => v && $("chips").append(h("div", { class: "chip" }, h("b", {}, k), v)));
  (C.works || []).forEach((w) => $("works").append(h("div", { class: "w" }, w.image ? h("img", { src: w.image, alt: w.title || "" }) : null, h("span", {}, w.title))));
  if (!(C.works || []).length) { $("wt").hidden = true; $("works").hidden = true; }
  K.cats().forEach((cat) => {
    const g = h("div", { class: "group" }, h("div", { class: "gt" }, cat));
    C.services.filter((s) => s.category === cat).forEach((s) => {
      g.append(h("button", { class: "it", type: "button", "data-id": s.id, "aria-pressed": "false", onclick: () => K.toggle(s.id) },
        h("span", { class: "t" }, h("b", {}, s.name), s.desc ? h("small", {}, s.desc) : null),
        h("span", { class: "p" }, s.price ? K.money(s.price) : "дог."), h("span", { class: "tick", "aria-hidden": "true" })));
    });
    $("list").append(g);
  });
  [["Телефон", C.phone], ["Адрес", C.address], ["Email", C.email]].forEach(([k, v]) => v && $("contact").append(h("div", {}, k + ": ", h("b", {}, v))));
  $("whenLbl").textContent = (C.ui && C.ui.whenLabel) || "Когда удобно";
  ["fName", "fWhen"].forEach((id) => { $(id).value = K.field(id); $(id).addEventListener("input", () => { K.field(id, $(id).value); fill(); }); });

  function fill() {
    const t = K.text([["Имя", $("fName").value], [(C.ui && C.ui.whenText) || "Когда", $("fWhen").value]]);
    $("txt").value = t;
    $("sel").innerHTML = "";
    K.items().forEach((x) => $("sel").append(h("div", { class: "li", style: "display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)" }, h("span", {}, x.s.name), h("b", {}, K.price(x.s)))));
    const ms = $("ms"); ms.innerHTML = "";
    ms.append(h("button", { type: "button", onclick: () => K.copy(t) }, "Скопировать"));
    K.links(t).forEach((x) => ms.append(h("a", { class: x.k, href: x.href, target: x.k === "tel" ? null : "_blank", rel: "noopener", onclick: () => x.k !== "wa" && x.k !== "tel" && K.copy(t) }, x.label)));
  }
  function upd() {
    document.querySelectorAll(".it").forEach((b) => b.setAttribute("aria-pressed", K.qty(b.dataset.id) ? "true" : "false"));
    const n = K.count();
    $("bar").classList.toggle("show", n > 0);
    $("sum").innerHTML = ""; $("sum").append(n + " " + (n === 1 ? "позиция" : n < 5 ? "позиции" : "позиций"), h("b", {}, K.total() ? K.money(K.total()) : "по договорённости"));
    if (!n) close();
  }
  const open = () => { fill(); $("sheet").classList.add("open"); $("shade").classList.add("open"); };
  const close = () => { $("sheet").classList.remove("open"); $("shade").classList.remove("open"); };
  $("next").onclick = open; $("shade").onclick = close;
  document.addEventListener("keydown", (e) => e.key === "Escape" && close());
  K.on(upd); upd();
})();
</script>
<script>
(function () { if (!CONFIG.demo && !/[?&]preview/.test(location.search)) return;
  var p = /[?&]preview/.test(location.search);
  var b = document.createElement("div");
  b.style.cssText = "position:relative;z-index:99;background:#111;color:#fff;font:14px/1.4 system-ui,sans-serif;padding:9px 16px;text-align:center";
  b.innerHTML = p ? "Предпросмотр ваших изменений — видно только на этом устройстве · <a href='admin/' style='color:#ffd54a'>вернуться в кабинет</a>"
                  : "Демо-версия сайта · цены примерные · <a href='admin/' style='color:#ffd54a'>✎ войти в кабинет и изменить</a>";
  document.body.prepend(b); })();
</script>
</body>
</html>
