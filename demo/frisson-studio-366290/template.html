<!doctype html>
<html lang="ru">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Название бренда</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Стиль 14 «Полароид»: альбом на крафтовой бумаге — снимки, скотч, записки от руки.
   Средний: лайтбокс для фото, отзывы-стикеры, «мой список» вместо корзины. */
:root{--accent:#2f6f5e;--kraft:#d8c3a0;--kraft2:#cdb58e;--paper:#fffdf6;--ink:#2d2620;--muted:#6f6355;--tape:rgba(255,248,214,.75);
  --hand:"Caveat","Segoe Print","Comic Sans MS",cursive;--txt:"Lora",Georgia,serif}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:17px/1.6 var(--txt);background:var(--kraft);background-image:radial-gradient(rgba(90,60,20,.10) 1px,transparent 1.2px),radial-gradient(rgba(255,255,255,.18) 1px,transparent 1.4px);background-size:7px 7px,11px 11px;background-position:0 0,3px 5px;overflow-x:hidden}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:var(--hand);font-weight:700;line-height:1;margin:0}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:18px;padding-bottom:18px}
.brand{font:700 34px var(--hand);text-decoration:none;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top nav{display:flex;gap:20px}.top nav a{font:600 22px var(--hand);color:var(--ink);text-decoration:none}
.top nav a:hover{color:var(--accent)}
.listb{font:700 22px var(--hand);background:var(--paper);border:0;padding:8px 16px;cursor:pointer;transform:rotate(2deg);box-shadow:2px 3px 0 rgba(0,0,0,.15);color:var(--ink);white-space:nowrap}
.listb b{color:var(--accent)}
@media(max-width:760px){.top nav{display:none}}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:30px;align-items:center;padding:30px 0 70px}
.hero h1{font-size:clamp(54px,9vw,104px);color:var(--ink);overflow-wrap:anywhere}
.hero h1 u{text-decoration:none;background:linear-gradient(transparent 62%,color-mix(in srgb,var(--accent) 45%,transparent) 0)}
.hero p{font-size:19px;max-width:42ch;margin:18px 0 26px}
.btn{display:inline-block;font:700 24px var(--hand);background:var(--ink);color:var(--paper);padding:8px 22px;text-decoration:none;border:0;cursor:pointer;transform:rotate(-1.5deg);box-shadow:3px 4px 0 rgba(0,0,0,.2)}
.btn:hover{background:var(--accent)}
.btn:focus-visible,.listb:focus-visible,.pol:focus-visible,.note button:focus-visible{outline:3px dashed var(--accent);outline-offset:4px}
.stack{position:relative;height:420px}
.pol{position:absolute;width:62%;max-width:280px;background:var(--paper);padding:12px 12px 46px;box-shadow:4px 8px 18px rgba(60,40,10,.28);border:0;cursor:zoom-in;transition:transform .25s}
.pol .ph{aspect-ratio:1;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 60%,#e8e0cf),color-mix(in srgb,var(--accent) 22%,#f4ecda));position:relative;overflow:hidden}
.pol img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pol figcaption,.pol .cap{position:absolute;left:0;right:0;bottom:8px;text-align:center;font:600 24px var(--hand);color:var(--ink)}
.pol::before{content:"";position:absolute;top:-12px;left:50%;width:90px;height:26px;background:var(--tape);transform:translateX(-50%) rotate(-3deg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.stack .pol:nth-child(1){left:0;top:30px;transform:rotate(-7deg)}
.stack .pol:nth-child(2){left:22%;top:0;transform:rotate(4deg);z-index:2}
.stack .pol:nth-child(3){right:0;top:120px;transform:rotate(-2deg);z-index:3}
.stack .pol:hover{transform:rotate(0) scale(1.03);z-index:5}
@media(max-width:820px){.hero{grid-template-columns:1fr}.stack{height:360px}}
section{padding:40px 0 70px}
.sh{font-size:clamp(46px,7vw,72px);margin-bottom:6px}
.sub{max-width:58ch;margin:0 0 30px;font-style:italic;color:var(--muted)}
.cat{font:700 34px var(--hand);margin:26px 0 14px;color:var(--accent)}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:26px 22px}
.note{background:var(--paper);padding:26px 20px 18px;position:relative;box-shadow:2px 5px 12px rgba(60,40,10,.2);background-image:repeating-linear-gradient(transparent 0 27px,rgba(80,120,170,.18) 27px 28px);background-position:0 52px;display:flex;flex-direction:column;gap:6px}
.note:nth-child(3n+1){transform:rotate(-1.2deg)}.note:nth-child(3n+2){transform:rotate(1deg)}.note:nth-child(3n){transform:rotate(-.4deg)}
.note::before{content:"";position:absolute;top:-9px;left:50%;width:16px;height:16px;border-radius:50%;background:var(--accent);transform:translateX(-50%);box-shadow:inset -3px -3px 0 rgba(0,0,0,.25),1px 2px 3px rgba(0,0,0,.3)}
.note h3{font-size:30px}
.note p{margin:0;font-size:15px;color:var(--muted);flex:1}
.note .r{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.note .pr{font:700 28px var(--hand)}
.note .pr small{font:italic 13px var(--txt);color:var(--muted)}
.note button{font:700 21px var(--hand);background:none;border:2px solid var(--ink);border-radius:30px 26px 34px 24px;padding:3px 14px;cursor:pointer;color:var(--ink)}
.note button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:34px 26px;padding-top:14px}
.gal .pol{position:relative;width:100%;max-width:none}
.gal .pol:nth-child(odd){transform:rotate(-2.5deg)}.gal .pol:nth-child(even){transform:rotate(2deg)}
.gal .pol:hover{transform:rotate(0) scale(1.03)}
.stickies{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:24px}
.sticky{padding:22px 20px;box-shadow:2px 6px 10px rgba(60,40,10,.22);font:600 25px/1.15 var(--hand)}
.sticky:nth-child(3n+1){background:#fff59a;transform:rotate(-2deg)}.sticky:nth-child(3n+2){background:#ffc9d6;transform:rotate(1.5deg)}.sticky:nth-child(3n){background:#c9ecff;transform:rotate(-.5deg)}
.sticky b{display:block;margin-top:12px;font-size:22px}
.sticky .st{color:#c18a00;letter-spacing:2px;font-size:18px}
.book{background:var(--paper);padding:34px clamp(20px,4vw,48px);box-shadow:3px 8px 20px rgba(60,40,10,.25);display:grid;grid-template-columns:1.2fr 1fr;gap:34px;position:relative}
.book::before{content:"";position:absolute;left:clamp(10px,2vw,24px);top:0;bottom:0;border-left:2px solid rgba(200,60,60,.35)}
.book p{margin:0 0 12px}
.cl{display:grid;gap:6px}
.cl a,.cl div{color:var(--ink);text-decoration:none;font:600 24px var(--hand)}
.cl a:hover{color:var(--accent)}
.cl small{display:block;font:italic 13px var(--txt);color:var(--muted)}
@media(max-width:760px){.book{grid-template-columns:1fr}}
footer{padding:10px 0 50px;text-align:center;font:600 22px var(--hand);color:var(--muted)}
/* лайтбокс */
.lb{position:fixed;inset:0;background:rgba(30,20,10,.82);z-index:50;display:flex;align-items:center;justify-content:center;gap:12px;padding:16px}
.lb[hidden]{display:none}
.lb .pol{position:relative;width:min(520px,82vw);max-width:none;transform:rotate(-1deg);cursor:default}
.lb .nav{background:var(--paper);border:0;width:46px;height:46px;border-radius:50%;font-size:22px;cursor:pointer;flex-shrink:0}
.lb .cls{position:absolute;top:16px;right:16px}
/* мой список */
.sheet{position:fixed;right:16px;bottom:16px;width:min(400px,calc(100% - 32px));max-height:calc(100vh - 32px);overflow:auto;background:var(--paper);z-index:45;padding:22px 20px;box-shadow:4px 10px 30px rgba(40,25,5,.4);transform:translateY(calc(100% + 40px)) rotate(2deg);transition:transform .3s;background-image:repeating-linear-gradient(transparent 0 27px,rgba(80,120,170,.15) 27px 28px)}
.sheet{visibility:hidden;transition:transform .3s,visibility 0s .3s}.sheet.open{transform:rotate(-.6deg);visibility:visible;transition:transform .3s}
.sheet h2{font-size:40px}
.sheet .cls{position:absolute;right:12px;top:10px;font:700 28px var(--hand);background:none;border:0;cursor:pointer;color:var(--ink)}
.op-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0}
.op-nm{font:600 23px/1.1 var(--hand)}.op-nm small{display:block;font:italic 13px var(--txt);color:var(--muted)}
.op-qty{display:flex;align-items:center;gap:4px}
.op-qty button{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);background:none;cursor:pointer;font-size:16px}
.op-qty span{min-width:20px;text-align:center;font:700 22px var(--hand)}
.op-empty{font:600 22px var(--hand);color:var(--muted)}
.op-field{display:block;margin-top:10px}
.op-field span{font:600 20px var(--hand);color:var(--muted)}
.op-field input{display:block;width:100%;border:0;border-bottom:2px solid var(--ink);background:transparent;font:16px var(--txt);padding:6px 0;color:var(--ink)}
.op-field input:focus{outline:0;border-color:var(--accent)}
.op-total{display:flex;justify-content:space-between;font:700 30px var(--hand);margin-top:12px}
.op-text{width:100%;min-height:150px;margin-top:10px;border:2px dashed var(--muted);background:rgba(255,255,255,.7);font:14px/1.5 var(--txt);padding:10px;color:var(--ink);resize:vertical}
.op-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.op-links a,.op-links button{font:700 20px var(--hand);padding:4px 14px;border:2px solid var(--ink);border-radius:24px 30px 22px 28px;text-decoration:none;color:var(--ink);background:none;cursor:pointer}
.op-copy{background:var(--ink)!important;color:var(--paper)!important}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" id="brand" href="#top"></a>
  <nav><a href="#services">Услуги</a><a href="#works">Фото</a><a href="#reviews">Отзывы</a><a href="#contacts">Контакты</a></nav>
  <button class="listb" id="listb" type="button">Мой список · <b id="cnt">0</b></button>
</div></header>
<main id="top" class="wrap">
  <div class="hero">
    <div><h1 id="h1"></h1><p id="lead"></p><a class="btn" href="#services" id="choose"></a></div>
    <div class="stack" id="stack"></div>
  </div>
  <section id="services"><h2 class="sh" id="sTitle"></h2><p class="sub" id="sSub"></p><div id="cats"></div></section>
  <section id="works"><h2 class="sh">Наши снимки</h2><p class="sub" id="wSub"></p><div class="gal" id="gal"></div></section>
  <section id="reviews"><h2 class="sh">Что говорят</h2><p class="sub">Записки от наших клиентов.</p><div class="stickies" id="stickies"></div></section>
  <section id="contacts"><div class="book"><div><h2 class="sh" style="font-size:52px">О нас</h2><div id="about"></div></div><div><h2 class="sh" style="font-size:52px">Как найти</h2><div class="cl" id="cl"></div></div></div></section>
</main>
<footer id="foot"></footer>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Просмотр фото">
  <button class="nav" id="lbPrev" type="button" aria-label="Предыдущее фото">←</button>
  <figure class="pol" id="lbPol" style="margin:0"><div class="ph" id="lbPh"></div><figcaption id="lbCap"></figcaption></figure>
  <button class="nav" id="lbNext" type="button" aria-label="Следующее фото">→</button>
  <button class="nav cls" id="lbX" type="button" aria-label="Закрыть">×</button>
</div>
<aside class="sheet" id="sheet" role="dialog" aria-labelledby="lt"><button class="cls" id="sx" type="button" aria-label="Закрыть">×</button><h2 id="lt">Мой список</h2><div id="panel"></div></aside>
<script>
const CONFIG = (function () { var d = /*CONFIG*/{}/*/CONFIG*/; try { if (/[?&]preview/.test(location.search)) { var p = localStorage.getItem("draft:" + location.pathname.replace(/[^/]*$/, "")); if (p) return JSON.parse(p); } } catch (e) {} return d; })();
</script>
<script>
/* ===== ЯДРО: корзина, текст заявки, мессенджеры. Менять не нужно. ===== */
const K = (function () {
  const C = CONFIG;
  const money = (n) => new Intl.NumberFormat("ru-RU").format(n) + " " + C.currency;
  const KEY = "k:" + location.pathname + ":" + C.brand;
  const st = { cart: {}, form: {} };
  try { Object.assign(st, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
  const byId = (id) => C.services.find((s) => s.id === id);
  Object.keys(st.cart).forEach((id) => { if (!byId(id)) delete st.cart[id]; });
  const subs = [];
  const emit = () => { save(); subs.forEach((f) => f()); };
  const pad = (n) => String(n).padStart(2, "0");
  const toMin = (t) => { const [a, b] = t.split(":").map(Number); return a * 60 + b; };
  const B = Object.assign({ open: "10:00", close: "20:00", step: 60, days: [0, 1, 2, 3, 4, 5, 6] }, C.booking);

  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (v == null || v === false) return;
      if (k === "class") e.className = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    });
    kids.flat().forEach((c) => { if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c)); });
    return e;
  }

  const st0 = document.createElement("style");
  st0.textContent = "[hidden]{display:none!important}.k-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:#111;color:#fff;padding:11px 18px;border-radius:12px;font:14px/1.4 system-ui,sans-serif;opacity:0;transition:.25s;z-index:999;pointer-events:none;max-width:calc(100% - 32px);text-align:center}.k-toast.show{opacity:1;transform:translate(-50%,0)}";
  document.head.prepend(st0);
  let toastEl, toastT;
  function toast(msg) {
    if (!toastEl) { toastEl = h("div", { class: "k-toast", role: "status" }); document.body.append(toastEl); }
    toastEl.textContent = msg; toastEl.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove("show"), 2400);
  }

  const api = {
    C, h, money, byId, toast, pad,
    qty: (id) => st.cart[id] || 0,
    set(id, q) { if (q <= 0) delete st.cart[id]; else st.cart[id] = Math.min(q, 99); emit(); },
    toggle(id) { api.set(id, api.qty(id) ? 0 : 1); },
    clear() { st.cart = {}; emit(); },
    items: () => Object.keys(st.cart).map((id) => ({ s: byId(id), q: st.cart[id] })).filter((x) => x.s),
    count: () => api.items().reduce((a, x) => a + x.q, 0),
    total: () => api.items().reduce((a, x) => a + (x.s.price || 0) * x.q, 0),
    onRequest: () => api.items().some((x) => !x.s.price),
    on: (f) => subs.push(f),
    field(k, v) { if (v === undefined) return st.form[k] || ""; st.form[k] = v; save(); },
    cats: () => [...new Set(C.services.map((s) => s.category).filter(Boolean))],
    price: (s) => (s.price ? money(s.price) : "по договорённости"),

    /* текст заявки; extra — массив [подпись, значение] */
    text(extra) {
      const L = [C.order.greeting, ""];
      api.items().forEach((x, i) => L.push((i + 1) + ". " + x.s.name + (x.q > 1 ? " × " + x.q : "") + " — " + (x.s.price ? money(x.s.price * x.q) : "по договорённости")));
      if (!api.items().length) L.push("(услуги обсудим)");
      L.push("");
      if (api.total() > 0) L.push("Итого: " + money(api.total()) + (api.onRequest() ? " + позиции по договорённости" : ""));
      (extra || []).forEach(([k, v]) => { if (v && String(v).trim()) L.push(k + ": " + String(v).trim()); });
      if (C.order.closing) L.push("", C.order.closing);
      return L.join("\n");
    },

    /* ссылки на мессенджеры владельца */
    links(text) {
      const m = C.messengers || {}, out = [];
      if (m.telegram) out.push({ k: "tg", label: "Telegram", href: "https://t.me/" + m.telegram });
      if (m.whatsapp) out.push({ k: "wa", label: "WhatsApp", href: "https://wa.me/" + m.whatsapp + (text ? "?text=" + encodeURIComponent(text) : "") });
      if (m.vk) out.push({ k: "vk", label: "ВКонтакте", href: "https://vk.me/" + m.vk });
      if (C.phone) out.push({ k: "tel", label: "Позвонить", href: "tel:" + C.phone.replace(/[^\d+]/g, "") });
      return out;
    },
    tel: () => (C.phone ? "tel:" + C.phone.replace(/[^\d+]/g, "") : null),

    copy(text) {
      const ok = () => toast("Текст скопирован — вставьте его в чат");
      const fb = () => {
        const t = h("textarea", { style: "position:fixed;opacity:0" }); t.value = text; document.body.append(t); t.select();
        let done = false; try { done = document.execCommand("copy"); } catch (e) {}
        t.remove(); done ? ok() : toast("Не получилось скопировать — выделите текст вручную");
      };
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, fb); else fb();
    },


    /* готовый блок заявки: список, поля, итог, текст, мессенджеры. Оформляется классами op-* */
    panel(box, opt) {
      opt = opt || {};
      const UI = C.ui || {};
      const fields = opt.fields || [["fName", "Ваше имя"], ["fWhen", UI.whenLabel || "Когда удобно"], ["fNote", "Комментарий"]];
      const list = h("div", { class: "op-list" }), total = h("div", { class: "op-total" });
      const ta = h("textarea", { class: "op-text", readonly: true, "aria-label": "Текст заявки" });
      const links = h("div", { class: "op-links" });
      const inputs = fields.map(([id, label]) => {
        const i = h("input", { id: "op-" + id }); i.value = api.field(id);
        i.addEventListener("input", () => { api.field(id, i.value); refreshText(); });
        return h("label", { class: "op-field" }, h("span", {}, label), i);
      });
      box.append(list, h("div", { class: "op-fields" }, inputs), total, ta, links);
      const extra = () => fields.map(([id, label]) => [id === "fWhen" ? (UI.whenText || "Когда") : id === "fName" ? "Имя" : label.replace(/ \(.*\)$/, ""), api.field(id)]).concat(opt.extra ? opt.extra() : []);
      function refreshText() {
        const t = api.text(extra()); ta.value = t; links.innerHTML = "";
        links.append(h("button", { type: "button", class: "op-copy", onclick: () => api.copy(t) }, "Скопировать текст"));
        api.links(t).forEach((x) => links.append(h("a", { class: "op-" + x.k, href: x.href, target: x.k === "tel" ? null : "_blank", rel: "noopener", onclick: () => x.k !== "wa" && x.k !== "tel" && api.copy(t) }, x.label)));
      }
      function refresh() {
        list.innerHTML = "";
        if (!api.items().length) list.append(h("p", { class: "op-empty" }, opt.empty || "Пока ничего не выбрано."));
        api.items().forEach((x) => list.append(h("div", { class: "op-row" },
          h("div", { class: "op-nm" }, x.s.name, h("small", {}, x.s.price ? api.money(x.s.price * x.q) : "по договорённости")),
          h("div", { class: "op-qty" },
            h("button", { type: "button", "aria-label": "Меньше", onclick: () => api.set(x.s.id, x.q - 1) }, "−"),
            h("span", {}, String(x.q)),
            h("button", { type: "button", "aria-label": "Больше", onclick: () => api.set(x.s.id, x.q + 1) }, "+")))));
        total.innerHTML = "";
        if (api.total()) total.append(h("span", {}, "Итого"), h("b", {}, api.money(api.total())));
        refreshText();
      }
      api.on(refresh); refresh();
      return { refresh };
    },
    /* график: открыто ли сейчас, ближайшие рабочие дни, свободное время */
    status() {
      if (!B.status) return { open: false, text: "" };
      const d = new Date(), m = d.getHours() * 60 + d.getMinutes();
      const open = B.days.includes(d.getDay()) && m >= toMin(B.open) && m < toMin(B.close);
      return open ? { open: true, text: "Открыто до " + B.close } : { open: false, text: "Сейчас закрыто · откроемся в " + B.open };
    },
    days(n) {
      const out = [], d = new Date(); d.setHours(0, 0, 0, 0);
      for (let i = 0; out.length < n && i < 60; i++) {
        const x = new Date(d); x.setDate(d.getDate() + i);
        if (B.days.includes(x.getDay())) out.push(x);
      }
      return out;
    },
    slots(date) {
      const out = [], now = new Date(), today = date.toDateString() === now.toDateString();
      for (let t = toMin(B.open); t + B.step <= toMin(B.close); t += B.step) {
        if (today && t <= now.getHours() * 60 + now.getMinutes() + 30) continue;
        out.push(pad(Math.floor(t / 60)) + ":" + pad(t % 60));
      }
      return out;
    },
    dayLabel(d) {
      const now = new Date(); now.setHours(0, 0, 0, 0);
      const diff = Math.round((d - now) / 864e5);
      const wd = d.toLocaleDateString("ru-RU", { weekday: "short" });
      return diff === 0 ? "Сегодня" : diff === 1 ? "Завтра" : wd.charAt(0).toUpperCase() + wd.slice(1) + ", " + d.getDate();
    },
    dateText: (d) => d.toLocaleDateString("ru-RU", { day: "numeric", month: "long", weekday: "long" })
  };
  return api;
})();

</script>
