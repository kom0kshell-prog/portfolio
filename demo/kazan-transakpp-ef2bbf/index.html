<!doctype html>
<html lang="ru">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TransAkpp-Service — Ремонт АКПП в Казани</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Roboto+Condensed:wght@400;500;700&display=swap">
<style>
/* Стиль 13 «Мастерская»: индустриальный — сталь, сигнальная лента, трафаретные заголовки.
   Средний: вкладки по категориям, корзина-выдвижка слева, частые вопросы. */
:root{--accent:#2f6f5e;--steel:#262a2e;--steel2:#33383d;--concrete:#e4e5e3;--plate:#f4f4f2;--ink:#17191b;--muted:#5f656b;--line:#c9cbc8;--warn:#f2c300;
  --d:"Russo One","Arial Black",sans-serif;--b:"Roboto Condensed","Arial Narrow",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--concrete);color:var(--ink);font:17px/1.55 var(--b)}
.tape{height:12px;background:repeating-linear-gradient(-45deg,var(--warn) 0 14px,#111 14px 28px)}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:var(--d);font-weight:400;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;margin:0}
.top{background:var(--steel);color:#fff;position:sticky;top:0;z-index:20;border-bottom:3px solid #111}
.top .wrap{display:flex;align-items:center;gap:18px;height:64px}
.brand{font-family:var(--d);font-size:20px;text-transform:uppercase;text-decoration:none;color:#fff;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top nav{display:flex;gap:18px}
.top nav a{color:#c8ccd0;text-decoration:none;text-transform:uppercase;font-weight:700;font-size:14px;letter-spacing:.06em}
.top nav a:hover{color:var(--warn)}
.phone{color:#fff;text-decoration:none;font-weight:700;white-space:nowrap}
.cartb{display:flex;align-items:center;gap:8px;background:var(--warn);color:#111;border:0;padding:10px 14px;font:700 15px var(--b);text-transform:uppercase;cursor:pointer;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.cartb b{background:#111;color:var(--warn);min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:13px}
@media(max-width:820px){.top nav,.phone{display:none}}
.hero{background:var(--steel2) radial-gradient(circle at 80% 20%,rgba(255,255,255,.06),transparent 60%);color:#fff;padding:64px 0 72px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;bottom:-40px;width:340px;height:340px;border:28px solid rgba(255,255,255,.05);border-radius:50%}
.hero .wrap{display:grid;grid-template-columns:1.4fr 1fr;gap:40px;align-items:end;position:relative;z-index:1}
.stamp{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--warn);color:var(--warn);padding:5px 12px;font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.08em}
.stamp i{width:9px;height:9px;border-radius:50%;background:#888}.stamp.open i{background:#4cd964}
.hero h1{font-size:clamp(40px,7vw,86px);margin:18px 0 16px;overflow-wrap:anywhere}
.hero p{font-size:19px;color:#c9cdd1;max-width:46ch;margin:0 0 28px}
.acts{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:15px 24px;font:700 16px var(--b);text-transform:uppercase;letter-spacing:.06em;text-decoration:none;border:0;cursor:pointer;background:var(--accent);color:#fff}
.btn.y{background:var(--warn);color:#111}.btn.o{background:transparent;border:2px solid #fff;color:#fff}
.btn:hover{filter:brightness(1.1)}
.btn:focus-visible,.cartb:focus-visible,.tab:focus-visible,summary:focus-visible{outline:3px solid var(--warn);outline-offset:3px}
.plates{display:grid;gap:12px}
.plate{background:linear-gradient(160deg,#4a5056,#383d42);border:1px solid #555b61;padding:18px 20px;position:relative}
.plate::before,.plate::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:#8a9096;box-shadow:inset -1px -1px 0 #555;top:8px}
.plate::before{left:8px}.plate::after{right:8px}
.plate b{display:block;font:400 34px var(--d);color:var(--warn)}
.plate span{color:#c9cdd1;text-transform:uppercase;font-size:13px;letter-spacing:.08em}
section{padding:72px 0}
.ttl{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.ttl::before{content:"";width:18px;height:18px;background:var(--accent)}
.ttl h2{font-size:clamp(28px,4vw,42px)}
.sub{color:var(--muted);max-width:60ch;margin:0 0 26px}
.tabs{display:flex;gap:0;overflow-x:auto;border-bottom:3px solid var(--ink);scrollbar-width:none}
.tab{flex-shrink:0;border:0;background:transparent;padding:12px 20px;font:700 15px var(--b);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.panel{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(270px,100%),1fr));gap:14px;padding-top:20px}
.svc{background:var(--plate);border:1px solid var(--line);border-top:5px solid var(--accent);padding:20px;display:flex;flex-direction:column;gap:8px}
.svc h3{font-size:19px}
.svc p{margin:0;color:var(--muted);font-size:15px;flex:1}
.svc .r{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.pr{font:400 22px var(--d)}.pr small{font:400 13px var(--b);color:var(--muted)}
.add{white-space:nowrap;border:2px solid var(--ink);background:transparent;padding:9px 14px;font:700 14px var(--b);text-transform:uppercase;cursor:pointer}
.add:hover,.add.on{background:var(--ink);color:#fff}
.qty{display:inline-flex;align-items:center;border:2px solid var(--ink)}
.qty button{width:36px;height:36px;border:0;background:transparent;font-size:20px;cursor:pointer}
.qty button:hover{background:var(--warn)}
.qty span{min-width:24px;text-align:center;font-weight:700}
.works{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:14px}
.w{aspect-ratio:4/3;position:relative;overflow:hidden;background:repeating-linear-gradient(45deg,#cfd1ce 0 10px,#d9dbd8 10px 20px);display:flex;align-items:flex-end;border:1px solid var(--line)}
.w img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.w span{position:relative;background:var(--ink);color:#fff;padding:6px 12px;font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.06em}
.dark{background:var(--steel);color:#fff}
.dark .sub{color:#b9bec3}
.faq{display:grid;gap:10px;max-width:820px}
details{background:var(--steel2);border-left:5px solid var(--warn)}
summary{padding:18px 20px;cursor:pointer;font-weight:700;font-size:18px;list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--d);color:var(--warn)}
details[open] summary::after{content:"−"}
details p{margin:0;padding:0 20px 18px;color:#c9cdd1}
.cgrid{display:grid;grid-template-columns:1fr 1.2fr;gap:24px}
.crow{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.crow span{color:var(--muted);text-transform:uppercase;font-size:13px;letter-spacing:.08em}
.crow b{text-align:right}
a.crow:hover b{color:var(--accent)}
.map{min-height:280px;background:#d6d8d5;background-image:linear-gradient(#c3c6c2 2px,transparent 2px),linear-gradient(90deg,#c3c6c2 2px,transparent 2px);background-size:56px 56px;position:relative;border:1px solid var(--line)}
.map .pin{position:absolute;left:50%;top:45%;transform:translate(-50%,-100%);background:var(--accent);color:#fff;padding:8px 14px;font-weight:700;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.map .pin::after{content:"";position:absolute;left:50%;bottom:-10px;border:10px solid transparent;border-top-color:var(--accent);border-bottom:0;transform:translateX(-50%)}
footer{background:#111;color:#8b9096;padding:22px 0 30px;font-size:14px}
@media(max-width:820px){.hero .wrap,.cgrid{grid-template-columns:1fr}.plates{grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))}}
/* корзина */
.shade{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.shade.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;left:0;top:0;bottom:0;width:min(440px,100%);background:var(--plate);z-index:41;transform:translateX(-100%);transition:transform .25s;display:flex;flex-direction:column;border-right:6px solid var(--warn)}
.drawer.open{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:var(--steel);color:#fff}
.dh h2{font-size:22px}
.x{background:none;border:2px solid #fff;color:#fff;width:36px;height:36px;font-size:20px;cursor:pointer}
.db{padding:16px 20px 24px;overflow:auto;flex:1}
.op-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.op-nm{font-weight:700}.op-nm small{display:block;font-weight:400;color:var(--muted)}
.op-qty{display:inline-flex;align-items:center;border:2px solid var(--ink)}
.op-qty button{width:32px;height:32px;border:0;background:none;font-size:18px;cursor:pointer}
.op-qty span{min-width:22px;text-align:center;font-weight:700}
.op-empty{color:var(--muted)}
.op-field{display:block;margin-top:12px}
.op-field span{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.op-field input{width:100%;margin-top:4px;padding:11px;border:2px solid var(--ink);background:#fff;font:16px var(--b);color:var(--ink)}
.op-field input:focus{outline:3px solid var(--warn)}
.op-total{display:flex;justify-content:space-between;margin-top:16px;font:400 22px var(--d)}
.op-text{width:100%;min-height:180px;margin-top:14px;padding:12px;border:2px dashed var(--ink);background:#fff;font:14px/1.5 var(--b);color:var(--ink);resize:vertical}
.op-links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.op-links a,.op-links button{display:flex;justify-content:center;padding:12px;font:700 14px var(--b);text-transform:uppercase;text-decoration:none;color:#fff;border:0;cursor:pointer}
.op-copy{grid-column:1/-1;background:var(--warn)!important;color:#111!important}
.op-tg{background:#229ed9}.op-wa{background:#25a244}.op-vk{background:#0077ff}.op-tel{background:var(--ink)}
</style>
</head>
<body>
<div class="tape" aria-hidden="true"></div>
<header class="top"><div class="wrap">
  <a class="brand" id="brand" href="#top"></a>
  <nav><a href="#services">Услуги</a><a href="#works">Работы</a><a href="#faq">Вопросы</a><a href="#contacts">Контакты</a></nav>
  <a class="phone" id="phone"></a>
  <button class="cartb" id="cartb" type="button">Заявка <b id="cnt">0</b></button>
</div></header>
<main id="top">
  <section class="hero"><div class="wrap">
    <div>
      <span class="stamp" id="stamp"><i></i><span></span></span>
      <h1 id="h1"></h1>
      <p id="lead"></p>
      <div class="acts"><a class="btn y" href="#services" id="choose"></a><a class="btn o" href="#contacts">Контакты</a></div>
    </div>
    <div class="plates" id="plates"></div>
  </div></section>
  <section id="services"><div class="wrap">
    <div class="ttl"><h2 id="sTitle"></h2></div>
    <p class="sub" id="sSub"></p>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div id="panels"></div>
  </div></section>
  <section id="works" style="padding-top:0"><div class="wrap">
    <div class="ttl"><h2>Наши работы</h2></div><p class="sub" id="wSub"></p>
    <div class="works" id="wgrid"></div>
  </div></section>
  <section id="faq" class="dark"><div class="wrap">
    <div class="ttl"><h2>Частые вопросы</h2></div><p class="sub" id="about"></p>
    <div class="faq" id="faqList"></div>
  </div></section>
  <section id="contacts"><div class="wrap">
    <div class="ttl"><h2>Контакты</h2></div>
    <div class="cgrid"><div id="crows"></div><div class="map" aria-hidden="true"><div class="pin" id="pin"></div></div></div>
  </div></section>
</main>
<footer><div class="wrap" id="foot"></div></footer>
<div class="shade" id="shade"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dt">
  <div class="dh"><h2 id="dt">Ваша заявка</h2><button class="x" id="x" type="button" aria-label="Закрыть">×</button></div>
  <div class="db" id="db"></div>
</aside>
<script>
const CONFIG = (function () { var d = /*CONFIG*/{"brand": "TransAkpp-Service", "tagline": "Ремонт АКПП в Казани", "description": "Диагностика и ремонт автоматических коробок передач. Опишите симптомы — оценим ремонт.", "accent": "#f2a900", "currency": "₽", "phone": "", "email": "", "address": "г. Казань, ул. Садовая, 30", "hours": "По предварительной записи", "messengers": {"telegram": "transakppkzn", "whatsapp": "", "vk": ""}, "services": [{"id": "s1", "category": "Диагностика", "name": "Компьютерная диагностика АКПП", "desc": "Ошибки и адаптации.", "price": 1500, "unit": ""}, {"id": "s2", "category": "Диагностика", "name": "Тест-драйв с мастером", "desc": "Слушаем и смотрим коробку.", "price": null, "unit": ""}, {"id": "s3", "category": "Обслуживание", "name": "Замена масла в АКПП (частичная)", "desc": "Работа.", "price": 2000, "unit": ""}, {"id": "s4", "category": "Обслуживание", "name": "Аппаратная замена масла", "desc": "Полная, с промывкой.", "price": 5000, "unit": "от"}, {"id": "s5", "category": "Ремонт", "name": "Ремонт гидроблока", "desc": "После диагностики.", "price": 15000, "unit": "от"}, {"id": "s6", "category": "Ремонт", "name": "Капитальный ремонт АКПП", "desc": "Точная цена после разборки.", "price": 45000, "unit": "от"}], "worksSubtitle": "Примеры наших работ.", "works": [], "about": ["Диагностика и ремонт автоматических коробок передач. Опишите симптомы — оценим ремонт."], "facts": [{"value": "Казань", "label": "ул. Садовая, 30"}, {"value": "Онлайн-заявка", "label": "в Telegram"}], "order": {"greeting": "Здравствуйте! Хочу записаться в сервис:", "closing": "Подскажите, когда можно подъехать. Спасибо!"}, "ui": {"nav": "Услуги", "servicesTitle": "Услуги и цены", "servicesSub": "Выберите нужные работы, нажмите «Заказать» — получите готовый текст для записи. Точную стоимость назовём после осмотра.", "chooseBtn": "Выбрать услуги", "whenLabel": "Марка и модель авто, желаемые дата и время", "whenText": "Авто, дата и время"}, "faq": [], "booking": {"open": "10:00", "close": "20:00", "step": 60, "days": [1, 2, 3, 4, 5, 6], "status": false}, "demo": true}/*/CONFIG*/; try { if (/[?&]preview/.test(location.search)) { var p = localStorage.getItem("draft:" + location.pathname.replace(/[^/]*$/, "")); if (p) return JSON.parse(p); } } catch (e) {} return d; })();
</script>
<script>
/* ===== ЯДРО: корзина, текст заявки, мессенджеры. Менять не нужно. ===== */
const K = (function () {
  const C = CONFIG;
  const money = (n) => new Intl.NumberFormat("ru-RU").format(n) + " " + C.currency;
  const KEY = "k:" + location.pathname + ":" + C.brand;
  const st = { cart: {}, form: {} };
  try { Object.assign(st, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
  const byId = (id) => C.services.find((s) => s.id === id);
  Object.keys(st.cart).forEach((id) => { if (!byId(id)) delete st.cart[id]; });
  const subs = [];
  const emit = () => { save(); subs.forEach((f) => f()); };
  const pad = (n) => String(n).padStart(2, "0");
  const toMin = (t) => { const [a, b] = t.split(":").map(Number); return a * 60 + b; };
  const B = Object.assign({ open: "10:00", close: "20:00", step: 60, days: [0, 1, 2, 3, 4, 5, 6] }, C.booking);

  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (v == null || v === false) return;
      if (k === "class") e.className = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    });
    kids.flat().forEach((c) => { if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c)); });
    return e;
  }

  const st0 = document.createElement("style");
  st0.textContent = "[hidden]{display:none!important}.k-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:#111;color:#fff;padding:11px 18px;border-radius:12px;font:14px/1.4 system-ui,sans-serif;opacity:0;transition:.25s;z-index:999;pointer-events:none;max-width:calc(100% - 32px);text-align:center}.k-toast.show{opacity:1;transform:translate(-50%,0)}";
  document.head.prepend(st0);
  let toastEl, toastT;
  function toast(msg) {
    if (!toastEl) { toastEl = h("div", { class: "k-toast", role: "status" }); document.body.append(toastEl); }
    toastEl.textContent = msg; toastEl.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove("show"), 2400);
  }

  const api = {
    C, h, money, byId, toast, pad,
    qty: (id) => st.cart[id] || 0,
    set(id, q) { if (q <= 0) delete st.cart[id]; else st.cart[id] = Math.min(q, 99); emit(); },
    toggle(id) { api.set(id, api.qty(id) ? 0 : 1); },
    clear() { st.cart = {}; emit(); },
    items: () => Object.keys(st.cart).map((id) => ({ s: byId(id), q: st.cart[id] })).filter((x) => x.s),
    count: () => api.items().reduce((a, x) => a + x.q, 0),
    total: () => api.items().reduce((a, x) => a + (x.s.price || 0) * x.q, 0),
    onRequest: () => api.items().some((x) => !x.s.price),
    on: (f) => subs.push(f),
    field(k, v) { if (v === undefined) return st.form[k] || ""; st.form[k] = v; save(); },
    cats: () => [...new Set(C.services.map((s) => s.category).filter(Boolean))],
    price: (s) => (s.price ? money(s.price) : "по договорённости"),

    /* текст заявки; extra — массив [подпись, значение] */
    text(extra) {
      const L = [C.order.greeting, ""];
      api.items().forEach((x, i) => L.push((i + 1) + ". " + x.s.name + (x.q > 1 ? " × " + x.q : "") + " — " + (x.s.price ? money(x.s.price * x.q) : "по договорённости")));
      if (!api.items().length) L.push("(услуги обсудим)");
      L.push("");
      if (api.total() > 0) L.push("Итого: " + money(api.total()) + (api.onRequest() ? " + позиции по договорённости" : ""));
      (extra || []).forEach(([k, v]) => { if (v && String(v).trim()) L.push(k + ": " + String(v).trim()); });
      if (C.order.closing) L.push("", C.order.closing);
      return L.join("\n");
    },

    /* ссылки на мессенджеры владельца */
    links(text) {
      const m = C.messengers || {}, out = [];
      if (m.telegram) out.push({ k: "tg", label: "Telegram", href: "https://t.me/" + m.telegram });
      if (m.whatsapp) out.push({ k: "wa", label: "WhatsApp", href: "https://wa.me/" + m.whatsapp + (text ? "?text=" + encodeURIComponent(text) : "") });
      if (m.vk) out.push({ k: "vk", label: "ВКонтакте", href: "https://vk.me/" + m.vk });
      if (C.phone) out.push({ k: "tel", label: "Позвонить", href: "tel:" + C.phone.replace(/[^\d+]/g, "") });
      return out;
    },
    tel: () => (C.phone ? "tel:" + C.phone.replace(/[^\d+]/g, "") : null),

    copy(text) {
      const ok = () => toast("Текст скопирован — вставьте его в чат");
      const fb = () => {
        const t = h("textarea", { style: "position:fixed;opacity:0" }); t.value = text; document.body.append(t); t.select();
        let done = false; try { done = document.execCommand("copy"); } catch (e) {}
        t.remove(); done ? ok() : toast("Не получилось скопировать — выделите текст вручную");
      };
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, fb); else fb();
    },


    /* готовый блок заявки: список, поля, итог, текст, мессенджеры. Оформляется классами op-* */
    panel(box, opt) {
      opt = opt || {};
      const UI = C.ui || {};
      const fields = opt.fields || [["fName", "Ваше имя"], ["fWhen", UI.whenLabel || "Когда удобно"], ["fNote", "Комментарий"]];
      const list = h("div", { class: "op-list" }), total = h("div", { class: "op-total" });
      const ta = h("textarea", { class: "op-text", readonly: true, "aria-label": "Текст заявки" });
      const links = h("div", { class: "op-links" });
      const inputs = fields.map(([id, label]) => {
        const i = h("input", { id: "op-" + id }); i.value = api.field(id);
        i.addEventListener("input", () => { api.field(id, i.value); refreshText(); });
        return h("label", { class: "op-field" }, h("span", {}, label), i);
      });
      box.append(list, h("div", { class: "op-fields" }, inputs), total, ta, links);
      const extra = () => fields.map(([id, label]) => [id === "fWhen" ? (UI.whenText || "Когда") : id === "fName" ? "Имя" : label.replace(/ \(.*\)$/, ""), api.field(id)]).concat(opt.extra ? opt.extra() : []);
      function refreshText() {
        const t = api.text(extra()); ta.value = t; links.innerHTML = "";
        links.append(h("button", { type: "button", class: "op-copy", onclick: () => api.copy(t) }, "Скопировать текст"));
        api.links(t).forEach((x) => links.append(h("a", { class: "op-" + x.k, href: x.href, target: x.k === "tel" ? null : "_blank", rel: "noopener", onclick: () => x.k !== "wa" && x.k !== "tel" && api.copy(t) }, x.label)));
      }
      function refresh() {
        list.innerHTML = "";
        if (!api.items().length) list.append(h("p", { class: "op-empty" }, opt.empty || "Пока ничего не выбрано."));
        api.items().forEach((x) => list.append(h("div", { class: "op-row" },
          h("div", { class: "op-nm" }, x.s.name, h("small", {}, x.s.price ? api.money(x.s.price * x.q) : "по договорённости")),
          h("div", { class: "op-qty" },
            h("button", { type: "button", "aria-label": "Меньше", onclick: () => api.set(x.s.id, x.q - 1) }, "−"),
            h("span", {}, String(x.q)),
            h("button", { type: "button", "aria-label": "Больше", onclick: () => api.set(x.s.id, x.q + 1) }, "+")))));
        total.innerHTML = "";
        if (api.total()) total.append(h("span", {}, "Итого"), h("b", {}, api.money(api.total())));
        refreshText();
      }
      api.on(refresh); refresh();
      return { refresh };
    },
    /* график: открыто ли сейчас, ближайшие рабочие дни, свободное время */
    status() {
      if (!B.status) return { open: false, text: "" };
      const d = new Date(), m = d.getHours() * 60 + d.getMinutes();
      const open = B.days.includes(d.getDay()) && m >= toMin(B.open) && m < toMin(B.close);
      return open ? { open: true, text: "Открыто до " + B.close } : { open: false, text: "Сейчас закрыто · откроемся в " + B.open };
    },
    days(n) {
      const out = [], d = new Date(); d.setHours(0, 0, 0, 0);
      for (let i = 0; out.length < n && i < 60; i++) {
        const x = new Date(d); x.setDate(d.getDate() + i);
        if (B.days.includes(x.getDay())) out.push(x);
      }
      return out;
    },
    slots(date) {
      const out = [], now = new Date(), today = date.toDateString() === now.toDateString();
      for (let t = toMin(B.open); t + B.step <= toMin(B.close); t += B.step) {
        if (today && t <= now.getHours() * 60 + now.getMinutes() + 30) continue;
        out.push(pad(Math.floor(t / 60)) + ":" + pad(t % 60));
      }
      return out;
    },
    dayLabel(d) {
      const now = new Date(); now.setHours(0, 0, 0, 0);
      const diff = Math.round((d - now) / 864e5);
      const wd = d.toLocaleDateString("ru-RU", { weekday: "short" });
      return diff === 0 ? "Сегодня" : diff === 1 ? "Завтра" : wd.charAt(0).toUpperCase() + wd.slice(1) + ", " + d.getDate();
    },
    dateText: (d) => d.toLocaleDateString("ru-RU", { day: "numeric", month: "long", weekday: "long" })
  };
  return api;
})();

</script>
<script>
(function () {
  const { C, h } = K, $ = (id) => document.getElementById(id), U = C.ui || {};
  document.documentElement.style.setProperty("--accent", C.accent);
  $("brand").textContent = C.brand; $("h1").textContent = C.brand;
  $("lead").textContent = C.tagline + ". " + C.description;
  if (C.phone) { $("phone").textContent = C.phone; $("phone").href = K.tel(); }
  const s = K.status(); $("stamp").classList.toggle("open", s.open); $("stamp").querySelector("span").textContent = s.text;
  $("choose").textContent = U.chooseBtn || "Выбрать услуги";
  (C.facts || []).forEach((f) => $("plates").append(h("div", { class: "plate" }, h("b", {}, f.value), h("span", {}, f.label))));
  $("sTitle").textContent = U.servicesTitle || "Услуги"; $("sSub").textContent = U.servicesSub || "";

  // вкладки по категориям
  const cats = K.cats();
  cats.forEach((cat, i) => {
    const tab = h("button", { class: "tab", role: "tab", id: "t" + i, "aria-controls": "p" + i, "aria-selected": i === 0 ? "true" : "false", tabindex: i === 0 ? "0" : "-1", type: "button" }, cat);
    const panel = h("div", { class: "panel", role: "tabpanel", id: "p" + i, "aria-labelledby": "t" + i, hidden: i !== 0 });
    C.services.filter((x) => x.category === cat).forEach((x) => panel.append(h("article", { class: "svc", "data-id": x.id },
      h("h3", {}, x.name), x.desc ? h("p", {}, x.desc) : h("p", {}),
      h("div", { class: "r" }, h("div", { class: "pr" }, x.price ? K.money(x.price) : "Договорная", x.price && x.unit ? h("small", {}, " " + x.unit) : null), h("div", { class: "ctl" })))));
    $("tabs").append(tab); $("panels").append(panel);
  });
  const tabs = [...document.querySelectorAll(".tab")];
  function sel(i) {
    tabs.forEach((t, j) => { t.setAttribute("aria-selected", j === i ? "true" : "false"); t.tabIndex = j === i ? 0 : -1; $("p" + j).hidden = j !== i; });
    tabs[i].focus();
  }
  tabs.forEach((t, i) => {
    t.addEventListener("click", () => sel(i));
    t.addEventListener("keydown", (e) => { if (e.key === "ArrowRight") sel((i + 1) % tabs.length); if (e.key === "ArrowLeft") sel((i - 1 + tabs.length) % tabs.length); });
  });
  function controls() {
    document.querySelectorAll(".svc").forEach((card) => {
      const id = card.dataset.id, q = K.qty(id), box = card.querySelector(".ctl"); box.innerHTML = "";
      box.append(q ? h("div", { class: "qty" }, h("button", { type: "button", "aria-label": "Меньше", onclick: () => K.set(id, q - 1) }, "−"), h("span", {}, String(q)), h("button", { type: "button", "aria-label": "Больше", onclick: () => K.set(id, q + 1) }, "+"))
                   : h("button", { class: "add", type: "button", onclick: () => K.set(id, 1) }, "В заявку"));
    });
    $("cnt").textContent = K.count();
  }
  K.on(controls); controls();

  $("wSub").textContent = C.worksSubtitle || "";
  (C.works || []).forEach((w) => $("wgrid").append(h("div", { class: "w" }, w.image ? h("img", { src: w.image, alt: w.title || "", loading: "lazy" }) : null, h("span", {}, w.title))));
  if (!(C.works || []).length) $("works").hidden = true;
  $("about").textContent = (C.about || []).join(" ");
  (C.faq || []).forEach((f) => $("faqList").append(h("details", {}, h("summary", {}, f.q), h("p", {}, f.a))));
  if (!(C.faq || []).length) $("faq").hidden = true;
  const m = C.messengers || {};
  [["Телефон", C.phone, K.tel()], ["Telegram", m.telegram && (/^\+/.test(m.telegram) ? "" : "@") + m.telegram, m.telegram && "https://t.me/" + m.telegram], ["WhatsApp", m.whatsapp && "+" + m.whatsapp, m.whatsapp && "https://wa.me/" + m.whatsapp], ["ВКонтакте", m.vk && "vk.com/" + m.vk, m.vk && "https://vk.com/" + m.vk], ["Адрес", C.address], ["Часы", C.hours], ["Email", C.email, C.email && "mailto:" + C.email]]
    .forEach(([k, v, href]) => v && $("crows").append(h(href ? "a" : "div", { class: "crow", href, target: href && href.startsWith("http") ? "_blank" : null, rel: "noopener" }, h("span", {}, k), h("b", {}, v))));
  $("pin").textContent = C.address || C.brand;
  $("foot").textContent = "© " + new Date().getFullYear() + " " + C.brand;

  K.panel($("db"), { empty: "Добавьте работы из списка услуг." });
  const open = () => { $("drawer").classList.add("open"); $("shade").classList.add("open"); $("x").focus(); };
  const close = () => { $("drawer").classList.remove("open"); $("shade").classList.remove("open"); };
  $("cartb").onclick = open; $("x").onclick = close; $("shade").onclick = close;
  document.addEventListener("keydown", (e) => e.key === "Escape" && close());
})();
</script>
