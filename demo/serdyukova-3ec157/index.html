<!doctype html>
<html lang="ru">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Serdyukova — Студия красоты в Иркутске</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Geologica:wght@300;400;500;600&display=swap">
<style>
/* Стиль 19 «Премьер» — флагман. Сдержанная классика: антиква с капителью, тонкие линии, много воздуха.
   Функции: светлая/тёмная тема, поиск/фильтр/сортировка/избранное, вид «плитка/список», ближайшее свободное время,
   счётчики, галерея с лайтбоксом и свайпом, карусель отзывов, график работы с подсветкой «сегодня»,
   копирование контактов, запись с датой/временем и проверкой телефона, мобильная панель записи, кнопка «наверх». */
:root{--accent:#2f6f5e;--bg:#f2f3f0;--surface:#ffffff;--ink:#151716;--muted:#6c706c;--line:#d9dbd5;--soft:#e8eae5;--ok:#2a8a4a;--err:#c0392b;
  --d:"Forum","Cormorant Garamond",Georgia,serif;--b:"Geologica",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
:root[data-theme="dark"]{--bg:#111312;--surface:#1a1d1b;--ink:#ecefea;--muted:#9da29c;--line:#2d312e;--soft:#222623;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111312;--surface:#1a1d1b;--ink:#ecefea;--muted:#9da29c;--line:#2d312e;--soft:#222623;color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font:300 17px/1.65 var(--b);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-left,0px))}
h1,h2,h3{font-family:var(--d);font-weight:400;line-height:1.02;margin:0;letter-spacing:.005em}
a{color:inherit}
.prog{position:fixed;top:0;left:0;height:2px;background:var(--accent);width:0;z-index:100}
.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 26px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font:500 15px var(--b);text-decoration:none;cursor:pointer;transition:.25s}
.btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.line{background:transparent;color:var(--ink)}.btn.line:hover{background:var(--ink);color:var(--bg)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
/* шапка */
.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:.3s}
.top.sc{border-color:var(--line)}
.top .wrap{display:flex;align-items:center;gap:24px;height:84px;transition:height .3s}
.top.sc .wrap{height:64px}
.brand{font:400 26px var(--d);text-decoration:none;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:28px}.nav a{text-decoration:none;font-size:15px;color:var(--muted);transition:color .2s}.nav a:hover{color:var(--ink)}
.icb{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center;flex-shrink:0}
.icb svg{width:18px;height:18px}
.cart{position:relative}
.cart b{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:#fff;font:600 11px/20px var(--b);text-align:center;padding:0 5px}
.cart b:empty,.cart b[data-n="0"]{display:none}
.burger{display:none}
.mnav{display:none}
@media(max-width:900px){.nav{display:none}.burger{display:grid}.mnav{position:fixed;inset:64px 0 auto;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 18px 20px;z-index:49;flex-direction:column}.mnav.open{display:flex}.mnav a{padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;font:400 24px var(--d)}}
/* герой */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;padding:56px 0 90px}
.live{display:inline-flex;align-items:center;gap:10px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;font-size:13px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--muted)}.live.on i{background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.hero h1{font-size:clamp(46px,7.2vw,104px);margin:26px 0 22px;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .lead{font-size:19px;color:var(--muted);max-width:46ch;margin:0 0 34px}
.acts{display:flex;gap:12px;flex-wrap:wrap}
.trust{display:flex;gap:30px;margin-top:44px;padding-top:26px;border-top:1px solid var(--line);flex-wrap:wrap}
.trust div{min-width:110px}
.trust b{display:block;font:400 42px/1 var(--d)}
.trust span{font-size:13px;color:var(--muted)}
.vis{position:relative;aspect-ratio:1/1.08}
.arch{position:absolute;left:8%;top:0;width:62%;height:86%;border-radius:999px 999px 24px 24px;overflow:hidden;background:linear-gradient(170deg,color-mix(in srgb,var(--accent) 70%,var(--surface)),color-mix(in srgb,var(--accent) 25%,var(--surface)))}
.circ{position:absolute;right:0;bottom:6%;width:46%;aspect-ratio:1;border-radius:50%;overflow:hidden;border:8px solid var(--bg);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 40%,var(--surface)),var(--soft))}
.arch img,.circ img{width:100%;height:100%;object-fit:cover}
.slotcard{position:absolute;left:0;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px;box-shadow:0 20px 50px -20px rgba(0,0,0,.25);min-width:220px}
.slotcard small{display:block;font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.slotcard b{display:block;font:400 26px var(--d);margin:4px 0 10px}
.slotcard button{font:500 13px var(--b);background:none;border:0;color:var(--accent);cursor:pointer;padding:0}
.rate{position:absolute;right:4%;top:6%;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-size:14px;display:flex;align-items:center;gap:8px}
.rate b{font:400 22px var(--d)}.rate .s{color:#d4a017}
@media(max-width:900px){.hero{grid-template-columns:1fr;gap:40px;padding-top:30px}.vis{max-width:520px}}
/* секции */
section{padding:90px 0;border-top:1px solid var(--line)}
.sh{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:end;margin-bottom:40px}
.sh h2{font-size:clamp(40px,5.5vw,72px)}
.sh p{color:var(--muted);margin:0;max-width:48ch;justify-self:end}
@media(max-width:800px){.sh{grid-template-columns:1fr}.sh p{justify-self:start}}
/* инструменты услуг */
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:26px}
.srch{flex:1 1 240px;position:relative}
.srch input{width:100%;padding:13px 16px 13px 44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:400 15px var(--b);color:var(--ink)}
.srch svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.seg{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--surface);overflow-x:auto;max-width:100%;scrollbar-width:none}
.seg button{border:0;background:none;padding:8px 14px;border-radius:999px;font:400 14px var(--b);color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
select{padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:400 14px var(--b);color:var(--ink)}
.favb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:18px}
.svc{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:26px;display:flex;flex-direction:column;gap:10px;position:relative;transition:border-color .2s,transform .25s}
.svc:hover{border-color:color-mix(in srgb,var(--accent) 60%,var(--line));transform:translateY(-3px)}
.svc.on{border-color:var(--accent)}
.svc .c{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.svc h3{font-size:28px;padding-right:40px}
.svc p{margin:0;color:var(--muted);font-size:15px;flex:1}
.svc .r{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;padding-top:16px;border-top:1px solid var(--line)}
.svc .pr{font:400 26px var(--d)}.svc .pr small{font:300 13px var(--b);color:var(--muted)}
.fav{position:absolute;top:20px;right:20px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.fav svg{width:17px;height:17px}
.fav[aria-pressed="true"]{color:#d9534f;border-color:#d9534f}.fav[aria-pressed="true"] svg{fill:currentColor}
.add{border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:10px 18px;font:500 14px var(--b);cursor:pointer}
.add:hover{background:var(--ink);color:var(--bg)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--accent);border-radius:999px}
.qty button{width:38px;height:38px;border:0;background:none;color:var(--ink);font-size:18px;cursor:pointer}
.qty span{min-width:22px;text-align:center;font-weight:500}
.grid.list{grid-template-columns:1fr;gap:0}
.grid.list .svc{flex-direction:row;align-items:center;border-radius:0;border-width:0 0 1px;padding:20px 4px;background:transparent;flex-wrap:wrap}
.grid.list .svc:hover{transform:none}
.grid.list .svc h3{font-size:24px;flex:1 1 220px;padding:0}
.grid.list .svc p{flex:2 1 260px}
.grid.list .svc .c{width:100%}
.grid.list .svc .r{border:0;margin:0;padding:0;gap:18px}
.grid.list .fav{position:static}
.empty{grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:24px}
/* галерея */
.gal{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:150px;gap:14px}
.ph{border:0;padding:0;cursor:zoom-in;border-radius:22px;overflow:hidden;position:relative;background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 65%,var(--surface)),color-mix(in srgb,var(--accent) 18%,var(--surface)));display:flex;align-items:flex-end;grid-column:span 2;grid-row:span 2}
.ph:nth-child(4n+1){grid-column:span 3;grid-row:span 3}
.ph:nth-child(4n+2){grid-column:span 3}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s}
.ph:hover img{transform:scale(1.05)}
.ph span{position:relative;margin:16px;background:var(--surface);color:var(--ink);padding:6px 14px;border-radius:999px;font-size:13px}
@media(max-width:700px){.gal{grid-template-columns:1fr 1fr;grid-auto-rows:140px}.ph,.ph:nth-child(4n+1),.ph:nth-child(4n+2){grid-column:span 1;grid-row:span 1}.ph:nth-child(3n+1){grid-column:span 2;grid-row:span 2}}
.lb{position:fixed;inset:0;background:rgba(10,12,11,.92);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;touch-action:pan-y}
.lb[hidden]{display:none}
.lb figure{margin:0;width:min(900px,100%);text-align:center;color:#fff}
.lb .img{aspect-ratio:3/2;border-radius:20px;overflow:hidden;background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 70%,#222),#222);position:relative}
.lb .img img{width:100%;height:100%;object-fit:contain}
.lb figcaption{margin-top:14px;font:400 26px var(--d)}
.lb .icb{position:absolute;border-color:#ffffff55;color:#fff;width:50px;height:50px}
.lb .x{top:max(16px,env(safe-area-inset-top,0px));right:16px}.lb .p{left:16px;top:50%}.lb .n{right:16px;top:50%}
/* отзывы */
.revs{position:relative;overflow:hidden}
.track{display:flex;transition:transform .6s cubic-bezier(.3,.7,.2,1)}
.rv{flex:0 0 100%;padding:0 2px}
.rv q{display:block;font:400 clamp(28px,4vw,52px)/1.15 var(--d);quotes:"«" "»";max-width:28ch}
.rv .who{margin-top:24px;display:flex;align-items:center;gap:14px;color:var(--muted)}
.rv .who i{width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:400 20px var(--d);font-style:normal}
.rv .who b{color:var(--ink);font-weight:500}
.rnav{display:flex;align-items:center;gap:12px;margin-top:34px}
.rnav .dots{display:flex;gap:6px;margin-right:auto}
.rnav .dots button{width:28px;height:3px;border:0;background:var(--line);cursor:pointer;padding:0}
.rnav .dots button.on{background:var(--ink)}
/* FAQ */
.faq{max-width:900px}
.qa{border-bottom:1px solid var(--line)}
.qa button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:20px;background:none;border:0;padding:24px 0;font:400 clamp(22px,2.4vw,30px)/1.2 var(--d);color:var(--ink);text-align:left;cursor:pointer}
.qa button i{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);flex-shrink:0;position:relative}
.qa button i::before,.qa button i::after{content:"";position:absolute;left:50%;top:50%;width:12px;height:1.5px;background:currentColor;transform:translate(-50%,-50%);transition:.3s}
.qa button i::after{transform:translate(-50%,-50%) rotate(90deg)}
.qa button[aria-expanded="true"] i::after{transform:translate(-50%,-50%)}
.qa .ans{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s}
.qa .ans>div{overflow:hidden;color:var(--muted)}
.qa.open .ans{grid-template-rows:1fr}
.qa.open .ans>div{padding-bottom:22px}
/* контакты */
.cg{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
.cc{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px}
.crow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.crow:last-child{border:0}
.crow .k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);width:110px;flex-shrink:0}
.crow .v{flex:1;font-size:17px;font-weight:400;text-decoration:none;min-width:0;overflow-wrap:anywhere}
.crow a.v:hover{color:var(--accent)}
.cp{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font:400 12px var(--b);color:var(--muted);cursor:pointer}
.sched{display:grid;gap:2px}
.sched div{display:flex;justify-content:space-between;padding:10px 12px;border-radius:12px;font-variant-numeric:tabular-nums}
.sched div.today{background:var(--soft);font-weight:500}
.sched div.off span:last-child{color:var(--muted)}
@media(max-width:800px){.cg{grid-template-columns:1fr}.crow .k{width:86px}}
footer{padding:50px 0 120px;border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;color:var(--muted);font-size:14px}
footer .brand{margin:0;font-size:34px;color:var(--ink)}
/* мобильная панель и «наверх» */
.mbar{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:45;display:none;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:20px;padding:10px 10px 10px 18px;box-shadow:0 14px 40px rgba(0,0,0,.3)}
.mbar div{flex:1;font-size:13px;line-height:1.3}.mbar b{display:block;font:400 20px var(--d)}
.mbar .btn{background:var(--accent);border-color:var(--accent);color:#fff;padding:12px 18px}
@media(max-width:700px){.mbar{display:flex}}
.totop{position:fixed;right:20px;bottom:24px;z-index:44;opacity:0;pointer-events:none;transition:.3s;background:var(--surface)}
.totop.on{opacity:1;pointer-events:auto}
@media(max-width:700px){.totop{bottom:96px}}
/* запись */
.shade{position:fixed;inset:0;background:rgba(8,10,9,.5);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.3s;z-index:90}
.shade.open{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:91;transform:translateX(100%);transition:transform .4s cubic-bezier(.3,.7,.2,1);display:flex;flex-direction:column;visibility:hidden}
.dr.open{transform:none;visibility:visible}
.dh{display:flex;align-items:center;justify-content:space-between;padding:22px 26px;padding-top:max(22px,env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.dh h2{font-size:36px}
.db{flex:1;overflow:auto;padding:6px 26px 30px}
.blk{padding:22px 0;border-bottom:1px solid var(--line)}
.blk h3{font:500 13px var(--b);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;display:flex;gap:10px;align-items:center}
.blk h3 i{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:11px}
.blk.ok h3 i{background:var(--accent);border-color:var(--accent);color:#fff}
.op-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0}
.op-nm{font-size:16px;font-weight:400}.op-nm small{display:block;color:var(--muted);font-size:13px}
.op-qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px}
.op-qty button{width:34px;height:34px;border:0;background:none;color:var(--ink);cursor:pointer;font-size:16px}
.op-qty span{min-width:20px;text-align:center}
.op-empty{color:var(--muted);margin:0}
.op-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;font:400 26px var(--d)}
.op-fields,.op-text,.op-links{display:none}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.day{flex:0 0 auto;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:400 14px var(--b);cursor:pointer;text-align:center;min-width:76px}
.day small{display:block;color:var(--muted);font-size:12px}
.day[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}.day[aria-pressed="true"] small{color:inherit;opacity:.7}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.slot{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:400 14px var(--b);cursor:pointer;font-variant-numeric:tabular-nums}
.slot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.fl{display:block;margin-top:12px}
.fl span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.fl input,.fl textarea{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font:400 16px var(--b);color:var(--ink)}
.fl textarea{min-height:70px;resize:vertical}
.fl.bad input{border-color:var(--err)}
.fl em{display:block;font-style:normal;color:var(--err);font-size:13px;margin-top:4px}
.out{width:100%;min-height:150px;margin-top:12px;padding:14px;border-radius:14px;border:1px dashed var(--line);background:var(--surface);font:300 14px/1.55 var(--b);color:var(--ink);resize:vertical}
.send{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:10px}
.send a,.send button{display:flex;justify-content:center;align-items:center;padding:13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font:500 14px var(--b);cursor:pointer}
.send .main{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:#fff;font-size:15px;padding:15px}
.send .main[aria-disabled="true"]{opacity:.45;pointer-events:none}
.need{font-size:13px;color:var(--muted);margin-top:8px}
.rv-anim{transition:opacity .9s,transform .9s}
html.js .rv-anim:not(.in){opacity:0;transform:translateY(26px)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html.js .rv-anim:not(.in){opacity:1;transform:none}}
</style>
</head>
<body>
<div class="prog" id="prog"></div>
<header class="top" id="top"><div class="wrap">
  <a class="brand" id="brand" href="#"></a>

ch)) { var p = localStorage.getItem("draft:" + location.pathname.replace(/[^/]*$/, "")); if (p) return JSON.parse(p); } } catch (e) {} return d; })();

<script>
/* ===== ЯДРО: корзина, текст заявки, мессенджеры. Менять не нужно. ===== */
const K = (function () {
  const C = CONFIG;
  const money = (n) => new Intl.NumberFormat("ru-RU").format(n) + " " + C.currency;
  const KEY = "k:" + location.pathname + ":" + C.brand;
  const st = { cart: {}, form: {} };
  try { Object.assign(st, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
  const byId = (id) => C.services.find((s) => s.id === id);
  Object.keys(st.cart).forEach((id) => { if (!byId(id)) delete st.cart[id]; });
  const subs = [];
  const emit = () => { save(); subs.forEach((f) => f()); };
  const pad = (n) => String(n).padStart(2, "0");
  const toMin = (t) => { const [a, b] = t.split(":").map(Number); return a * 60 + b; };
  const B = Object.assign({ open: "10:00", close: "20:00", step: 60, days: [0, 1, 2, 3, 4, 5, 6] }, C.booking);

  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (v == null || v === false) return;
      if (k === "class") e.className = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    });
    kids.flat().forEach((c) => { if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c)); });
    return e;
  }

  const st0 = document.createElement("style");
  st0.textContent = "[hidden]{display:none!important}.k-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:#111;color:#fff;padding:11px 18px;border-radius:12px;font:14px/1.4 system-ui,sans-serif;opacity:0;transition:.25s;z-index:999;pointer-events:none;max-width:calc(100% - 32px);text-align:center}.k-toast.show{opacity:1;transform:translate(-50%,0)}";
  document.head.prepend(st0);
  let toastEl, toastT;
  function toast(msg) {
    if (!toastEl) { toastEl = h("div", { class: "k-toast", role: "status" }); document.body.append(toastEl); }
    toastEl.textContent = msg; toastEl.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove("show"), 2400);
  }

  const api = {
    C, h, money, byId, toast, pad,
    qty: (id) => st.cart[id] || 0,
    set(id, q) { if (q <= 0) delete st.cart[id]; else st.cart[id] = Math.min(q, 99); emit(); },
    toggle(id) { api.set(id, api.qty(id) ? 0 : 1); },
    clear() { st.cart = {}; emit(); },
    items: () => Object.keys(st.cart).map((id) => ({ s: byId(id), q: st.cart[id] })).filter((x) => x.s),
    count: () => api.items().reduce((a, x) => a + x.q, 0),
    total: () => api.items().reduce((a, x) => a + (x.s.price || 0) * x.q, 0),
    onRequest: () => api.items().some((x) => !x.s.price),
    on: (f) => subs.push(f),
    field(k, v) { if (v === undefined) return st.form[k] || ""; st.form[k] = v; save(); },
    cats: () => [...new Set(C.services.map((s) => s.category).filter(Boolean))],
    price: (s) => (s.price ? money(s.price) : "по договорённости"),

    /* текст заявки; extra — массив [подпись, значение] */
    text(extra) {
      const L = [C.order.greeting, ""];
      api.items().forEach((x, i) => L.push((i + 1) + ". " + x.s.name + (x.q > 1 ? " × " + x.q : "") + " — " + (x.s.price ? money(x.s.price * x.q) : "по договорённости")));
      if (!api.items().length) L.push("(услуги обсудим)");
      L.push("");
      if (api.total() > 0) L.push("Итого: " + money(api.total()) + (api.onRequest() ? " + позиции по договорённости" : ""));
      (extra || []).forEach(([k, v]) => { if (v && String(v).trim()) L.push(k + ": " + String(v).trim()); });
      if (C.order.closing) L.push("", C.order.closing);
      return L.join("\n");
    },

    /* ссылки на мессенджеры владельца */
    links(text) {
      const m = C.messengers || {}, out = [];
      if (m.telegram) out.push({ k: "tg", label: "Telegram", href: "https://t.me/" + m.telegram });
      if (m.whatsapp) out.push({ k: "wa", label: "WhatsApp", href: "https://wa.me/" + m.whatsapp + (text ? "?text=" + encodeURIComponent(text) : "") });
      if (m.vk) out.push({ k: "vk", label: "ВКонтакте", href: "https://vk.me/" + m.vk });
      if (C.phone) out.push({ k: "tel", label: "Позвонить", href: "tel:" + C.phone.replace(/[^\d+]/g, "") });
      return out;
    },
    tel: () => (C.phone ? "tel:" + C.phone.replace(/[^\d+]/g, "") : null),

    copy(text) {
      const ok = () => toast("Текст скопирован — вставьте его в чат");
      const fb = () => {
        const t = h("textarea", { style: "position:fixed;opacity:0" }); t.value = text; document.body.append(t); t.select();
        let done = false; try { done = document.execCommand("copy"); } catch (e) {}
        t.remove(); done ? ok() : toast("Не получилось скопировать — выделите текст вручную");
      };
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, fb); else fb();
    },


    /* готовый блок заявки: список, поля, итог, текст, мессенджеры. Оформляется классами op-* */
    panel(box, opt) {
      opt = opt || {};
      const UI = C.ui || {};
      const fields = opt.fields || [["fName", "Ваше имя"], ["fWhen", UI.whenLabel || "Когда удобно"], ["fNote", "Комментарий"]];
      const list = h("div", { class: "op-list" }), total = h("div", { class: "op-total" });
      const ta = h("textarea", { class: "op-text", readonly: true, "aria-label": "Текст заявки" });
      const links = h("div", { class: "op-links" });
      const inputs = fields.map(([id, label]) => {
        const i = h("input", { id: "op-" + id }); i.value = api.field(id);
        i.addEventListener("input", () => { api.field(id, i.value); refreshText(); });
        return h("label", { class: "op-field" }, h("span", {}, label), i);
      });
      box.append(list, h("div", { class: "op-fields" }, inputs), total, ta, links);
      const extra = () => fields.map(([id, label]) => [id === "fWhen" ? (UI.whenText || "Когда") : id === "fName" ? "Имя" : label.replace(/ \(.*\)$/, ""), api.field(id)]).concat(opt.extra ? opt.extra() : []);
      function refreshText() {
        const t = api.text(extra()); ta.value = t; links.innerHTML = "";
        links.append(h("button", { type: "button", class: "op-copy", onclick: () => api.copy(t) }, "Скопировать текст"));
        api.links(t).forEach((x) => links.append(h("a", { class: "op-" + x.k, href: x.href, target: x.k === "tel" ? null : "_blank", rel: "noopener", onclick: () => x.k !== "wa" && x.k !== "tel" && api.copy(t) }, x.label)));
      }
      function refresh() {
        list.innerHTML = "";
        if (!api.items().length) list.append(h("p", { class: "op-empty" }, opt.empty || "Пока ничего не выбрано."));
        api.items().forEach((x) => list.append(h("div", { class: "op-row" },
          h("div", { class: "op-nm" }, x.s.name, h("small", {}, x.s.price ? api.money(x.s.price * x.q) : "по договорённости")),
          h("div", { class: "op-qty" },
            h("button", { type: "button", "aria-label": "Меньше", onclick: () => api.set(x.s.id, x.q - 1) }, "−"),
            h("span", {}, String(x.q)),
            h("button", { type: "button", "aria-label": "Больше", onclick: () => api.set(x.s.id, x.q + 1) }, "+")))));
        total.innerHTML = "";
        if (api.total()) total.append(h("span", {}, "Итого"), h("b", {}, api.money(api.total())));
        refreshText();
      }
      api.on(refresh); refresh();
      return { refresh };
    },
    /* график: открыто ли сейчас, ближайшие рабочие дни, свободное время */
    status() {
      if (!B.status) return { open: false, text: "" };
      const d = new Date(), m = d.getHours() * 60 + d.getMinutes();
      const open = B.days.includes(d.getDay()) && m >= toMin(B.open) && m < toMin(B.close);
      return open ? { open: true, text: "Открыто до " + B.close } : { open: false, text: "Сейчас закрыто · откроемся в " + B.open };
    },
    days(n) {
      const out = [], d = new Date(); d.setHours(0, 0, 0, 0);
      for (let i = 0; out.length < n && i < 60; i++) {
        const x = new Date(d); x.setDate(d.getDate() + i);
        if (B.days.includes(x.getDay())) out.push(x);
      }
      return out;
    },
    slots(date) {
      const out = [], now = new Date(), today = date.toDateString() === now.toDateString();
      for (let t = toMin(B.open); t + B.step <= toMin(B.close); t += B.step) {
        if (today && t <= now.getHours() * 60 + now.getMinutes() + 30) continue;
        out.push(pad(Math.floor(t / 60)) + ":" + pad(t % 60));
      }
      return out;
    },
    dayLabel(d) {
      const now = new Date(); now.setHours(0, 0, 0, 0);
      const diff = Math.round((d - now) / 864e5);
      const wd = d.toLocaleDateString("ru-RU", { weekday: "short" });
      return diff === 0 ? "Сегодня" : diff === 1 ? "Завтра" : wd.charAt(0).toUpperCase() + wd.slice(1) + ", " + d.getDate();
    },
    dateText: (d) => d.toLocaleDateString("ru-RU", { day: "numeric", month: "long", weekday: "long" })
  };
  return api;
})();

</script>
<script>
document.documentElement.classList.add("js");
(function () {
  const { C, h } = K, $ = (id) => document.getElementById(id), U = C.ui || {};
  const root = document.documentElement;
  root.style.setProperty("--accent", C.accent);
  const isFood = /заказ/i.test(C.order.greeting);

  // тема
  try { const t = localStorage.getItem("theme:" + C.brand); if (t) root.dataset.theme = t; } catch (e) {}
  $("theme").onclick = () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("theme:" + C.brand, root.dataset.theme); } catch (e) {}
  };

  // шапка, меню, прогресс
  $("brand").textContent = C.brand; $("fbrand").textContent = C.brand;
  $("navS").textContent = U.nav || "Услуги";
  document.querySelectorAll(".nav a").forEach((a) => $("mnav").append(h("a", { href: a.getAttribute("href"), onclick: () => menu(false) }, a.textContent)));
  const menu = (v) => { $("mnav").classList.toggle("open", v); $("burger").setAttribute("aria-expanded", v); };
  $("burger").onclick = () => menu(!$("mnav").classList.contains("open"));
  addEventListener("scroll", () => {
    const y = scrollY, max = document.documentElement.scrollHeight - innerHeight;
    $("prog").style.width = (max > 0 ? 100 * y / max : 0) + "%";
    $("top").classList.toggle("sc", y > 20); $("totop").classList.toggle("on", y > 800);
  }, { passive: true });
  $("totop").onclick = () => scrollTo({ top: 0, behavior: "smooth" });

  // герой
  const st = K.status(); $("live").classList.toggle("on", st.open); $("live").querySelector("span").textContent = st.text;
  const tw = C.tagline.split(" "); $("h1").append(tw.slice(0, -2).join(" ") + " ", h("em", {}, tw.slice(-2).join(" ")));
  $("lead").textContent = C.description;
  $("choose").textContent = U.chooseBtn || "Смотреть услуги";
  (C.facts || []).forEach((f) => {
    const m = /^([^\d]*)(\d+(?:\s\d{3})*)(.*)$/.exec(f.value), b = h("b", {}, f.value);
    if (m) Object.assign(b.dataset, { to: m[2].replace(/\s/g, ""), pre: m[1], post: m[3] });
    $("trust").append(h("div", {}, b, h("span", {}, f.label)));
  });
  const WK = C.works || [];
  const img = (w) => (w && w.image ? h("img", { src: w.image, alt: w.title || "" }) : null);
  if (WK[0] && WK[0].image) $("arch").append(img(WK[0])); if (WK[1] && WK[1].image) $("circ").append(img(WK[1]));
  const R = C.reviews || [];
  if (R.length) { const avg = R.reduce((a, r) => a + r.rating, 0) / R.length; $("rate").append(h("span", { class: "s", "aria-hidden": "true" }, "★"), h("b", {}, avg.toFixed(1).replace(".", ",")), h("span", {}, "· " + R.length + " отзыва")); } else $("rate").hidden = true;
  const days = K.days(14);
