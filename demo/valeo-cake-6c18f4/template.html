<!doctype html>
<html lang="ru">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кафе «Уют»</title>
<meta name="description" content="">
<style>
:root{
  --accent:#2f6f5e;
  --accent-ink:#ffffff;
  --bg:#faf9f6;
  --surface:#ffffff;
  --ink:#1c1f1e;
  --muted:#6a706d;
  --line:#e6e4de;
  --radius:16px;
  --shadow:0 6px 24px rgba(0,0,0,.08);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141615;--surface:#1c1f1e;--ink:#f1f1ee;--muted:#9aa09d;--line:#2d3230;--shadow:0 6px 24px rgba(0,0,0,.4)}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
h1,h2,h3{line-height:1.2;margin:0}
section{padding:56px 0}
.section-title{font-size:28px;margin-bottom:8px}
.section-sub{color:var(--muted);margin:0 0 28px}

/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.brand{font-weight:700;font-size:18px;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:18px}
.nav a{text-decoration:none;color:var(--muted);font-size:15px}
.nav a:hover{color:var(--ink)}
@media (max-width:640px){.nav{display:none}}
.cart-btn{position:relative;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:15px;cursor:pointer;display:flex;align-items:center;gap:8px}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;padding:0 6px}
.badge[hidden]{display:none}

/* hero */
.hero{padding:72px 0 48px}
.hero h1{font-size:clamp(32px,6vw,52px);letter-spacing:-.02em;max-width:16ch}
.hero p{font-size:18px;color:var(--muted);max-width:52ch;margin:16px 0 28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 22px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;background:var(--accent);color:var(--accent-ink)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}

/* services */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 15px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:18px}
.card p{margin:0;color:var(--muted);font-size:15px;flex:1}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.price{font-weight:700;font-size:18px}
.price small{font-weight:400;color:var(--muted);font-size:13px}
.qty{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.qty button{border:0;background:transparent;color:var(--ink);width:38px;height:38px;font-size:20px;cursor:pointer}
.qty button:hover{background:var(--line)}
.qty span{min-width:24px;text-align:center;font-weight:600}
.add{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:12px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.add:hover{background:var(--accent);color:var(--accent-ink)}

/* works */
.works{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.work{aspect-ratio:4/3;border-radius:var(--radius);overflow:hidden;position:relative;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 35%,var(--surface)),color-mix(in srgb,var(--accent) 10%,var(--surface)));display:flex;align-items:flex-end}
.work img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.work span{position:relative;z-index:1;margin:12px;padding:5px 11px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:13px}

/* about + contacts */
.about p{max-width:62ch;color:var(--muted);font-size:17px;margin:0 0 12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:24px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.fact b{display:block;font-size:24px}
.fact span{color:var(--muted);font-size:14px}
.contacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.contact{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;text-decoration:none;display:block}
.contact small{display:block;color:var(--muted);font-size:13px;margin-bottom:4px}
.contact strong{font-size:17px;word-break:break-word}
footer{padding:28px 0 40px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}

/* drawer */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:41;background:var(--surface);color:var(--ink);display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .25s ease;
  right:0;top:0;bottom:0;width:min(440px,100%);transform:translateX(100%)}
.drawer.open{transform:none}
@media (max-width:640px){
  .drawer{left:0;right:0;top:auto;width:100%;max-height:92vh;border-radius:20px 20px 0 0;transform:translateY(100%)}
}
.d-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.d-head h2{font-size:20px}
.x{border:0;background:transparent;color:var(--ink);font-size:26px;line-height:1;cursor:pointer;width:36px;height:36px;border-radius:10px}
.x:hover{background:var(--line)}
.d-body{padding:16px 20px;overflow:auto;flex:1}
.d-foot{padding:14px 20px 20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.line{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.line .nm{font-weight:600}
.line .sm{color:var(--muted);font-size:14px}
.total{display:flex;justify-content:space-between;font-size:18px;font-weight:700}
.field{display:flex;flex-direction:column;gap:5px;margin-top:14px;font-size:14px;color:var(--muted)}
.field input,.field textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.field input:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea.out{min-height:210px;resize:vertical;font-size:15px;line-height:1.5}
.hint{color:var(--muted);font-size:14px;margin:0 0 10px}
.msgrs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.msgrs a{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:12px;color:#fff;font-weight:600;text-decoration:none;font-size:15px}
.m-tg{background:#229ed9}.m-wa{background:#25a244}.m-vk{background:#0077ff}.m-tel{background:#555a58}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#1c1f1e;color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<noscript>Для работы сайта нужен JavaScript.</noscript>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#top" id="brandTop"></a>
    <nav class="nav" id="nav"></nav>
    <button class="cart-btn" id="cartBtn" aria-label="Открыть корзину">
      <span>Корзина</span><span class="badge" id="badge" hidden>0</span>
    </button>
  </div>
</header>

<main id="top">
  <section class="hero"><div class="wrap">
    <h1 id="heroTitle"></h1>
    <p id="heroText"></p>
    <div class="hero-actions">
      <a class="btn" id="chooseBtn" href="#services">Выбрать услуги</a>
      <a class="btn ghost" href="#contacts">Контакты</a>
    </div>
  </div></section>

  <section id="services"><div class="wrap">
    <h2 class="section-title" id="servicesTitle">Услуги и цены</h2>
    <p class="section-sub" id="servicesSub">Добавьте нужное в корзину, затем нажмите «Заказать» — вы получите готовый текст заявки и ссылки на мессенджеры.</p>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
  </div></section>

  <section id="works"><div class="wrap">
    <h2 class="section-title">Примеры работ</h2>
    <p class="section-sub" id="worksSub"></p>
    <div class="works" id="worksGrid"></div>
  </div></section>

  <section id="about" class="about"><div class="wrap">
    <h2 class="section-title">О нас</h2>
    <div id="aboutText"></div>
    <div class="facts" id="facts"></div>
  </div></section>

  <section id="contacts"><div class="wrap">
    <h2 class="section-title">Контакты</h2>
    <p class="section-sub">Свяжитесь с нами удобным способом.</p>
    <div class="contacts" id="contactsGrid"></div>
  </div></section>
</main>

<footer><div class="wrap" id="foot"></div></footer>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Корзина"></aside>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   НАСТРОЙКИ КЛИЕНТА — меняйте только этот блок
   ===================================================================== */
const CONFIG = (function () { var d = /*CONFIG*/{}/*/CONFIG*/; try { if (/[?&]preview/.test(location.search)) { var p = localStorage.getItem("draft:" + location.pathname.replace(/[^/]*$/, "")); if (p) return JSON.parse(p); } } catch (e) {} return d; })();

/* =====================================================================
   КОД САЙТА — ниже ничего менять не нужно
   ===================================================================== */
(function () {
  const C = CONFIG;
  const U = Object.assign({ nav: "Услуги", servicesTitle: "Услуги и цены", servicesSub: "", chooseBtn: "Выбрать услуги",
    whenLabel: "Желаемая дата и время (по желанию)", whenText: "Желаемая дата и время" }, C.ui);
  const $ = (s) => document.querySelector(s);
  const money = (n) => new Intl.NumberFormat("ru-RU").format(n) + "\u00A0" + C.currency;

  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (v == null || v === false) return;
      if (k === "class") e.className = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    });
    kids.flat().forEach((c) => {
      if (c == null || c === false) return;
      e.append(c.nodeType ? c : document.createTextNode(c));
    });
    return e;
  }

  /* ---------- состояние ---------- */
  const KEY = "order:" + C.brand;
  let cart = {};                      // id -> количество
  let form = { name: "", when: "", comment: "" };
  let category = "Все";
  let view = "cart";                  // "cart" | "order"

  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || "{}");
    if (saved.cart) cart = saved.cart;
    if (saved.form) form = Object.assign(form, saved.form);
  } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ cart, form })); } catch (e) {} };

  const byId = (id) => C.services.find((s) => s.id === id);
  // убираем из корзины услуги, которых больше нет в списке
  Object.keys(cart).forEach((id) => { if (!byId(id)) delete cart[id]; });

  const items = () => Object.keys(cart).map((id) => ({ s: byId(id), q: cart[id] })).filter((x) => x.s && x.q > 0);
  const count = () => items().reduce((a, x) => a + x.q, 0);
  const total = () => items().reduce((a, x) => a + (x.s.price ? x.s.price * x.q : 0), 0);
  const hasOnRequest = () => items().some((x) => !x.s.price);

  function setQty(id, q) {
    if (q <= 0) delete cart[id]; else cart[id] = Math.min(q, 99);
    save(); renderServices(); renderBadge();
    if ($("#drawer").classList.contains("open")) renderDrawer();
  }

  /* ---------- шапка, текст, цвет ---------- */
  document.documentElement.style.setProperty("--accent", C.accent);
  document.title = C.brand;
  const md = document.querySelector('meta[name="description"]');
  if (md) md.setAttribute("content", C.tagline + ". " + C.description);
  $("#brandTop").textContent = C.brand;
  $("#heroTitle").textContent = C.brand;
  $("#heroText").textContent = C.tagline + (C.description ? ". " + C.description : "");
  $("#servicesTitle").textContent = U.servicesTitle;
  if (U.servicesSub) $("#servicesSub").textContent = U.servicesSub;
  $("#chooseBtn").textContent = U.chooseBtn;
  $("#worksSub").textContent = C.worksSubtitle || "";

  const nav = $("#nav");
  [["#services", U.nav], ["#works", "Работы"], ["#about", "О нас"], ["#contacts", "Контакты"]]
    .forEach(([href, t]) => nav.append(h("a", { href }, t)));

  /* ---------- услуги ---------- */
  function renderChips() {
    const cats = ["Все"].concat([...new Set(C.services.map((s) => s.category).filter(Boolean))]);
    const box = $("#chips"); box.innerHTML = "";
    if (cats.length <= 2) return;     // одна категория — фильтр не нужен
    cats.forEach((c) => box.append(
      h("button", { class: "chip" + (c === category ? " on" : ""), onclick: () => { category = c; renderChips(); renderServices(); } }, c)
    ));
  }

  function renderServices() {
    const grid = $("#grid"); grid.innerHTML = "";
    C.services.filter((s) => category === "Все" || s.category === category).forEach((s) => {
      const q = cart[s.id] || 0;
      const control = q > 0
        ? h("div", { class: "qty" },
            h("button", { "aria-label": "Меньше", onclick: () => setQty(s.id, q - 1) }, "−"),
            h("span", {}, String(q)),
            h("button", { "aria-label": "Больше", onclick: () => setQty(s.id, q + 1) }, "+"))
        : h("button", { class: "add", onclick: () => setQty(s.id, 1) }, "В корзину");
      grid.append(h("article", { class: "card" },
        h("h3", {}, s.name),
        s.desc ? h("p", {}, s.desc) : null,
        h("div", { class: "row" },
          h("div", { class: "price" }, s.price ? money(s.price) : "По договорённости",
            s.price && s.unit ? h("small", {}, " " + s.unit) : null),
          control)));
    });
  }

  /* ---------- работы, о нас, контакты ---------- */
  function renderStatic() {
    const wg = $("#worksGrid");
    if (!C.works || !C.works.length) $("#works").hidden = true;
    (C.works || []).forEach((w) => wg.append(h("div", { class: "work" },
      w.image ? h("img", { src: w.image, alt: w.title || "", loading: "lazy" }) : null,
      w.title ? h("span", {}, w.title) : null)));

    const at = $("#aboutText");
    (C.about || []).forEach((p) => at.append(h("p", {}, p)));
    (C.facts || []).forEach((f) => $("#facts").append(h("div", { class: "fact" }, h("b", {}, f.value), h("span", {}, f.label))));
    if (!(C.about || []).length && !(C.facts || []).length) $("#about").hidden = true;

    const cg = $("#contactsGrid");
    const m = C.messengers || {};
    const add = (label, text, href) => text && cg.append(h(href ? "a" : "div", { class: "contact", href, target: href && href.startsWith("http") ? "_blank" : null, rel: "noopener" }, h("small", {}, label), h("strong", {}, text)));
    add("Телефон", C.phone, C.phone ? "tel:" + C.phone.replace(/[^\d+]/g, "") : null);
    add("Telegram", m.telegram && (/^\+/.test(m.telegram) ? "" : "@") + m.telegram, m.telegram && "https://t.me/" + m.telegram);
    add("WhatsApp", m.whatsapp && "+" + m.whatsapp, m.whatsapp && "https://wa.me/" + m.whatsapp);
    add("ВКонтакте", m.vk && "vk.com/" + m.vk, m.vk && "https://vk.com/" + m.vk);
    add("Email", C.email, C.email ? "mailto:" + C.email : null);
    add("Адрес", C.address, null);
    add("Часы работы", C.hours, null);

    $("#foot").textContent = "© " + new Date().getFullYear() + " " + C.brand;
  }

  /* ---------- корзина ---------- */
  function renderBadge() {
    const n = count(), b = $("#badge");
    b.textContent = n; b.hidden = n === 0;
  }

  function orderText() {
    const lines = [C.order.greeting, ""];
    items().forEach((x, i) => {
      const sum = x.s.price ? " — " + money(x.s.price * x.q) : " — по договорённости";
      lines.push((i + 1) + ". " + x.s.name + " × " + x.q + sum);
    });
    lines.push("");
    if (total() > 0) lines.push("Итого: " + money(total()) + (hasOnRequest() ? " (+ позиции по договорённости)" : ""));
    if (form.name.trim()) lines.push("Имя: " + form.name.trim());
    if (form.when.trim()) lines.push(U.whenText + ": " + form.when.trim());
    if (form.comment.trim()) lines.push("Комментарий: " + form.comment.trim());
    if (C.order.closing) { lines.push(""); lines.push(C.order.closing); }
    return lines.join("\n");
  }

  const drawer = $("#drawer"), overlay = $("#overlay");
  function openDrawer(v) { view = v || "cart"; renderDrawer(); drawer.classList.add("open"); overlay.classList.add("open"); document.body.classList.add("locked"); }
  function closeDrawer() { drawer.classList.remove("open"); overlay.classList.remove("open"); document.body.classList.remove("locked"); }

  function field(label, key, multiline) {
    const el = multiline ? h("textarea", { rows: 2 }) : h("input", { type: "text" });
    el.value = form[key];
    el.addEventListener("input", () => { form[key] = el.value; save(); });
    return h("label", { class: "field" }, label, el);
  }

  function renderDrawer() {
    drawer.innerHTML = "";
    const head = h("div", { class: "d-head" },
      h("h2", {}, view === "cart" ? "Корзина" : "Ваша заявка"),
      h("button", { class: "x", "aria-label": "Закрыть", onclick: closeDrawer }, "×"));
    const body = h("div", { class: "d-body" });
    const foot = h("div", { class: "d-foot" });

    if (view === "cart") {
      const list = items();
      if (!list.length) {
        body.append(h("div", { class: "empty" }, "Пока пусто. Добавьте услуги из списка."));
        foot.append(h("button", { class: "btn", onclick: () => { closeDrawer(); location.hash = "#services"; } }, "К услугам"));
      } else {
        list.forEach((x) => body.append(h("div", { class: "line" },
          h("div", {}, h("div", { class: "nm" }, x.s.name),
            h("div", { class: "sm" }, x.s.price ? money(x.s.price) + " × " + x.q + " = " + money(x.s.price * x.q) : "По договорённости")),
          h("div", { class: "qty" },
            h("button", { "aria-label": "Меньше", onclick: () => setQty(x.s.id, x.q - 1) }, "−"),
            h("span", {}, String(x.q)),
            h("button", { "aria-label": "Больше", onclick: () => setQty(x.s.id, x.q + 1) }, "+")))));
        body.append(field("Ваше имя (по желанию)", "name"),
                    field(U.whenLabel, "when"),
                    field("Комментарий (по желанию)", "comment", true));
        if (total() > 0) foot.append(h("div", { class: "total" }, h("span", {}, "Итого"), h("span", {}, money(total()))));
        foot.append(h("button", { class: "btn", onclick: () => { view = "order"; renderDrawer(); } }, "Заказать"));
      }
    } else {
      const text = orderText();
      const ta = h("textarea", { class: "field out", readonly: true });
      ta.className = "out"; ta.value = text;
      ta.style.cssText = "width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px";
      ta.addEventListener("focus", () => ta.select());
      body.append(
        h("p", { class: "hint" }, "1. Скопируйте текст заявки.  2. Откройте мессенджер и вставьте его в чат."),
        ta,
        h("button", { class: "btn", style: "width:100%;margin-top:12px", onclick: () => copy(text, ta) }, "Скопировать текст"),
        h("div", { class: "msgrs" }, messengerLinks(text, ta)));
      foot.append(h("button", { class: "btn ghost", onclick: () => { view = "cart"; renderDrawer(); } }, "← Изменить заявку"));
    }
    drawer.append(head, body, foot);
  }

  function messengerLinks(text, ta) {
    const m = C.messengers || {}, out = [];
    const link = (cls, label, href, extra) => out.push(
      h("a", Object.assign({ class: cls, href, target: href.startsWith("http") ? "_blank" : null, rel: "noopener", onclick: () => copy(text, ta, true) }, extra || {}), label));
    if (m.telegram) link("m-tg", "Telegram", "https://t.me/" + m.telegram);
    if (m.whatsapp) link("m-wa", "WhatsApp", "https://wa.me/" + m.whatsapp + "?text=" + encodeURIComponent(text));
    if (m.vk) link("m-vk", "ВКонтакте", "https://vk.me/" + m.vk);
    if (C.phone) link("m-tel", "Позвонить", "tel:" + C.phone.replace(/[^\d+]/g, ""));
    return out;
  }

  /* ---------- копирование ---------- */
  let toastTimer;
  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
  }
  function copy(text, ta, silentFail) {
    const done = () => toast("Текст скопирован — вставьте его в чат");
    const fallback = () => {
      try { ta.focus(); ta.select(); ta.setSelectionRange(0, 99999); if (document.execCommand("copy")) return done(); } catch (e) {}
      if (!silentFail) toast("Не удалось скопировать — выделите текст вручную");
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }

  /* ---------- события ---------- */
  $("#cartBtn").addEventListener("click", () => openDrawer("cart"));
  overlay.addEventListener("click", closeDrawer);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

  renderChips(); renderServices(); renderStatic(); renderBadge();
})();
</script>

  b.style.cssText = "position:relative;z-index:99;background:#111;color:#fff;font:14px/1.4 system-ui,sans-serif;padding:9px 16px;text-align:center";
  b.innerHTML = p ? "Предпросмотр ваших изменений — видно только на этом устройстве · <a href='admin/' style='color:#ffd54a'>вернуться в кабинет</a>"
                  : "Демо-версия сайта · цены примерные · <a href='admin/' style='color:#ffd54a'>✎ войти в кабинет и изменить</a>";
  document.body.prepend(b); })();
</script>
