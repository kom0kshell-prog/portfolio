<!doctype html>
<html lang="ru">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Комильфо — Банкетный зал в Иркутске</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=Manrope:wght@400;500;600;700&family=Caveat:wght@600&display=swap">
<style>
/* Тематический ФЛАГМАН · Кафе · «Бистро»: уютное бистро — скатерть в клетку, рукописные пометки шефа, крупная антиква.
   Функции: «кухня открыта до…» и время доставки, поиск по меню, навигация по разделам с подсветкой при прокрутке,
   отметки «хит/от шефа», количество прямо в карточке, три режима — доставка / самовывоз / бронь стола,
   шкала до бесплатной доставки, выбор времени, гости и повод для брони, сводка заказа сбоку, мобильная корзина. */
:root{--accent:#c2410c;--bg:#fbf8f3;--paper:#ffffff;--ink:#22201c;--muted:#76705f;--line:#e8e1d4;--soft:#f3eee5;--green:#2f5d46;
  --d:"Prata",Georgia,serif;--b:"Manrope",system-ui,sans-serif;--hand:"Caveat","Segoe Print",cursive}
*{box-sizing:border-box}
a{color:inherit}
html{scroll-behavior:smooth;scroll-padding-top:140px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--b);-webkit-font-smoothing:antialiased}
main{overflow-x:clip}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px))}
h1,h2,h3{font-family:var(--d);font-weight:400;margin:0;line-height:1.08}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.cloth{height:14px;background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--accent) 85%,#fff) 0 14px,transparent 14px 28px),repeating-linear-gradient(0deg,color-mix(in srgb,var(--accent) 45%,#fff) 0 7px,#fff 7px 14px);background-blend-mode:multiply}
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:70px}
.brand{font:400 26px var(--d);text-decoration:none;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:#aaa}.live.on i{background:#2a9d55}
.cartb{display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:10px 18px;font:600 14px var(--b);cursor:pointer;white-space:nowrap}
.cartb b{background:var(--accent);border-radius:999px;padding:1px 8px}
@media(max-width:700px){.live{display:none}}
/* герой */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding-top:50px;padding-bottom:60px}
.hero h1{font-size:clamp(46px,7vw,96px)}
.hero h1 span{font-family:var(--hand);color:var(--accent);font-size:.62em;display:block;transform:rotate(-3deg);margin:-6px 0 6px 6px}
.hero p{font-size:18px;color:var(--muted);max-width:44ch;margin:18px 0 26px}
.modes0{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:#fff;font:600 15px var(--b);text-decoration:none;cursor:pointer}
.btn.ln{background:transparent;color:var(--ink)}
.btn.acc{background:var(--accent);border-color:var(--accent)}
.plate{position:relative;aspect-ratio:1;max-width:460px;width:100%;justify-self:center}
.plate .p{position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle,#fff 0 52%,#f1ece4 53% 60%,#fff 61%);box-shadow:0 30px 60px -25px rgba(60,40,20,.35),inset 0 0 0 1px var(--line);display:grid;place-items:center;overflow:hidden}
.plate .p img{width:100%;height:100%;object-fit:cover}
.plate .p .food{width:62%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,color-mix(in srgb,var(--accent) 55%,#ffd9a8),color-mix(in srgb,var(--accent) 80%,#5a1f00));box-shadow:inset -10px -14px 30px rgba(0,0,0,.25)}
.plate .note{position:absolute;right:-4%;top:6%;background:#fffbe6;padding:12px 16px;font:600 22px/1.1 var(--hand);transform:rotate(6deg);box-shadow:0 10px 20px -10px rgba(0,0,0,.3)}
.plate .eta{position:absolute;left:0;bottom:6%;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:12px 16px;font-size:14px;box-shadow:0 14px 30px -18px rgba(0,0,0,.35)}
.plate .eta b{display:block;font:400 22px var(--d)}
@media(max-width:860px){.hero{grid-template-columns:1fr}.plate{max-width:360px}}
/* меню */
.layout{display:grid;grid-template-columns:1fr 360px;gap:30px;align-items:start;padding-bottom:60px}
.layout>div{min-width:0}
.nav{position:sticky;top:70px;z-index:30;background:var(--bg);display:flex;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.nav a{flex-shrink:0;text-decoration:none;padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.nav a.on{background:var(--ink);color:#fff}
.srch{flex:1 0 180px;margin-left:auto;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font:15px var(--b);color:var(--ink);min-width:160px}
.cat{padding-top:30px}
.cat h2{font-size:clamp(30px,3.6vw,44px);margin-bottom:16px;display:flex;align-items:baseline;gap:12px}
.cat h2 small{font:600 26px var(--hand);color:var(--accent)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(270px,100%),1fr));gap:16px}
.dish{background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;transition:.25s}
.dish:hover{box-shadow:0 20px 40px -26px rgba(60,40,20,.45);transform:translateY(-2px)}
.dish .ph{aspect-ratio:16/10;background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--accent) var(--k),#ffe0b8) 0 28%,#fff 29% 40%,var(--soft) 41%);position:relative}
.dish .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dish .bd{position:absolute;left:12px;top:12px;background:var(--accent);color:#fff;font:600 18px/1 var(--hand);padding:5px 10px 3px;border-radius:999px;transform:rotate(-4deg)}
.dish .bd.ch{background:var(--green)}
.dish .tx{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.dish h3{font-size:22px}
.dish p{margin:0;color:var(--muted);font-size:14px;flex:1}
.dish .r{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.dish .pr{font:400 22px var(--d)}.dish .pr small{font:500 13px var(--b);color:var(--muted)}
.add{border:0;background:var(--ink);color:#fff;border-radius:999px;padding:10px 16px;font:600 14px var(--b);cursor:pointer}
.qty{display:inline-flex;align-items:center;background:var(--accent);color:#fff;border-radius:999px}
.qty button{width:38px;height:38px;border:0;background:none;color:#fff;font-size:18px;cursor:pointer}
.qty span{min-width:20px;text-align:center;font-weight:700}
.nores{color:var(--muted);padding:30px 0}
/* сводка */
.side{position:sticky;top:90px;background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:22px;max-height:calc(100vh - 110px);overflow:auto}
.side h3{font-size:26px;margin-bottom:12px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:14px;padding:4px;margin-bottom:14px}
.modes button{border:0;background:none;border-radius:10px;padding:9px 4px;font:600 13px var(--b);color:var(--muted);cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
.li .q{display:flex;align-items:center;gap:4px}.li .q button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.free{margin:12px 0}
.free .bar{height:8px;border-radius:8px;background:var(--soft);overflow:hidden}.free .bar i{display:block;height:100%;background:var(--green);transition:width .4s}
.free small{color:var(--muted);font-size:13px}
.fl{display:block;margin-top:10px}
.fl span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.fl input,.fl select,.fl textarea{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:#fff;font:15px var(--b);color:var(--ink)}
.fl textarea{min-height:60px;resize:vertical}
.fl.bad input{border-color:#c0392b}.fl em{display:block;font-style:normal;color:#c0392b;font-size:12px;margin-top:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex-shrink:0;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;font:600 13px var(--b);cursor:pointer;color:var(--ink);text-align:center}
.chip small{display:block;font-weight:400;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}.chip[aria-pressed="true"] small{color:#ddd}
.guests{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.guests div{display:flex;align-items:center;gap:8px}.guests button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:18px;color:var(--ink)}
.sum{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;font-size:15px}
.sum div{display:flex;justify-content:space-between;padding:2px 0}
.sum .t{font:400 24px var(--d);margin-top:4px}
.out{width:100%;min-height:110px;margin-top:10px;border-radius:12px;border:1px dashed var(--line);padding:10px;font:13px/1.5 var(--b);background:var(--soft);color:var(--ink);resize:vertical}
.send{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px;margin-top:8px}
.send a,.send button{display:flex;justify-content:center;align-items:center;padding:11px 6px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;font:600 13px var(--b);cursor:pointer}
.send .main{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:#fff;font-size:15px;padding:13px}
.send .main[aria-disabled="true"]{opacity:.45;pointer-events:none}
.need{font-size:12px;color:var(--muted);margin:6px 0 0}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.side{position:fixed;inset:auto 0 0 0;top:auto;border-radius:24px 24px 0 0;max-height:88vh;z-index:60;transform:translateY(105%);transition:transform .3s;visibility:hidden;box-shadow:0 -20px 50px rgba(0,0,0,.25)}.side.open{transform:none;visibility:visible}}
.sx{display:none;position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer}
@media(max-width:1000px){.sx{display:block}}
.mbar{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:50;display:none;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:18px;padding:10px 10px 10px 16px;box-shadow:0 14px 30px rgba(0,0,0,.3);border:0;font:inherit;text-align:left;cursor:pointer;width:auto}
.mbar div{flex:1;font-size:13px}.mbar b{display:block;font:400 19px var(--d)}
.mbar span{background:var(--accent);border-radius:12px;padding:10px 14px;font-weight:600}
@media(max-width:1000px){.mbar{display:flex}}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;opacity:0;pointer-events:none;transition:.25s}.shade.open{opacity:1;pointer-events:auto}
section.extra{padding:70px 0;border-top:1px solid var(--line)}
.revs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:16px}
.rev{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px}
.rev p{font:400 19px/1.4 var(--d);margin:6px 0 10px}.rev .s{color:#d39b00;letter-spacing:2px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:14px;margin-top:20px}
.g{aspect-ratio:1;border-radius:22px;overflow:hidden;position:relative;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 40%,#ffe0b8),var(--soft));display:flex;align-items:flex-end}
.g img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.g span{position:relative;margin:12px;background:#fff;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:600}
details{border-bottom:1px solid var(--line)}summary{padding:16px 0;cursor:pointer;font:400 21px var(--d)}details p{margin:0 0 16px;color:var(--muted)}
.cts{display:grid;grid-template-columns:1fr 1fr;gap:30px}
.cl a,.cl div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none}
.cl span{color:var(--muted)}
@media(max-width:800px){.cts{grid-template-columns:1fr}}
footer{padding:30px 0 110px;text-align:center;color:var(--muted);font-size:14px}
[data-m="del"]{display:none!important}[hidden]{display:none!important}
</style>
</head>
<body>
<div class="cloth" aria-hidden="true"></div>
<header class="top"><div class="wrap"><a class="brand" id="brand" href="#"></a><span class="live" id="live"><i></i><span></span></span><button class="cartb" id="cartb" type="button">Заказ <b id="cnt">0</b></button></div></header>
<main>
  <div class="wrap hero">
    <div><h1><span>банкеты и праздники</span><em style="font-style:normal" id="h1"></em></h1><p id="lead"></p>
      <div class="modes0"><button class="btn acc" type="button" data-m="del">Заказать доставку</button><button class="btn" type="button" data-m="pick">Самовывоз</button><button class="btn ln" type="button" data-m="table">Забронировать стол</button></div></div>
    <div class="plate"><div class="p" id="plateP"><div class="food"></div></div><div class="note" id="chef"></div><div class="eta" id="eta"></div></div>
  </div>
  <div class="wrap layout">
    <div>
      <nav class="nav" id="nav" aria-label="Разделы меню"><input class="srch" id="q" type="search" placeholder="Найти блюдо" aria-label="Поиск по меню"></nav>
      <div id="menu"></div>
    </div>
    <aside class="side" id="side" aria-label="Ваш заказ"><button class="sx" id="sx" type="button" aria-label="Закрыть">×</button>
      <h3>Ваш заказ</h3>
      <div class="modes" role="group" aria-label="Способ"><button type="button" data-m="del">Доставка</button><button type="button" data-m="pick">Самовывоз</button><button type="button" data-m="table">Стол</button></div>
      <div id="list"></div>
      <div class="free" id="free"><div class="bar"><i id="fb"></i></div><small id="ft"></small></div>
      <div id="modeFields"></div>
      <label class="fl" id="wN"><span>Имя</span><input id="fName" autocomplete="name"><em hidden>Как к вам обращаться?</em></label>
      <label class="fl" id="wP"><span>Телефон</span><input id="fPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 (___) ___-__-__"><em hidden>Номер полностью — 11 цифр</em></label>
      <label class="fl"><span>Комментарий</span><textarea id="fNote" placeholder="Без лука, позвонить в домофон…"></textarea></label>
      <div class="sum" id="sum"></div>
      <textarea class="out" id="out" readonly aria-label="Текст заказа"></textarea>
      <div class="send" id="send"></div><p class="need" id="need"></p>
    </aside>
  </div>
  <section class="extra"><div class="wrap"><h2 style="font-size:clamp(34px,4.4vw,52px)">Из нашего зала</h2><p style="color:var(--muted)" id="wSub"></p><div class="gal" id="gal"></div></div></section>
  <section class="extra"><div class="wrap"><h2 style="font-size:clamp(34px,4.4vw,52px);margin-bottom:20px">Гости о нас</h2><div class="revs" id="revs"></div></div></section>
  <section class="extra"><div class="wrap cts"><div><h2 style="font-size:clamp(34px,4.4vw,52px);margin-bottom:12px">Вопросы</h2><div id="fq"></div></div><div><h2 style="font-size:clamp(34px,4.4vw,52px);margin-bottom:12px">Контакты</h2><div class="cl" id="cl"></div></div></div></section>
</main>
<footer id="foot"></footer>
<button class="mbar" id="mbar" type="button"><div id="mtxt"></div><span>Корзина</span></button>
<div class="shade" id="shade"></div>

<script>
/* ===== ЯДРО: корзина, текст заявки, мессенджеры. Менять не нужно. ===== */
const K = (function () {
  const C = CONFIG;
