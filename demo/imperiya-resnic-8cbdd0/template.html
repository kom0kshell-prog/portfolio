<!doctype html>
<html lang="ru">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Студия Нежность</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Bubbles&family=Montserrat:wght@400;600;800&display=swap">
<style>
/* Тематический (сложный) · Бьюти · «Глянец Y2K»: хром, блёстки, пузыри и наклейки нулевых.
   Функции: тест «подберём процедуру» из 3 вопросов, шлейф блёсток за курсором, слайдер «до/после», наклейки-услуги, заявка-«косметичка». */
:root{--accent:#b5527a;--bg:#f3e8ff;--bg2:#ffe3f3;--ink:#2a1238;--muted:#7a5b8c;--white:#fff;--chrome:linear-gradient(135deg,#fdfbff 0%,#d9c8ef 22%,#ffffff 38%,#c6b2e3 55%,#fff6fd 72%,#d6c2ee 100%);
  --d:"Rubik Bubbles","Comfortaa",system-ui,sans-serif;--b:"Montserrat",system-ui,sans-serif}
*{box-sizing:border-box}
a{color:inherit}
body{margin:0;color:var(--ink);font:16px/1.55 var(--b);background:radial-gradient(circle at 10% 0,var(--bg2),transparent 40%),radial-gradient(circle at 100% 30%,#dff4ff,transparent 35%),var(--bg);overflow-x:hidden}
.wrap{max-width:1140px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:var(--d);font-weight:400;margin:0;line-height:1.05}
canvas#gl{position:fixed;inset:0;pointer-events:none;z-index:60}
.top .wrap{display:flex;align-items:center;gap:14px;height:76px}
.brand{font:400 26px var(--d);margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:linear-gradient(90deg,var(--accent),#7b5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{border:2px solid #fff;background:var(--chrome);color:var(--ink);border-radius:999px;padding:10px 18px;font:800 14px var(--b);cursor:pointer;box-shadow:0 6px 18px rgba(120,60,160,.25),inset 0 2px 0 #fff;display:flex;gap:8px;align-items:center;white-space:nowrap}
.pill b{background:var(--accent);color:#fff;border-radius:999px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:12px}
.hero{text-align:center;padding:40px 0 60px;position:relative}
.hero h1{font-size:clamp(52px,11vw,140px);background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #8f73b8) drop-shadow(0 4px 0 #6d4f99) drop-shadow(0 14px 24px rgba(120,60,160,.4));overflow-wrap:anywhere}
.hero p{font-size:19px;color:var(--muted);max-width:48ch;margin:20px auto 28px}
.spark{position:absolute;color:#fff;text-shadow:0 0 12px #fff,0 0 22px var(--accent);font-size:34px;animation:tw 2.4s ease-in-out infinite;pointer-events:none}
@keyframes tw{50%{transform:scale(.5) rotate(45deg);opacity:.4}}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;padding:16px 28px;border-radius:999px;border:2px solid #fff;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 70%,#fff),var(--accent));color:#fff;font:800 15px var(--b);text-decoration:none;cursor:pointer;box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 40%,transparent),inset 0 2px 0 rgba(255,255,255,.6)}
.btn.c{background:var(--chrome);color:var(--ink)}
.btn:focus-visible,.pill:focus-visible,.stk:focus-visible,.opt:focus-visible{outline:3px dashed var(--accent);outline-offset:4px}
section{padding:50px 0}
.sh{text-align:center;margin-bottom:28px}.sh h2{font-size:clamp(34px,6vw,64px);color:var(--accent);text-shadow:3px 3px 0 #fff}
.sh p{color:var(--muted);margin:10px auto 0;max-width:52ch}
/* тест */
.quiz{background:rgba(255,255,255,.7);backdrop-filter:blur(10px);border:3px solid #fff;border-radius:36px;padding:clamp(22px,4vw,40px);box-shadow:0 30px 60px -30px rgba(120,60,160,.5);max-width:820px;margin:0 auto}
.qbar{display:flex;gap:6px;margin-bottom:18px}.qbar i{flex:1;height:8px;border-radius:8px;background:#e8dcf6}.qbar i.on{background:linear-gradient(90deg,var(--accent),#7b5cff)}
.quiz h3{font:800 24px var(--b);margin-bottom:16px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:10px}
.opt{padding:16px;border-radius:20px;border:2px solid #fff;background:var(--chrome);font:600 16px var(--b);color:var(--ink);cursor:pointer;text-align:left;box-shadow:0 6px 14px rgba(120,60,160,.15)}
.opt:hover{transform:translateY(-2px)}
.res{display:grid;gap:10px}
.res .r{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:#fff}
.res .r b{font-weight:800}
.qa{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
/* наклейки */
.cat{font:400 32px var(--d);color:var(--ink);margin:30px 0 14px;text-align:center}
.stks{display:flex;flex-wrap:wrap;gap:20px;justify-content:center}
.stk{width:220px;max-width:100%;padding:22px 18px;border-radius:40% 60% 55% 45% / 50% 45% 55% 50%;border:4px solid #fff;background:var(--g);color:var(--ink);text-align:center;cursor:pointer;font:inherit;box-shadow:0 14px 26px -10px rgba(120,60,160,.45),inset 0 3px 0 rgba(255,255,255,.7);transition:transform .25s;position:relative}
.stk:nth-child(odd){transform:rotate(-3deg)}.stk:nth-child(even){transform:rotate(3deg)}
.stk:hover{transform:rotate(0) scale(1.05)}
.stk b{display:block;font:800 17px/1.2 var(--b)}
.stk small{display:block;margin-top:6px;opacity:.75;font-size:13px}
.stk .pr{display:inline-block;margin-top:10px;background:#fff;border-radius:999px;padding:4px 12px;font-weight:800;font-size:14px}
.stk[aria-pressed="true"]::after{content:"✦ в косметичке";position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;font:800 12px var(--b);padding:4px 12px;border-radius:999px;border:2px solid #fff;white-space:nowrap}
/* до/после */
.ba{position:relative;max-width:820px;margin:0 auto;aspect-ratio:16/9;border-radius:36px;overflow:hidden;border:4px solid #fff;box-shadow:0 30px 60px -30px rgba(120,60,160,.5)}
.ba .a,.ba .b{position:absolute;inset:0;display:flex;align-items:flex-end;padding:22px;font:800 18px var(--b);color:#fff}
.ba .a{background:linear-gradient(135deg,#b9b0bd,#8f8794)}
.ba .b{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 60%,#fff),#9a7bff);clip-path:inset(0 0 0 50%);justify-content:flex-end}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ba .ln{position:absolute;top:0;bottom:0;left:50%;width:4px;background:#fff;transform:translateX(-50%);pointer-events:none}
.ba .ln::after{content:"⟷";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--accent);font-size:20px}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.ba span{position:relative;z-index:1;background:rgba(0,0,0,.25);padding:4px 12px;border-radius:999px}
.revs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:18px}
.rev{background:#fff;border-radius:30px;padding:24px;border:3px solid #fff;box-shadow:0 14px 26px -16px rgba(120,60,160,.5)}
.rev .st{color:var(--accent)}
.rev p{margin:8px 0 12px;font-weight:600}
.cl{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.cl a,.cl div{background:var(--chrome);border:2px solid #fff;border-radius:999px;padding:12px 20px;text-decoration:none;color:var(--ink);font-weight:600;box-shadow:0 6px 14px rgba(120,60,160,.15)}
footer{text-align:center;padding:30px 0 50px;color:var(--muted)}
.shade{position:fixed;inset:0;background:rgba(60,20,80,.35);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:.25s;z-index:40}.shade.open{opacity:1;pointer-events:auto}
.bag{position:fixed;left:50%;top:50%;width:min(520px,calc(100% - 24px));max-height:90vh;overflow:auto;background:var(--chrome);border:4px solid #fff;border-radius:36px;padding:26px;z-index:41;transform:translate(-50%,-46%) scale(.96);opacity:0;pointer-events:none;transition:.25s;box-shadow:0 40px 80px -30px rgba(80,30,110,.6)}
.bag.open{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.bag .t{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.bag h2{font-size:34px;color:var(--accent)}
.bag .x{width:42px;height:42px;border-radius:50%;border:2px solid #fff;background:#fff;font-size:20px;cursor:pointer}
.op-row{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:6px;background:#fff;border-radius:16px}
.op-nm{flex:1;font-weight:800}.op-nm small{display:block;font-weight:400;color:var(--muted)}
.op-qty{display:flex;align-items:center;gap:4px}.op-qty button{width:30px;height:30px;border-radius:50%;border:0;background:var(--bg);cursor:pointer}.op-qty span{min-width:18px;text-align:center;font-weight:800}
.op-empty{color:var(--muted)}
.op-field{display:block;margin-top:10px;font-weight:600;font-size:13px}
.op-field input{display:block;width:100%;margin-top:4px;padding:12px 16px;border-radius:999px;border:2px solid #fff;font:15px var(--b);background:#fff;color:var(--ink)}
.op-total{display:flex;justify-content:space-between;margin-top:14px;font:400 28px var(--d);color:var(--accent)}
.op-text{width:100%;min-height:140px;margin-top:10px;border-radius:22px;border:2px solid #fff;padding:12px;font:13px/1.5 var(--b);resize:vertical;background:rgba(255,255,255,.8);color:var(--ink)}
.op-links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.op-links a,.op-links button{display:flex;justify-content:center;padding:12px;border-radius:999px;font:800 14px var(--b);text-decoration:none;color:#fff;border:2px solid #fff;cursor:pointer}
.op-copy{grid-column:1/-1;background:var(--ink)}.op-tg{background:#229ed9}.op-wa{background:#25a244}.op-vk{background:#0077ff}.op-tel{background:var(--accent)}
@media(prefers-reduced-motion:reduce){.spark{animation:none}}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<header class="top"><div class="wrap"><div class="brand" id="brand"></div><button class="pill" id="bagb" type="button">Косметичка <b id="cnt">0</b></button></div></header>
<main class="wrap">
  <div class="hero"><span class="spark" style="left:8%;top:20%">✦</span><span class="spark" style="right:10%;top:12%;animation-delay:-.8s">✧</span><span class="spark" style="right:20%;bottom:10%;animation-delay:-1.6s;font-size:24px">✦</span>
    <h1 id="h1"></h1><p id="lead"></p>
    <div class="btns"><a class="btn" href="#quiz">Подобрать процедуру ✦</a><a class="btn c" href="#stickers">Все услуги</a></div></div>
  <section id="quiz"><div class="sh"><h2>Тест за 15 секунд</h2><p>Три вопроса — и мы предложим процедуры под ваш запрос.</p></div><div class="quiz" id="qz"></div></section>
  <section id="stickers"><div class="sh"><h2 id="sTitle"></h2><p>Нажмите на наклейку, чтобы положить процедуру в косметичку.</p></div><div id="cats"></div></section>
  <section><div class="sh"><h2>До / после</h2><p>Потяните ползунок.</p></div>
    <div class="ba" id="ba"><div class="a" id="baA"><span>до</span></div><div class="b" id="baB"><span>после</span></div><div class="ln" id="baL"></div><input type="range" min="0" max="100" value="50" aria-label="Сравнить до и после" id="baR"></div></section>
  <section><div class="sh"><h2>Любят нас</h2></div><div class="revs" id="revs"></div></section>
  <section><div class="sh"><h2>Где мы</h2><p id="addr"></p></div><div class="cl" id="cl"></div></section>
</main>
<footer id="foot"></footer>
<div class="shade" id="shade"></div>
<div class="bag" id="bag" role="dialog" aria-modal="true" aria-labelledby="bt"><div class="t"><h2 id="bt">Косметичка</h2><button class="x" id="bx" type="button" aria-label="Закрыть">×</button></div><div id="panel"></div></div>
<script>
const CONFIG = (function () { var d = /*CONFIG*/{}/*/CONFIG*/; try { if (/[?&]preview/.test(location.search)) { var p = localStorage.getItem("draft:" + location.pathname.replace(/[^/]*$/, "")); if (p) return JSON.parse(p); } } catch (e) {} return d; })();
</script>
<script>
/* ===== ЯДРО: корзина, текст заявки, мессенджеры. Менять не нужно. ===== */
const K = (function () {
  const C = CONFIG;
  const money = (n) => new Intl.NumberFormat("ru-RU").format(n) + " " + C.currency;
  const KEY = "k:" + location.pathname + ":" + C.brand;
  const st = { cart: {}, form: {} };
  try { Object.assign(st, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
  const byId = (id) => C.services.find((s) => s.id === id);
  Object.keys(st.cart).forEach((id) => { if (!byId(id)) delete st.cart[id]; });
  const subs = [];
  const emit = () => { save(); subs.forEach((f) => f()); };
  const pad = (n) => String(n).padStart(2, "0");
  const toMin = (t) => { const [a, b] = t.split(":").map(Number); return a * 60 + b; };
  const B = Object.assign({ open: "10:00", close: "20:00", step: 60, days: [0, 1, 2, 3, 4, 5, 6] }, C.booking);

  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (v == null || v === false) return;
      if (k === "class") e.className = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    });
    kids.flat().forEach((c) => { if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c)); });
    return e;
  }

  const st0 = document.createElement("style");
  st0.textContent = "[hidden]{display:none!important}.k-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:#111;color:#fff;padding:11px 18px;border-radius:12px;font:14px/1.4 system-ui,sans-serif;opacity:0;transition:.25s;z-index:999;pointer-events:none;max-width:calc(100% - 32px);text-align:center}.k-toast.show{opacity:1;transform:translate(-50%,0)}";
  document.head.prepend(st0);
  let toastEl, toastT;
  function toast(msg) {
    if (!toastEl) { toastEl = h("div", { class: "k-toast", role: "status" }); document.body.append(toastEl); }
    toastEl.textContent = msg; toastEl.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove("show"), 2400);
  }

  const api = {
    C, h, money, byId, toast, pad,
    qty: (id) => st.cart[id] || 0,
    set(id, q) { if (q <= 0) delete st.cart[id]; else st.cart[id] = Math.min(q, 99); emit(); },
    toggle(id) { api.set(id, api.qty(id) ? 0 : 1); },
    clear() { st.cart = {}; emit(); },
    items: () => Object.keys(st.cart).map((id) => ({ s: byId(id), q: st.cart[id] })).filter((x) => x.s),
    count: () => api.items().reduce((a, x) => a + x.q, 0),
    total: () => api.items().reduce((a, x) => a + (x.s.price || 0) * x.q, 0),
    onRequest: () => api.items().some((x) => !x.s.price),
    on: (f) => subs.push(f),
    field(k, v) { if (v === undefined) return st.form[k] || ""; st.form[k] = v; save(); },
    cats: () => [...new Set(C.services.map((s) => s.category).filter(Boolean))],
    price: (s) => (s.price ? money(s.price) : "по договорённости"),

    /* текст заявки; extra — массив [подпись, значение] */
    text(extra) {
      const L = [C.order.greeting, ""];
      api.items().forEach((x, i) => L.push((i + 1) + ". " + x.s.name + (x.q > 1 ? " × " + x.q : "") + " — " + (x.s.price ? money(x.s.price * x.q) : "по договорённости")));
      if (!api.items().length) L.push("(услуги обсудим)");
      L.push("");
      if (api.total() > 0) L.push("Итого: " + money(api.total()) + (api.onRequest() ? " + позиции по договорённости" : ""));
      (extra || []).forEach(([k, v]) => { if (v && String(v).trim()) L.push(k + ": " + String(v).trim()); });
      if (C.order.closing) L.push("", C.order.closing);
      return L.join("\n");
    },

    /* ссылки на мессенджеры владельца */
    links(text) {
      const m = C.messengers || {}, out = [];
      if (m.telegram) out.push({ k: "tg", label: "Telegram", href: "https://t.me/" + m.telegram });
      if (m.whatsapp) out.push({ k: "wa", label: "WhatsApp", href: "https://wa.me/" + m.whatsapp + (text ? "?text=" + encodeURIComponent(text) : "") });
      if (m.vk) out.push({ k: "vk", label: "ВКонтакте", href: "https://vk.me/" + m.vk });
      if (C.phone) out.push({ k: "tel", label: "Позвонить", href: "tel:" + C.phone.replace(/[^\d+]/g, "") });
      return out;
    },
    tel: () => (C.phone ? "tel:" + C.phone.replace(/[^\d+]/g, "") : null),

    copy(text) {
      const ok = () => toast("Текст скопирован — вставьте его в чат");
      const fb = () => {
        const t = h("textarea", { style: "position:fixed;opacity:0" }); t.value = text; document.body.append(t); t.select();
        let done = false; try { done = document.execCommand("copy"); } catch (e) {}
        t.remove(); done ? ok() : toast("Не получилось скопировать — выделите текст вручную");
      };
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, fb); else fb();
    },


    /* готовый блок заявки: список, поля, итог, текст, мессенджеры. Оформляется классами op-* */
    panel(box, opt) {
      opt = opt || {};
      const UI = C.ui || {};
      const fields = opt.fields || [["fName", "Ваше имя"], ["fWhen", UI.whenLabel || "Когда удобно"], ["fNote", "Комментарий"]];
      const list = h("div", { class: "op-list" }), total = h("div", { class: "op-total" });
      const ta = h("textarea", { class: "op-text", readonly: true, "aria-label": "Текст заявки" });
      const links = h("div", { class: "op-links" });
      const inputs = fields.map(([id, label]) => {
        const i = h("input", { id: "op-" + id }); i.value = api.field(id);
        i.addEventListener("input", () => { api.field(id, i.value); refreshText(); });
        return h("label", { class: "op-field" }, h("span", {}, label), i);
      });
      box.append(list, h("div", { class: "op-fields" }, inputs), total, ta, links);
      const extra = () => fields.map(([id, label]) => [id === "fWhen" ? (UI.whenText || "Когда") : id === "fName" ? "Имя" : label.replace(/ \(.*\)$/, ""), api.field(id)]).concat(opt.extra ? opt.extra() : []);
      function refreshText() {
        const t = api.text(extra()); ta.value = t; links.innerHTML = "";
        links.append(h("button", { type: "button", class: "op-copy", onclick: () => api.copy(t) }, "Скопировать текст"));
        api.links(t).forEach((x) => links.append(h("a", { class: "op-" + x.k, href: x.href, target: x.k === "tel" ? null : "_blank", rel: "noopener", onclick: () => x.k !== "wa" && x.k !== "tel" && api.copy(t) }, x.label)));
      }
      function refresh() {
        list.innerHTML = "";
        if (!api.items().length) list.append(h("p", { class: "op-empty" }, opt.empty || "Пока ничего не выбрано."));
        api.items().forEach((x) => list.append(h("div", { class: "op-row" },
          h("div", { class: "op-nm" }, x.s.name, h("small", {}, x.s.price ? api.money(x.s.price * x.q) : "по договорённости")),
          h("div", { class: "op-qty" },
            h("button", { type: "button", "aria-label": "Меньше", onclick: () => api.set(x.s.id, x.q - 1) }, "−"),
            h("span", {}, String(x.q)),
            h("button", { type: "button", "aria-label": "Больше", onclick: () => api.set(x.s.id, x.q + 1) }, "+")))));
        total.innerHTML = "";
        if (api.total()) total.append(h("span", {}, "Итого"), h("b", {}, api.money(api.total())));
        refreshText();
      }
      api.on(refresh); refresh();
      return { refresh };
    },
    /* график: открыто ли сейчас, ближайшие рабочие дни, свободное время */
    status() {
      if (!B.status) return { open: false, text: "" };
      const d = new Date(), m = d.getHours() * 60 + d.getMinutes();
      const open = B.days.includes(d.getDay()) && m >= toMin(B.open) && m < toMin(B.close);
      return open ? { open: true, text: "Открыто до " + B.close } : { open: false, text: "Сейчас закрыто · откроемся в " + B.open };
    },
    days(n) {
      const out = [], d = new Date(); d.setHours(0, 0, 0, 0);
      for (let i = 0; out.length < n && i < 60; i++) {
        const x = new Date(d); x.setDate(d.getDate() + i);
        if (B.days.includes(x.getDay())) out.push(x);
      }
      return out;
    },
    slots(date) {
      const out = [], now = new Date(), today = date.toDateString() === now.toDateString();
      for (let t = toMin(B.open); t + B.step <= toMin(B.close); t += B.step) {
        if (today && t <= now.getHours() * 60 + now.getMinutes() + 30) continue;
        out.push(pad(Math.floor(t / 60)) + ":" + pad(t % 60));
      }
      return out;
    },
    dayLabel(d) {
      const now = new Date(); now.setHours(0, 0, 0, 0);
      const diff = Math.round((d - now) / 864e5);
      const wd = d.toLocaleDateString("ru-RU", { weekday: "short" });
      return diff === 0 ? "Сегодня" : diff === 1 ? "Завтра" : wd.charAt(0).toUpperCase() + wd.slice(1) + ", " + d.getDate();
    },
    dateText: (d) => d.toLocaleDateString("ru-RU", { day: "numeric", month: "long", weekday: "long" })
  };
  return api;
})();

</script>
<script>
(function () {
  const { C, h } = K, $ = (id) => document.getElementById(id), U = C.ui || {};
  document.documentElement.style.setProperty("--accent", C.accent);
  $("brand").textContent = C.brand; $("h1").textContent = C.brand; $("lead").textContent = C.tagline + ". " + C.description;
  $("sTitle").textContent = U.servicesTitle || "Услуги";
  const cats = K.cats(), G = ["linear-gradient(135deg,#ffd1ec,#fff)", "linear-gradient(135deg,#d9ccff,#fff)", "linear-gradient(135deg,#c8f1ff,#fff)", "linear-gradient(135deg,#fff3b8,#fff)", "linear-gradient(135deg,#ffd9c9,#fff)"];
  cats.forEach((cat, ci) => {
    const g = h("div", { class: "stks" });
    C.services.filter((s) => s.category === cat).forEach((s) => g.append(h("button", { class: "stk", type: "button", "data-id": s.id, "aria-pressed": "false", style: "--g:" + G[ci % G.length], onclick: () => K.toggle(s.id) }, h("b", {}, s.name), s.desc ? h("small", {}, s.desc) : null, h("span", { class: "pr" }, s.price ? K.money(s.price) : "по запросу"))));
    $("cats").append(h("h3", { class: "cat" }, cat), g);
  });
  K.on(() => { document.querySelectorAll(".stk").forEach((b) => b.setAttribute("aria-pressed", K.qty(b.dataset.id) ? "true" : "false")); $("cnt").textContent = K.count(); });

  // ---- тест ----
  const prices = C.services.map((s) => s.price || 0).filter(Boolean).sort((a, b) => a - b), mid = prices[Math.floor(prices.length / 2)] || 0;
  const Q = [
    ["Что хотите обновить?", cats.map((c) => [c, c]).concat([["Удивите меня ✦", "*"]])],
    ["Сколько времени есть?", [["Забегу на часик", "fast"], ["Готова провести полдня", "long"]]],
    ["Какой бюджет?", [["До " + K.money(mid), "low"], ["Не важно — хочу красиво", "any"]]]
  ];
  let step = 0, ans = [];
  function quiz() {
    const z = $("qz"); z.innerHTML = "";
    z.append(h("div", { class: "qbar", "aria-hidden": "true" }, Q.map((_, i) => h("i", { class: i <= step ? "on" : "" }))));
    if (step < Q.length) {
      z.append(h("h3", {}, (step + 1) + " / " + Q.length + " · " + Q[step][0]), h("div", { class: "opts" }, Q[step][1].map(([t, v]) => h("button", { class: "opt", type: "button", onclick: () => { ans[step] = v; step++; quiz(); } }, t))));
      return;
    }
    let pool = C.services.filter((s) => ans[0] === "*" || s.category === ans[0]);
    if (ans[2] === "low") pool = pool.filter((s) => !s.price || s.price <= mid);
    pool = pool.slice().sort((a, b) => (ans[1] === "fast" ? (a.price || 0) - (b.price || 0) : (b.price || 0) - (a.price || 0)));
    if (ans[0] === "*") pool = cats.map((c) => pool.find((s) => s.category === c)).filter(Boolean);
    const pick = pool.slice(0, ans[1] === "fast" ? 1 : 3);
    z.append(h("h3", {}, pick.length ? "Ваша подборка ✦" : "Под такой запрос ничего нет — попробуйте ещё раз"), h("div", { class: "res" }, pick.map((s) => h("div", { class: "r" }, h("span", {}, h("b", {}, s.name), h("br"), h("small", {}, s.desc || "")), h("b", {}, K.price(s))))),
      h("div", { class: "qa" }, pick.length ? h("button", { class: "btn", type: "button", onclick: () => { pick.forEach((s) => K.qty(s.id) || K.set(s.id, 1)); open(); } }, "Положить в косметичку") : null, h("button", { class: "btn c", type: "button", onclick: () => { step = 0; ans = []; quiz(); } }, "Пройти заново")));
  }
  quiz();

  // ---- до/после ----
  const W = C.works || [];
  if (W[0] && W[0].image) $("baA").prepend(h("img", { src: W[0].image, alt: "" })); if (W[1] && W[1].image) $("baB").prepend(h("img", { src: W[1].image, alt: "" }));
  $("baR").addEventListener("input", (e) => { const v = e.target.value; $("baB").style.clipPath = "inset(0 0 0 " + v + "%)"; $("baL").style.left = v + "%"; });

  (C.reviews || []).forEach((r) => $("revs").append(h("div", { class: "rev" }, h("span", { class: "st", "aria-label": "Оценка " + r.rating }, "✦".repeat(r.rating)), h("p", {}, r.text), h("b", {}, r.name))));
  $("addr").textContent = [C.address, C.hours].filter(Boolean).join(" · ");
  const m = C.messengers || {};
  [[C.phone, K.tel()], [m.telegram && "Telegram", m.telegram && "https://t.me/" + m.telegram], [m.whatsapp && "WhatsApp", m.whatsapp && "https://wa.me/" + m.whatsapp], [m.vk && "ВКонтакте", m.vk && "https://vk.com/" + m.vk]].forEach(([v, href]) => v && $("cl").append(h("a", { href, target: href.startsWith("http") ? "_blank" : null, rel: "noopener" }, v)));
  $("foot").textContent = "© " + new Date().getFullYear() + " " + C.brand + " ✦";
  K.panel($("panel"), { empty: "В косметичке пусто — выберите наклейки или пройдите тест." });
  function open() { $("bag").classList.add("open"); $("shade").classList.add("open"); $("bx").focus(); }
  const close = () => { $("bag").classList.remove("open"); $("shade").classList.remove("open"); };
  $("bagb").onclick = open; $("bx").onclick = close; $("shade").onclick = close;
  document.addEventListener("keydown", (e) => e.key === "Escape" && close());

  // ---- шлейф блёсток ----
  const cv = $("gl"), ctx = cv.getContext("2d"), P = [];
  if (matchMedia("(hover:hover)").matches && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const rs = () => { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); };
    rs(); addEventListener("resize", rs);
    const cols = ["#ffffff", C.accent, "#b8a4ff", "#ffd1ec"];
    addEventListener("mousemove", (e) => { for (let i = 0; i < 2; i++) P.push({ x: e.clientX, y: e.clientY, vx: (Math.random() - .5) * 1.6, vy: Math.random() * 1.2 + .3, l: 1, s: Math.random() * 3 + 1.5, c: cols[Math.random() * cols.length | 0] }); }, { passive: true });
    (function loop() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      for (let i = P.length - 1; i >= 0; i--) { const p = P[i]; p.x += p.vx; p.y += p.vy; p.l -= .025; if (p.l <= 0) { P.splice(i, 1); continue; }
        ctx.globalAlpha = p.l; ctx.fillStyle = p.c; ctx.beginPath(); const s = p.s * p.l + .5; ctx.moveTo(p.x, p.y - s * 2); ctx.lineTo(p.x + s * .6, p.y); ctx.lineTo(p.x, p.y + s * 2); ctx.lineTo(p.x - s * .6, p.y); ctx.closePath(); ctx.fill(); }
      requestAnimationFrame(loop);
    })();
  }
})();
</script>
