<!doctype html>
<html lang="ru">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brilliant room — Студия красоты в Иркутске</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
a{color:inherit}
h1,h2,h3{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
section{padding:64px 0}
.section-sub{margin:0 0 28px}
.top{position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex}
.nav a{text-decoration:none}
@media(max-width:640px){.nav{display:none}}
.cart-btn{display:flex;align-items:center;gap:8px;cursor:pointer;font:inherit;flex-shrink:0}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px}
.badge[hidden]{display:none}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;font:inherit}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap}
.chip,.add,.qty button,.x{cursor:pointer;font:inherit}
.card{display:flex;flex-direction:column}
.card p{margin:0;flex:1}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qty{display:inline-flex;align-items:center;overflow:hidden}
.qty button{border:0;background:transparent;color:inherit;width:38px;height:38px;font-size:20px}
.qty span{min-width:24px;text-align:center;font-weight:600}
.work{position:relative;overflow:hidden;display:flex;align-items:flex-end}
.work img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.work span{position:relative;z-index:1}
.contact{display:block;text-decoration:none}
.contact small{display:block}
.contact strong{word-break:break-word}
.fact b{display:block}
.overlay{position:fixed;inset:0;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:41;display:flex;flex-direction:column;overflow:hidden;transition:transform .25s ease,opacity .25s;right:0;top:0;bottom:0;width:min(460px,100%);transform:translateX(100%)}
.drawer.open{transform:none}
@media(max-width:640px){.drawer{left:0;right:0;top:auto;width:100%;max-height:92vh;transform:translateY(100%)}}
.d-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px}
.x{line-height:1;width:36px;height:36px;font-size:24px}
.d-body{padding:16px 20px;overflow:auto;flex:1}
.d-foot{padding:14px 20px 20px;display:flex;flex-direction:column;gap:10px}
.empty{text-align:center;padding:44px 0}
.line{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0}
.total{display:flex;justify-content:space-between}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field input,.field textarea{font:inherit;width:100%;padding:11px 12px}
textarea.out{min-height:220px;resize:vertical}
.hint{margin:0 0 12px}
.msgrs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.msgrs a{display:flex;align-items:center;justify-content:center;padding:12px;color:#fff;font-weight:600;text-decoration:none}
.m-tg{background:#229ed9}.m-wa{background:#25a244}.m-vk{background:#0077ff}.m-tel{background:#555a58}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);padding:11px 18px;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}
.overlay{background:rgba(0,0,0,.45)}
.drawer{background:var(--surface);color:var(--ink)}
.d-head{border-bottom:1px solid var(--line)}.d-head h2{font-size:22px}
.x{background:transparent;border:0;color:var(--ink);border-radius:10px}.x:hover{background:var(--line)}
.d-foot{border-top:1px solid var(--line)}
.empty{color:var(--muted)}
.line{border-bottom:1px solid var(--line)}.line .nm{font-weight:600}.line .sm{color:var(--muted);font-size:14px}
.total{font-size:20px;font-weight:700}
.field{font-size:14px;color:var(--muted)}
.field input,.field textarea{color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px}
.field input:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.hint{color:var(--muted);font-size:14px}
.msgrs a{border-radius:12px}
.toast{background:var(--ink);color:var(--bg);border-radius:999px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:14px 24px;font-weight:600}

:root{--accent:#2f6f5e;--accent-ink:#fff;--bg:#0c0a1d;--surface:rgba(255,255,255,.07);--ink:#f5f3ff;--muted:#b9b4d4;--line:rgba(255,255,255,.14);color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:17px/1.6 "Nunito",system-ui,sans-serif;padding-bottom:84px}
h1,h2,h3{font-weight:900;line-height:1.05}
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;filter:blur(70px);opacity:.7;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;width:55vmax;height:55vmax;animation:float 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:var(--accent);top:-20vmax;left:-15vmax}
.aurora i:nth-child(2){background:#6d28d9;bottom:-25vmax;right:-15vmax;animation-delay:-7s}
.aurora i:nth-child(3){background:#0ea5e9;top:35%;left:40%;width:32vmax;height:32vmax;opacity:.55;animation-delay:-14s}
@keyframes float{to{transform:translate(8vmax,6vmax) scale(1.15)}}
@media(prefers-reduced-motion:reduce){.aurora i{animation:none}}
.top{background:rgba(12,10,29,.35);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top .wrap{height:64px}
.brand{font-weight:900;font-size:20px}
.nav{gap:4px}.nav a{padding:8px 14px;border-radius:999px;color:var(--muted);font-weight:700;font-size:15px}.nav a:hover{background:var(--surface);color:var(--ink)}
.cart-btn{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:30;background:rgba(255,255,255,.94);color:#15122b;border:0;border-radius:999px;padding:14px 24px;font-weight:800;box-shadow:0 12px 40px rgba(0,0,0,.45),0 0 0 6px rgba(255,255,255,.08);transition:transform .2s}
.cart-btn:hover{transform:translateX(-50%) translateY(-2px)}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:13px}
.hero{padding:88px 0 40px;text-align:center}
.pill{display:inline-block;padding:8px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(10px);font-size:14px;font-weight:700;color:var(--muted)}
.hero h1{font-size:clamp(44px,9vw,104px);margin:22px auto 0;max-width:12ch;background:linear-gradient(120deg,#fff 30%,color-mix(in srgb,var(--accent) 55%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent;overflow-wrap:anywhere}
.hero p{color:var(--muted);font-size:19px;max-width:50ch;margin:20px auto 32px}
.hero-actions{justify-content:center}
.btn{border-radius:999px;padding:15px 30px;font-weight:800;box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 50%,transparent)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none;backdrop-filter:blur(10px)}
.steps{list-style:none;padding:0;margin:60px auto 0;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:920px;text-align:left;counter-reset:st}
.steps li{counter-increment:st;background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(14px);border-radius:24px;padding:20px;font-size:15px;color:var(--muted)}
.steps li::before{content:counter(st);display:flex;width:36px;height:36px;border-radius:12px;align-items:center;justify-content:center;background:var(--accent);color:var(--accent-ink);font-weight:900;margin-bottom:12px}
.steps b{display:block;color:var(--ink);font-size:17px}
section{padding:72px 0}
.section-title{font-size:clamp(32px,5vw,52px);text-align:center;margin-bottom:10px}
.section-sub{color:var(--muted);text-align:center;max-width:56ch;margin:0 auto 32px}
.chips{justify-content:center;gap:8px;margin-bottom:26px}
.chip{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:9px 18px;font-weight:700;backdrop-filter:blur(10px)}
.chip.on{background:#fff;color:#15122b}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(16px);border-radius:26px;padding:24px;gap:10px;transition:.25s}
.card:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--accent) 60%,transparent);box-shadow:0 20px 50px -20px var(--accent)}
.card h3{font-size:20px;font-weight:800}
.card p{color:var(--muted);font-size:15px}
.price{font-size:24px;font-weight:900}
.price small{font-size:13px;font-weight:600;color:var(--muted)}
.qty{background:rgba(255,255,255,.1);border-radius:999px}
.add{background:#fff;color:#15122b;border:0;border-radius:999px;padding:10px 18px;font-weight:800}
.add:hover{background:var(--accent);color:var(--accent-ink)}
.works{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:16px}
.work{aspect-ratio:1;border-radius:26px;border:1px solid var(--line);background:linear-gradient(140deg,color-mix(in srgb,var(--accent) 70%,transparent),rgba(109,40,217,.5))}
.work span{margin:14px;padding:6px 14px;border-radius:999px;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);font-size:14px;font-weight:700}
.about{text-align:center}
.about p{font-size:20px;max-width:52ch;margin:0 auto 14px;color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:32px}
.fact{background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(14px);border-radius:24px;padding:20px 28px;min-width:min(180px,100%)}
.fact b{font-size:34px;font-weight:900}
.fact span{color:var(--muted);font-size:14px}
.contacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:14px}
.contact{background:var(--surface);border:1px solid var(--line);backdrop-filter:blur(14px);border-radius:22px;padding:20px}
a.contact:hover{border-color:var(--accent)}
.contact small{color:var(--muted);font-size:13px;font-weight:700;margin-bottom:4px}
.contact strong{font-size:18px;font-weight:800}
footer{padding:20px 0 40px;text-align:center;color:var(--muted);font-size:14px}
.overlay{background:rgba(5,4,15,.6);backdrop-filter:blur(4px)}
.drawer{background:#16132e;border-left:1px solid var(--line)}
.field input,.field textarea{background:rgba(255,255,255,.06)}
textarea.out{background:rgba(255,255,255,.06)!important}
.toast{background:#fff;color:#15122b;bottom:90px}
@media(max-width:700px){.steps{grid-template-columns:1fr}}
@media(max-width:640px){.drawer{border-radius:28px 28px 0 0;border-left:0}}
</style>
</head>
<body>
<noscript>Для работы сайта нужен JavaScript.</noscript>

<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="top"><div class="wrap">
  <a class="brand" id="brandTop" href="#top"></a>
  <nav class="nav" id="nav"></nav>
</div></header>
<button class="cart-btn" id="cartBtn" aria-label="Открыть корзину"><span>Корзина</span><span class="badge" id="badge" hidden>0</span></button>
<main id="top">
  <section class="hero"><div class="wrap">
    <span class="pill">Заявка за 1 минуту · ответим в мессенджере</span>
    <h1 id="heroTitle"></h1>
    <p id="heroText"></p>
    <div class="hero-actions"><a class="btn" id="chooseBtn" href="#services"></a><a class="btn ghost" href="#contacts">Контакты</a></div>
    <ol class="steps">
      <li><span><b>Выберите</b>Добавьте нужное в корзину</span></li>
      <li><span><b>Нажмите «Заказать»</b>Получите готовый текст заявки</span></li>
      <li><span><b>Отправьте</b>Вставьте текст в мессенджер — мы ответим</span></li>
    </ol>
  </div></section>
  <section id="services"><div class="wrap"><h2 class="section-title" id="servicesTitle"></h2><p class="section-sub" id="servicesSub"></p><div class="chips" id="chips"></div><div class="grid" id="grid"></div></div></section>
  <section id="works"><div class="wrap"><h2 class="section-title">Примеры работ</h2><p class="section-sub" id="worksSub"></p><div class="works" id="worksGrid"></div></div></section>
  <section id="about" class="about"><div class="wrap"><h2 class="section-title">О нас</h2><div id="aboutText"></div><div class="facts" id="facts"></div></div></section>
  <section id="contacts"><div class="wrap"><h2 class="section-title">Контакты</h2><p class="section-sub">Свяжитесь с нами удобным способом.</p><div class="contacts" id="contactsGrid"></div></div></section>
</main>
<footer><div class="wrap" id="foot"></div></footer>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Корзина"></aside>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   НАСТРОЙКИ КЛИЕНТА — меняйте только этот блок
   ===================================================================== */
const CONFIG = (function () { var d = /*CONFIG*/{"brand": "Brilliant room", "tagline": "Студия красоты в Иркутске", "description": "Маникюр, брови и ресницы в сияющей студии. Соберите процедуры — отправьте заявку.", "accent": "#b388ff", "currency": "₽", "phone": "+7 924 633-42-34", "email": "", "address": "г. Иркутск, Лапина, 43в", "hours": "По предварительной записи", "messengers": {"telegram": "+79246334234", "whatsapp": "", "vk": "brilliant_room_irk1"}, "services": [{"id": "s1", "category": "Ногти", "name": "Маникюр с покрытием", "desc": "", "price": 1800, "unit": ""}, {"id": "s2", "category": "Ногти", "name": "Педикюр с покрытием", "desc": "", "price": 2300, "unit": ""}, {"id": "s3", "category": "Брови", "name": "Архитектура бровей", "desc": "", "price": 1200, "unit": ""}, {"id": "s4", "category": "Ресницы", "name": "Наращивание 2D", "desc": "", "price": 2300, "unit": ""}, {"id": "s5", "category": "Ресницы", "name": "Ламинирование", "desc": "", "price": 1800, "unit": ""}], "worksSubtitle": "Примеры наших работ.", "works": [], "about": ["Маникюр, брови и ресницы в сияющей студии. Соберите процедуры — отправьте заявку."], "facts": [{"value": "Иркутск", "label": "Лапина, 43в"}, {"value": "Онлайн-заявка", "label": "в Telegram и в ВК"}], "order": {"greeting": "Здравствуйте! Хочу записаться:", "closing": "Подскажите, пожалуйста, свободное время. Спасибо!"}, "ui": {"nav": "Услуги", "servicesTitle": "Услуги и цены", "servicesSub": "Выберите процедуры, нажмите «Заказать» — вы получите готовый текст для записи. Окончательную стоимость мастер уточнит на месте.", "chooseBtn": "Выбрать процедуры", "whenLabel": "Удобные дата и время (по желанию)", "whenText": "Удобные дата и время"}, "demo": true, "booking": {"step": 60, "open": "10:00", "close": "20:00", "days": [1, 2, 3, 4, 5, 6], "status": false}, "faq": []}/*/CONFIG*/; try { if (/[?&]preview/.test(location.search)) { var p = localStorage.getItem("draft:" + location.pathname.replace(/[^/]*$/, "")); if (p) return JSON.parse(p); } } catch (e) {} return d; })();

/* =====================================================================
   КОД САЙТА — ниже ничего менять не нужно
   ===================================================================== */
(function () {
  const C = CONFIG;
  const U = Object.assign({ nav: "Услуги", servicesTitle: "Услуги и цены", servicesSub: "", chooseBtn: "Выбрать услуги",
    whenLabel: "Желаемая дата и время (по желанию)", whenText: "Желаемая дата и время" }, C.ui);
  const $ = (s) => document.querySelector(s);
  const money = (n) => new Intl.NumberFormat("ru-RU").format(n) + "\u00A0" + C.currency;

  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (v == null || v === false) return;
      if (k === "class") e.className = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    });
    kids.flat().forEach((c) => {
      if (c == null || c === false) return;
      e.append(c.nodeType ? c : document.createTextNode(c));
    });
    return e;
  }

  /* ---------- состояние ---------- */
  const KEY = "order:" + C.brand;
  let cart = {};                      // id -> количество
  let form = { name: "", when: "", comment: "" };
  let category = "Все";
  let view = "cart";                  // "cart" | "order"

  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || "{}");
    if (saved.cart) cart = saved.cart;
    if (saved.form) form = Object.assign(form, saved.form);
  } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ cart, form })); } catch (e) {} };

  const byId = (id) => C.services.find((s) => s.id === id);
  // убираем из корзины услуги, которых больше нет в списке
  Object.keys(cart).forEach((id) => { if (!byId(id)) delete cart[id]; });

  const items = () => Object.keys(cart).map((id) => ({ s: byId(id), q: cart[id] })).filter((x) => x.s && x.q > 0);
  const count = () => items().reduce((a, x) => a + x.q, 0);
  const total = () => items().reduce((a, x) => a + (x.s.price ? x.s.price * x.q : 0), 0);
  const hasOnRequest = () => items().some((x) => !x.s.price);

  function setQty(id, q) {
    if (q <= 0) delete cart[id]; else cart[id] = Math.min(q, 99);
    save(); renderServices(); renderBadge();
    if ($("#drawer").classList.contains("open")) renderDrawer();
  }

  /* ---------- шапка, текст, цвет ---------- */
  document.documentElement.style.setProperty("--accent", C.accent);
  document.title = C.brand;
  const md = document.querySelector('meta[name="description"]');
  if (md) md.setAttribute("content", C.tagline + ". " + C.description);
  $("#brandTop").textContent = C.brand;
  $("#heroTitle").textContent = C.brand;
  $("#heroText").textContent = C.tagline + (C.description ? ". " + C.description : "");
  $("#servicesTitle").textContent = U.servicesTitle;
  if (U.servicesSub) $("#servicesSub").textContent = U.servicesSub;
  $("#chooseBtn").textContent = U.chooseBtn;
  $("#worksSub").textContent = C.worksSubtitle || "";

  const nav = $("#nav");
  [["#services", U.nav], ["#works", "Работы"], ["#about", "О нас"], ["#contacts", "Контакты"]]
    .forEach(([href, t]) => nav.append(h("a", { href }, t)));

  /* ---------- услуги ---------- */
  function renderChips() {
    const cats = ["Все"].concat([...new Set(C.services.map((s) => s.category).filter(Boolean))]);
    const box = $("#chips"); box.innerHTML = "";
    if (cats.length <= 2) return;     // одна категория — фильтр не нужен
    cats.forEach((c) => box.append(
      h("button", { class: "chip" + (c === category ? " on" : ""), onclick: () => { category = c; renderChips(); renderServices(); } }, c)
    ));
  }

  function renderServices() {
    const grid = $("#grid"); grid.innerHTML = "";
    C.services.filter((s) => category === "Все" || s.category === category).forEach((s) => {
      const q = cart[s.id] || 0;
      const control = q > 0
        ? h("div", { class: "qty" },
            h("button", { "aria-label": "Меньше", onclick: () => setQty(s.id, q - 1) }, "−"),
            h("span", {}, String(q)),
            h("button", { "aria-label": "Больше", onclick: () => setQty(s.id, q + 1) }, "+"))
        : h("button", { class: "add", onclick: () => setQty(s.id, 1) }, "В корзину");
      grid.append(h("article", { class: "card" },
        h("h3", {}, s.name),
        s.desc ? h("p", {}, s.desc) : null,
        h("div", { class: "row" },
          h("div", { class: "price" }, s.price ? money(s.price) : "По договорённости",
            s.price && s.unit ? h("small", {}, " " + s.unit) : null),
          control)));
    });
  }

  /* ---------- работы, о нас, контакты ---------- */
  function renderStatic() {
    const wg = $("#worksGrid");
    if (!C.works || !C.works.length) $("#works").hidden = true;
    (C.works || []).forEach((w) => wg.append(h("div", { class: "work" },
      w.image ? h("img", { src: w.image, alt: w.title || "", loading: "lazy" }) : null,
      w.title ? h("span", {}, w.title) : null)));

    const at = $("#aboutText");
    (C.about || []).forEach((p) => at.append(h("p", {}, p)));
    (C.facts || []).forEach((f) => $("#facts").append(h("div", { class: "fact" }, h("b", {}, f.value), h("span", {}, f.label))));
    if (!(C.about || []).length && !(C.facts || []).length) $("#about").hidden = true;

    const cg = $("#contactsGrid");
    const m = C.messengers || {};
    const add = (label, text, href) => text && cg.append(h(href ? "a" : "div", { class: "contact", href, target: href && href.startsWith("http") ? "_blank" : null, rel: "noopener" }, h("small", {}, label), h("strong", {}, text)));
    add("Телефон", C.phone, C.phone ? "tel:" + C.phone.replace(/[^\d+]/g, "") : null);
    add("Telegram", m.telegram && (/^\+/.test(m.telegram) ? "" : "@") + m.telegram, m.telegram && "https://t.me/" + m.telegram);
    add("WhatsApp", m.whatsapp && "+" + m.whatsapp, m.whatsapp && "https://wa.me/" + m.whatsapp);
    add("ВКонтакте", m.vk && "vk.com/" + m.vk, m.vk && "https://vk.com/" + m.vk);
    add("Email", C.email, C.email ? "mailto:" + C.email : null);
    add("Адрес", C.address, null);
    add("Часы работы", C.hours, null);

    $("#foot").textContent = "© " + new Date().getFullYear() + " " + C.brand;
  }

  /* ---------- корзина ---------- */
  function renderBadge() {
    const n = count(), b = $("#badge");
    b.textContent = n; b.hidden = n === 0;
  }

  function orderText() {
    const lines = [C.order.greeting, ""];
    items().forEach((x, i) => {
      const sum = x.s.price ? " — " + money(x.s.price * x.q) : " — по договорённости";
      lines.push((i + 1) + ". " + x.s.name + " × " + x.q + sum);
    });
    lines.push("");
    if (total() > 0) lines.push("Итого: " + money(total()) + (hasOnRequest() ? " (+ позиции по договорённости)" : ""));
    if (form.name.trim()) lines.push("Имя: " + form.name.trim());
    if (form.when.trim()) lines.push(U.whenText + ": " + form.when.trim());
    if (form.comment.trim()) lines.push("Комментарий: " + form.comment.trim());
    if (C.order.closing) { lines.push(""); lines.push(C.order.closing); }
    return lines.join("\n");
  }

  const drawer = $("#drawer"), overlay = $("#overlay");
  function openDrawer(v) { view = v || "cart"; renderDrawer(); drawer.classList.add("open"); overlay.classList.add("open"); document.body.classList.add("locked"); }
  function closeDrawer() { drawer.classList.remove("open"); overlay.classList.remove("open"); document.body.classList.remove("locked"); }

  function field(label, key, multiline) {
    const el = multiline ? h("textarea", { rows: 2 }) : h("input", { type: "text" });
    el.value = form[key];
    el.addEventListener("input", () => { form[key] = el.value; save(); });
    return h("label", { class: "field" }, label, el);
  }

  function renderDrawer() {
    drawer.innerHTML = "";
    const head = h("div", { class: "d-head" },
      h("h2", {}, view === "cart" ? "Корзина" : "Ваша заявка"),
      h("button", { class: "x", "aria-label": "Закрыть", onclick: closeDrawer }, "×"));
    const body = h("div", { class: "d-body" });
    const foot = h("div", { class: "d-foot" });

    if (view === "cart") {
      const list = items();
      if (!list.length) {
        body.append(h("div", { class: "empty" }, "Пока пусто. Добавьте услуги из списка."));
        foot.append(h("button", { class: "btn", onclick: () => { closeDrawer(); location.hash = "#services"; } }, "К услугам"));
      } else {
        list.forEach((x) => body.append(h("div", { class: "line" },
          h("div", {}, h("div", { class: "nm" }, x.s.name),
            h("div", { class: "sm" }, x.s.price ? money(x.s.price) + " × " + x.q + " = " + money(x.s.price * x.q) : "По договорённости")),
          h("div", { class: "qty" },
            h("button", { "aria-label": "Меньше", onclick: () => setQty(x.s.id, x.q - 1) }, "−"),
            h("span", {}, String(x.q)),
            h("button", { "aria-label": "Больше", onclick: () => setQty(x.s.id, x.q + 1) }, "+")))));
        body.append(field("Ваше имя (по желанию)", "name"),
                    field(U.whenLabel, "when"),
                    field("Комментарий (по желанию)", "comment", true));
        if (total() > 0) foot.append(h("div", { class: "total" }, h("span", {}, "Итого"), h("span", {}, money(total()))));
        foot.append(h("button", { class: "btn", onclick: () => { view = "order"; renderDrawer(); } }, "Заказать"));
      }
    } else {
      const text = orderText();
      const ta = h("textarea", { class: "field out", readonly: true });
      ta.className = "out"; ta.value = text;
      ta.style.cssText = "width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px";
      ta.addEventListener("focus", () => ta.select());
      body.append(
        h("p", { class: "hint" }, "1. Скопируйте текст заявки.  2. Откройте мессенджер и вставьте его в чат."),
        ta,
        h("button", { class: "btn", style: "width:100%;margin-top:12px", onclick: () => copy(text, ta) }, "Скопировать текст"),
        h("div", { class: "msgrs" }, messengerLinks(text, ta)));
      foot.append(h("button", { class: "btn ghost", onclick: () => { view = "cart"; renderDrawer(); } }, "← Изменить заявку"));
    }
    drawer.append(head, body, foot);
  }

  function messengerLinks(text, ta) {
    const m = C.messengers || {}, out = [];
    const link = (cls, label, href, extra) => out.push(
      h("a", Object.assign({ class: cls, href, target: href.startsWith("http") ? "_blank" : null, rel: "noopener", onclick: () => copy(text, ta, true) }, extra || {}), label));
    if (m.telegram) link("m-tg", "Telegram", "https://t.me/" + m.telegram);
    if (m.whatsapp) link("m-wa", "WhatsApp", "https://wa.me/" + m.whatsapp + "?text=" + encodeURIComponent(text));
    if (m.vk) link("m-vk", "ВКонтакте", "https://vk.me/" + m.vk);
    if (C.phone) link("m-tel", "Позвонить", "tel:" + C.phone.replace(/[^\d+]/g, ""));
    return out;
  }

  /* ---------- копирование ---------- */
  let toastTimer;
  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
  }
  function copy(text, ta, silentFail) {
    const done = () => toast("Текст скопирован — вставьте его в чат");
    const fallback = () => {
      try { ta.focus(); ta.select(); ta.setSelectionRange(0, 99999); if (document.execCommand("copy")) return done(); } catch (e) {}
      if (!silentFail) toast("Не удалось скопировать — выделите текст вручную");
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  }

  /* ---------- события ---------- */
  $("#cartBtn").addEventListener("click", () => openDrawer("cart"));
  overlay.addEventListener("click", closeDrawer);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

  renderChips(); renderServices(); renderStatic(); renderBadge();
})();
</script>

<script>
(function () { if (!CONFIG.demo && !/[?&]preview/.test(location.search)) return;
  var p = /[?&]preview/.test(location.search);
  var b = document.createElement("div");
  b.style.cssText = "position:relative;z-index:99;background:#111;color:#fff;font:14px/1.4 system-ui,sans-serif;padding:9px 16px;text-align:center";
  b.innerHTML = p ? "Предпросмотр ваших изменений — видно только на этом устройстве · <a href='admin/' style='color:#ffd54a'>вернуться в кабинет</a>"
                  : "Демо-версия сайта · цены примерные · <a href='admin/' style='color:#ffd54a'>✎ войти в кабинет и изменить</a>";
  document.body.prepend(b); })();
</script>
</body>
</html>
