<!doctype html>
<html lang="ru">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кафе «Уют»</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Neucha&display=swap">
<style>
/* Тематический (средний) · Кафе · «Меловая доска»: меню мелом на грифельной доске в деревянной раме,
   «блюдо дня» обведено, заказ — записка официанту. */
:root{--accent:#c2410c;--board:#1f2a24;--board2:#26332c;--chalk:#f2f0e6;--dim:#b9c0b4;--wood:#7a4f2c;--wood2:#5e3a1f;--paper:#fffdf5;--ink:#2a2a24;
  --d:"Amatic SC","Comic Sans MS",cursive;--b:"Neucha","Segoe Print",cursive}
*{box-sizing:border-box}
a{color:inherit}
body{margin:0;background:var(--wood2);color:var(--chalk);font:20px/1.45 var(--b);padding:14px;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 3px,transparent 3px 22px),linear-gradient(var(--wood),var(--wood2))}
.board{max-width:1100px;margin:0 auto;background:var(--board);border-radius:10px;box-shadow:inset 0 0 0 10px var(--wood),inset 0 0 0 14px #3a2412,inset 0 0 80px rgba(0,0,0,.6),0 30px 60px rgba(0,0,0,.4);padding:44px clamp(22px,5vw,64px) 50px;position:relative;
  background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.5px),radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.06),transparent 50%),radial-gradient(ellipse at 80% 70%,rgba(255,255,255,.04),transparent 40%);background-size:4px 4px,100% 100%,100% 100%}
h1,h2,h3{font-family:var(--d);font-weight:700;margin:0;line-height:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
@media(max-width:480px){.nb{font-size:21px;padding:3px 12px}body{padding:8px}}
.st{font-size:18px;color:var(--dim)}
.nb{background:none;border:2px solid var(--chalk);border-radius:40% 45% 40% 50%;color:var(--chalk);font:700 26px var(--d);padding:4px 18px;cursor:pointer;white-space:nowrap}
.nb b{color:#ffd28a}
.nb:focus-visible,.it button:focus-visible{outline:2px dashed #ffd28a;outline-offset:4px}
.hero{text-align:center;padding:24px 0 10px}
.hero h1{font-size:clamp(64px,13vw,150px);letter-spacing:.02em;text-shadow:0 0 1px #fff,0 0 8px rgba(255,255,255,.25);overflow-wrap:anywhere}
.hero p{max-width:40ch;margin:6px auto 0;color:var(--dim)}
.sq{display:block;width:220px;height:16px;margin:14px auto 0;background:none}
.sq path{fill:none;stroke:var(--chalk);stroke-width:3;stroke-linecap:round;opacity:.8}
.special{margin:34px auto;max-width:560px;text-align:center;position:relative;padding:26px 30px}
.special svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.special svg ellipse{fill:none;stroke:#ffd28a;stroke-width:3;stroke-dasharray:6 4;opacity:.9}
.special small{font:700 26px var(--d);color:#ffd28a;letter-spacing:.06em}
.special h2{font-size:clamp(40px,6vw,58px);margin:4px 0}
.special .pr{font-size:28px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px 56px;margin-top:20px}
@media(max-width:760px){.cols{grid-template-columns:1fr}}
.cat h3{font-size:46px;border-bottom:2px dashed rgba(242,240,230,.5);padding-bottom:4px;margin:24px 0 10px}
.it{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;align-items:baseline;padding:8px 0}
.it .n{display:flex;gap:8px;min-width:0}
.it .n span:first-child{font-size:23px}
.it .n i{flex:1;border-bottom:2px dotted rgba(242,240,230,.4);transform:translateY(-6px);min-width:16px}
.it .p{font-size:23px;white-space:nowrap}
.it small{grid-column:1/-1;color:var(--dim);font-size:16px;margin-top:-6px}
.it button{width:34px;height:34px;border-radius:50%;border:2px solid var(--chalk);background:none;color:var(--chalk);font:700 20px var(--b);cursor:pointer;line-height:1}
.it.on .n span:first-child{text-decoration:underline wavy #ffd28a 2px;text-underline-offset:6px}
.it.on button{background:var(--chalk);color:var(--board)}
.foot{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:40px;border-top:2px dashed rgba(242,240,230,.4);padding-top:24px}
.foot h3{font-size:40px;margin-bottom:6px}
.foot p{margin:0 0 6px;color:var(--dim)}
.foot a{text-decoration:none;border-bottom:1px dashed var(--dim)}
@media(max-width:760px){.foot{grid-template-columns:1fr}}
.rv{color:var(--dim);font-size:18px;margin:6px 0}
.note{position:fixed;right:16px;bottom:16px;width:min(380px,calc(100% - 32px));max-height:calc(100vh - 32px);overflow:auto;background:var(--paper);color:var(--ink);padding:22px 20px 18px;z-index:40;box-shadow:4px 12px 30px rgba(0,0,0,.45);transform:translateY(120%) rotate(3deg);transition:transform .35s;visibility:hidden;font-size:18px;
  background-image:repeating-linear-gradient(transparent 0 29px,rgba(90,130,200,.25) 29px 30px);background-position:0 54px}
.note.open{transform:rotate(-1.5deg);visibility:visible}
.note h2{font:700 40px var(--d);color:var(--accent)}
.note .x{position:absolute;right:12px;top:8px;background:none;border:0;font:700 30px var(--d);cursor:pointer;color:var(--ink)}
.note::before{content:"";position:absolute;top:-10px;left:50%;width:80px;height:24px;background:rgba(255,240,180,.8);transform:translateX(-50%) rotate(2deg)}
.op-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.op-nm{font-size:19px}.op-nm small{display:block;font-size:15px;color:#777}
.op-qty{display:flex;align-items:center;gap:4px}.op-qty button{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink);background:none;cursor:pointer;font-family:var(--b)}.op-qty span{min-width:18px;text-align:center}
.op-empty{color:#777}
.op-field{display:block;margin-top:8px;font-size:16px;color:#777}
.op-field input{display:block;width:100%;background:transparent;border:0;border-bottom:1.5px solid var(--ink);font:19px var(--b);color:var(--ink);padding:4px 0}
.op-field input:focus{outline:0;border-color:var(--accent)}
.op-total{display:flex;justify-content:space-between;font:700 34px var(--d);margin-top:10px}
.op-text{width:100%;min-height:130px;margin-top:8px;background:rgba(255,255,255,.7);border:1.5px dashed #999;font:15px/1.5 var(--b);padding:8px;color:var(--ink);resize:vertical}
.op-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.op-links a,.op-links button{font:700 22px var(--d);padding:2px 14px;border:2px solid var(--ink);border-radius:20px 24px 18px 26px;text-decoration:none;background:none;color:var(--ink);cursor:pointer}
.op-copy{background:var(--accent)!important;border-color:var(--accent)!important;color:#fff!important}
</style>
</head>
<body>
<main class="board">
  <div class="top"><span class="st" id="st"></span><button class="nb" id="nb" type="button">Записка официанту · <b id="cnt">0</b></button></div>
  <div class="hero"><h1 id="h1"></h1><svg class="sq" viewBox="0 0 220 16" aria-hidden="true"><path d="M4 10 C40 2 70 14 110 8 S180 4 216 10"/></svg><p id="lead"></p></div>
  <div class="special" id="special"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><ellipse cx="50" cy="50" rx="49" ry="46"/></svg><small>Блюдо дня</small><h2 id="spN"></h2><div class="pr" id="spP"></div></div>
  <div class="cols" id="cols"></div>
  <div class="foot"><div><h3>Где нас найти</h3><p id="addr"></p><p id="hrs"></p><p id="ct"></p></div><div><h3>Гости пишут</h3><div id="rv"></div></div></div>
</main>
<aside class="note" id="note" role="dialog" aria-labelledby="nt"><button class="x" id="nx" type="button" aria-label="Закрыть">×</button><h2 id="nt">Записка официанту</h2><div id="panel"></div></aside>
<script>
const CONFIG = (function () { var d = /*CONFIG*/{}/*/CONFIG*/; try { if (/[?&]preview/.test(location.search)) { var p = localStorage.getItem("draft:" + location.pathname.replace(/[^/]*$/, "")); if (p) return JSON.parse(p); } } catch (e) {} return d; })();
</script>
<script>
/* ===== ЯДРО: корзина, текст заявки, мессенджеры. Менять не нужно. ===== */
const K = (function () {
  const C = CONFIG;
  const money = (n) => new Intl.NumberFormat("ru-RU").format(n) + " " + C.currency;
  const KEY = "k:" + location.pathname + ":" + C.brand;
  const st = { cart: {}, form: {} };
  try { Object.assign(st, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
  const byId = (id) => C.services.find((s) => s.id === id);
  Object.keys(st.cart).forEach((id) => { if (!byId(id)) delete st.cart[id]; });
  const subs = [];
  const emit = () => { save(); subs.forEach((f) => f()); };
  const pad = (n) => String(n).padStart(2, "0");
  const toMin = (t) => { const [a, b] = t.split(":").map(Number); return a * 60 + b; };
  const B = Object.assign({ open: "10:00", close: "20:00", step: 60, days: [0, 1, 2, 3, 4, 5, 6] }, C.booking);

  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (v == null || v === false) return;
      if (k === "class") e.className = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    });
    kids.flat().forEach((c) => { if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c)); });
    return e;
  }

  const st0 = document.createElement("style");
  st0.textContent = "[hidden]{display:none!important}.k-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:#111;color:#fff;padding:11px 18px;border-radius:12px;font:14px/1.4 system-ui,sans-serif;opacity:0;transition:.25s;z-index:999;pointer-events:none;max-width:calc(100% - 32px);text-align:center}.k-toast.show{opacity:1;transform:translate(-50%,0)}";
  document.head.prepend(st0);
  let toastEl, toastT;
  function toast(msg) {
    if (!toastEl) { toastEl = h("div", { class: "k-toast", role: "status" }); document.body.append(toastEl); }
    toastEl.textContent = msg; toastEl.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove("show"), 2400);
  }

  const api = {
    C, h, money, byId, toast, pad,
    qty: (id) => st.cart[id] || 0,
    set(id, q) { if (q <= 0) delete st.cart[id]; else st.cart[id] = Math.min(q, 99); emit(); },
    toggle(id) { api.set(id, api.qty(id) ? 0 : 1); },
    clear() { st.cart = {}; emit(); },
    items: () => Object.keys(st.cart).map((id) => ({ s: byId(id), q: st.cart[id] })).filter((x) => x.s),
    count: () => api.items().reduce((a, x) => a + x.q, 0),
    total: () => api.items().reduce((a, x) => a + (x.s.price || 0) * x.q, 0),
    onRequest: () => api.items().some((x) => !x.s.price),
    on: (f) => subs.push(f),
    field(k, v) { if (v === undefined) return st.form[k] || ""; st.form[k] = v; save(); },
    cats: () => [...new Set(C.services.map((s) => s.category).filter(Boolean))],
    price: (s) => (s.price ? money(s.price) : "по договорённости"),

    /* текст заявки; extra — массив [подпись, значение] */
    text(extra) {
      const L = [C.order.greeting, ""];
      api.items().forEach((x, i) => L.push((i + 1) + ". " + x.s.name + (x.q > 1 ? " × " + x.q : "") + " — " + (x.s.price ? money(x.s.price * x.q) : "по договорённости")));
      if (!api.items().length) L.push("(услуги обсудим)");
      L.push("");
      if (api.total() > 0) L.push("Итого: " + money(api.total()) + (api.onRequest() ? " + позиции по договорённости" : ""));
      (extra || []).forEach(([k, v]) => { if (v && String(v).trim()) L.push(k + ": " + String(v).trim()); });
      if (C.order.closing) L.push("", C.order.closing);
      return L.join("\n");
    },

    /* ссылки на мессенджеры владельца */
    links(text) {
      const m = C.messengers || {}, out = [];
      if (m.telegram) out.push({ k: "tg", label: "Telegram", href: "https://t.me/" + m.telegram });
      if (m.whatsapp) out.push({ k: "wa", label: "WhatsApp", href: "https://wa.me/" + m.whatsapp + (text ? "?text=" + encodeURIComponent(text) : "") });
      if (m.vk) out.push({ k: "vk", label: "ВКонтакте", href: "https://vk.me/" + m.vk });
      if (C.phone) out.push({ k: "tel", label: "Позвонить", href: "tel:" + C.phone.replace(/[^\d+]/g, "") });
      return out;
    },
    tel: () => (C.phone ? "tel:" + C.phone.replace(/[^\d+]/g, "") : null),

    copy(text) {
      const ok = () => toast("Текст скопирован — вставьте его в чат");
      const fb = () => {
        const t = h("textarea", { style: "position:fixed;opacity:0" }); t.value = text; document.body.append(t); t.select();
        let done = false; try { done = document.execCommand("copy"); } catch (e) {}
        t.remove(); done ? ok() : toast("Не получилось скопировать — выделите текст вручную");
      };
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, fb); else fb();
    },


    /* готовый блок заявки: список, поля, итог, текст, мессенджеры. Оформляется классами op-* */
    panel(box, opt) {
      opt = opt || {};
      const UI = C.ui || {};
      const fields = opt.fields || [["fName", "Ваше имя"], ["fWhen", UI.whenLabel || "Когда удобно"], ["fNote", "Комментарий"]];
      const list = h("div", { class: "op-list" }), total = h("div", { class: "op-total" });
      const ta = h("textarea", { class: "op-text", readonly: true, "aria-label": "Текст заявки" });
      const links = h("div", { class: "op-links" });
      const inputs = fields.map(([id, label]) => {
        const i = h("input", { id: "op-" + id }); i.value = api.field(id);
        i.addEventListener("input", () => { api.field(id, i.value); refreshText(); });
        return h("label", { class: "op-field" }, h("span", {}, label), i);
      });
      box.append(list, h("div", { class: "op-fields" }, inputs), total, ta, links);
      const extra = () => fields.map(([id, label]) => [id === "fWhen" ? (UI.whenText || "Когда") : id === "fName" ? "Имя" : label.replace(/ \(.*\)$/, ""), api.field(id)]).concat(opt.extra ? opt.extra() : []);
      function refreshText() {
        const t = api.text(extra()); ta.value = t; links.innerHTML = "";
        links.append(h("button", { type: "button", class: "op-copy", onclick: () => api.copy(t) }, "Скопировать текст"));
        api.links(t).forEach((x) => links.append(h("a", { class: "op-" + x.k, href: x.href, target: x.k === "tel" ? null : "_blank", rel: "noopener", onclick: () => x.k !== "wa" && x.k !== "tel" && api.copy(t) }, x.label)));
      }
      function refresh() {
        list.innerHTML = "";
        if (!api.items().length) list.append(h("p", { class: "op-empty" }, opt.empty || "Пока ничего не выбрано."));
        api.items().forEach((x) => list.append(h("div", { class: "op-row" },
          h("div", { class: "op-nm" }, x.s.name, h("small", {}, x.s.price ? api.money(x.s.price * x.q) : "по договорённости")),
          h("div", { class: "op-qty" },
            h("button", { type: "button", "aria-label": "Меньше", onclick: () => api.set(x.s.id, x.q - 1) }, "−"),
            h("span", {}, String(x.q)),
            h("button", { type: "button", "aria-label": "Больше", onclick: () => api.set(x.s.id, x.q + 1) }, "+")))));
        total.innerHTML = "";
        if (api.total()) total.append(h("span", {}, "Итого"), h("b", {}, api.money(api.total())));
        refreshText();
      }
      api.on(refresh); refresh();
      return { refresh };
    },
    /* график: открыто ли сейчас, ближайшие рабочие дни, свободное время */
    status() {
      if (!B.status) return { open: false, text: "" };
      const d = new Date(), m = d.getHours() * 60 + d.getMinutes();
      const open = B.days.includes(d.getDay()) && m >= toMin(B.open) && m < toMin(B.close);
      return open ? { open: true, text: "Открыто до " + B.close } : { open: false, text: "Сейчас закрыто · откроемся в " + B.open };
    },
    days(n) {
      const out = [], d = new Date(); d.setHours(0, 0, 0, 0);
      for (let i = 0; out.length < n && i < 60; i++) {
        const x = new Date(d); x.setDate(d.getDate() + i);
        if (B.days.includes(x.getDay())) out.push(x);
      }
      return out;
    },
    slots(date) {
      const out = [], now = new Date(), today = date.toDateString() === now.toDateString();
      for (let t = toMin(B.open); t + B.step <= toMin(B.close); t += B.step) {
        if (today && t <= now.getHours() * 60 + now.getMinutes() + 30) continue;
        out.push(pad(Math.floor(t / 60)) + ":" + pad(t % 60));
      }
      return out;
    },
    dayLabel(d) {
      const now = new Date(); now.setHours(0, 0, 0, 0);
      const diff = Math.round((d - now) / 864e5);
      const wd = d.toLocaleDateString("ru-RU", { weekday: "short" });
      return diff === 0 ? "Сегодня" : diff === 1 ? "Завтра" : wd.charAt(0).toUpperCase() + wd.slice(1) + ", " + d.getDate();
    },
    dateText: (d) => d.toLocaleDateString("ru-RU", { day: "numeric", month: "long", weekday: "long" })
  };
  return api;
})();

</script>
<script>
(function () {
  const { C, h } = K, $ = (id) => document.getElementById(id);
  $("h1").textContent = C.brand; $("lead").textContent = C.tagline; $("st").textContent = K.status().text;
  // блюдо дня — меняется по дню недели
  const pool = C.services.filter((s) => s.price), sp = pool[new Date().getDay() % Math.max(1, pool.length)];
  if (sp) { $("spN").textContent = sp.name; $("spP").textContent = K.money(sp.price) + " "; $("spP").append(h("button", { type: "button", class: "nb", style: "font-size:22px;padding:2px 14px;margin-left:8px", onclick: () => K.set(sp.id, K.qty(sp.id) + 1) }, "+ в записку")); } else $("special").hidden = true;
  K.cats().forEach((cat) => {
    const c = h("div", { class: "cat" }, h("h3", {}, cat));
    C.services.filter((s) => s.category === cat).forEach((s) => c.append(h("div", { class: "it", "data-id": s.id },
      h("span", { class: "n" }, h("span", {}, s.name), h("i")), h("span", { class: "p" }, s.price ? K.money(s.price) : "—"),
      h("button", { type: "button", "aria-label": "Добавить " + s.name, onclick: () => K.set(s.id, K.qty(s.id) + 1) }, "+"),
      s.desc || s.unit ? h("small", {}, [s.desc, s.unit].filter(Boolean).join(" · ")) : null)));
    $("cols").append(c);
  });
  K.on(() => { document.querySelectorAll(".it").forEach((r) => r.classList.toggle("on", !!K.qty(r.dataset.id))); $("cnt").textContent = K.count(); if (K.count()) $("note").classList.add("open"); });
  $("addr").textContent = C.address || ""; $("hrs").textContent = C.hours || "";
  K.links("").forEach((x, i) => { if (i) $("ct").append(" · "); $("ct").append(h("a", { href: x.href, target: x.k === "tel" ? null : "_blank", rel: "noopener" }, x.label)); });
  (C.reviews || []).forEach((r) => $("rv").append(h("p", { class: "rv" }, "«" + r.text + "» — " + r.name)));
  K.panel($("panel"), { empty: "Пока пусто. Нажмите «+» у блюд на доске." });
  $("nb").onclick = () => $("note").classList.toggle("open"); $("nx").onclick = () => $("note").classList.remove("open");
  document.addEventListener("keydown", (e) => e.key === "Escape" && $("note").classList.remove("open"));
})();
</script>
<script>
(function () { if (!CONFIG.demo && !/[?&]preview/.test(location.search)) return;
  var p = /[?&]preview/.test(location.search);
  var b = document.createElement("div");
  b.style.cssText = "position:relative;z-index:99;background:#111;color:#fff;font:14px/1.4 system-ui,sans-serif;padding:9px 16px;text-align:center";
  b.innerHTML = p ? "Предпросмотр ваших изменений — видно только на этом устройстве · <a href='admin/' style='color:#ffd54a'>вернуться в кабинет</a>"
                  : "Демо-версия сайта · цены примерные · <a href='admin/' style='color:#ffd54a'>✎ войти в кабинет и изменить</a>";
  document.body.prepend(b); })();
</script>
</body>
</html>
