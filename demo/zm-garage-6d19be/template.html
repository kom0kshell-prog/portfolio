<!doctype html>
<html lang="ru">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>АвтоМастер</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jura:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* Тематический (сложный) · Автосервис · «Приборная панель»: сайт как приборка автомобиля.
   Спидометр показывает сумму заявки, тахометр — число работ, контрольные лампы — статус сервиса,
   услуги включаются тумблерами, заявка — на экране бортового компьютера. */
:root{--accent:#1d4ed8;--bg:#0d0f12;--panel:#16191e;--panel2:#1d2128;--ink:#e8edf2;--muted:#8a94a3;--line:#2a2f37;--lcd:#9dff6a;--amber:#ffb020;--red:#ff4d4d;
  --d:"Jura","Segoe UI",sans-serif;--m:"Roboto Mono",ui-monospace,monospace}
*{box-sizing:border-box}
a{color:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--d);background-image:linear-gradient(45deg,#0f1115 25%,transparent 25%),linear-gradient(-45deg,#0f1115 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#0f1115 75%),linear-gradient(-45deg,transparent 75%,#0f1115 75%);background-size:8px 8px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:.04em}
.top .wrap{display:flex;align-items:center;gap:16px;height:70px}
.brand{font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lamps{display:flex;gap:10px}
.lamp{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);color:#3a414c}
.lamp svg{width:18px;height:18px}
.lamp.on{color:var(--lcd);box-shadow:0 0 12px rgba(157,255,106,.4)}.lamp.warn{color:var(--amber);box-shadow:0 0 12px rgba(255,176,32,.4)}
.dash{background:radial-gradient(ellipse at 50% 0,#232832,var(--panel) 70%);border:1px solid var(--line);border-radius:40px 40px 22px 22px;padding:30px 24px 26px;margin-top:10px;box-shadow:inset 0 2px 0 rgba(255,255,255,.04),0 30px 60px -30px #000}
.gauges{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:16px;align-items:end}
.g{position:relative;text-align:center}
.g svg{width:100%;height:auto;display:block}
.g .val{margin-top:-6px;font:500 clamp(18px,2.6vw,30px) var(--m);color:#fff}
.g .cap{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);margin-top:4px}
.needle{transition:transform 1s cubic-bezier(.3,1.4,.5,1);transform-origin:100px 100px}
.center{text-align:center;padding:10px 0 0}
.center h1{font-size:clamp(28px,4.4vw,52px);text-transform:uppercase}
.center p{color:var(--muted);max-width:56ch;margin:10px auto 18px}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:14px 26px;font:700 15px var(--d);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;cursor:pointer;box-shadow:0 0 24px color-mix(in srgb,var(--accent) 50%,transparent)}
.btn.o{background:transparent;border:1px solid var(--line);box-shadow:none}
.btn:focus-visible,.sw:focus-visible{outline:2px solid var(--lcd);outline-offset:3px}
@media(max-width:760px){.gauges{grid-template-columns:1fr 1fr}.g.big{grid-column:1/-1;order:-1}.lamps{display:none}}
section{padding:60px 0 20px}
.sh{display:flex;align-items:baseline;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.sh h2{font-size:clamp(24px,3.4vw,36px);text-transform:uppercase}
.sh span{color:var(--muted)}
.grp{margin-bottom:26px}
.grp h3{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:10px}
.grp h3::after{content:"";flex:1;height:1px;background:var(--line)}
.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:12px}
.sw{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);color:inherit;cursor:pointer;text-align:left;font:inherit;width:100%}
.sw .led{width:12px;height:12px;border-radius:50%;background:#2c323b;flex-shrink:0;transition:.2s}
.sw[aria-pressed="true"]{border-color:color-mix(in srgb,var(--accent) 70%,var(--line))}
.sw[aria-pressed="true"] .led{background:var(--lcd);box-shadow:0 0 10px var(--lcd)}
.sw .t{flex:1;min-width:0}.sw .t b{display:block;font-size:17px}.sw .t small{color:var(--muted);font-size:13px}
.sw .p{font:500 15px var(--m);white-space:nowrap}
.tog{width:44px;height:24px;border-radius:12px;background:#2c323b;position:relative;flex-shrink:0;transition:.2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#8a94a3;transition:.2s}
.sw[aria-pressed="true"] .tog{background:var(--accent)}.sw[aria-pressed="true"] .tog::after{left:23px;background:#fff}
.odo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:12px}
.od{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:18px}
.od b{display:inline-block;font:500 30px var(--m);background:#050607;color:#fff;padding:2px 10px;border-radius:6px;letter-spacing:.12em;box-shadow:inset 0 0 0 1px #333}
.od span{display:block;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.12em;margin-top:8px}
.about{color:var(--muted);max-width:70ch;margin:0 0 20px}
.bc{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.lcd{background:#0b1407;border:2px solid #1f2a17;border-radius:18px;padding:20px;color:var(--lcd);font-family:var(--m);box-shadow:inset 0 0 30px rgba(157,255,106,.08)}
.lcd h3{font:500 14px var(--m);letter-spacing:.2em;margin-bottom:10px}
.cl{display:grid;gap:8px}
.cl a,.cl div{display:flex;justify-content:space-between;gap:14px;padding:12px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;text-decoration:none;color:inherit}
.cl span{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.1em}
.cl a:hover{border-color:var(--accent)}
@media(max-width:820px){.bc{grid-template-columns:1fr}}
footer{padding:40px 0;color:var(--muted);font-size:13px;text-align:center}
.op-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed #1f3a14}
.op-nm{font-size:14px}.op-nm small{display:block;opacity:.7}
.op-qty{display:flex;align-items:center;gap:4px}.op-qty button{width:26px;height:26px;border:1px solid var(--lcd);background:none;color:var(--lcd);border-radius:6px;cursor:pointer}.op-qty span{min-width:18px;text-align:center}
.op-empty{opacity:.7;font-size:14px}
.op-field{display:block;margin-top:10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.op-field input{display:block;width:100%;margin-top:4px;background:#050b03;border:1px solid #1f3a14;border-radius:8px;color:var(--lcd);font:14px var(--m);padding:9px}
.op-total{display:flex;justify-content:space-between;margin-top:12px;font-size:20px}
.op-text{width:100%;min-height:140px;margin-top:10px;background:#050b03;border:1px solid #1f3a14;border-radius:8px;color:var(--lcd);font:12px/1.5 var(--m);padding:10px;resize:vertical}
.op-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.op-links a,.op-links button{padding:9px 14px;border-radius:8px;border:1px solid var(--lcd);background:none;color:var(--lcd);text-decoration:none;font:500 13px var(--m);cursor:pointer}
.op-copy{background:var(--lcd)!important;color:#050b03!important}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand" id="brand"></div>
  <div class="lamps" aria-label="Контрольные лампы">
    <span class="lamp" id="lOpen" title=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
    <span class="lamp" id="lCheck" title="Проверка двигателя"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 10h3l2-3h6v3h2l2 2v4h-2v2H9l-2-2H4z"/></svg></span>
    <span class="lamp on" title="Тормоза"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="6"/><path d="M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14"/></svg></span>
  </div>
  <a class="btn o" href="#order" style="padding:10px 16px">Заявка</a>
</div></header>
<main class="wrap">
  <div class="dash">
    <div class="gauges">
      <div class="g"><svg viewBox="0 0 200 130" aria-hidden="true" id="g1"></svg><div class="val" id="v1">0</div><div class="cap">Работ в заявке</div></div>
      <div class="g big"><svg viewBox="0 0 200 130" aria-hidden="true" id="g2"></svg><div class="val" id="v2">0 ₽</div><div class="cap">Сумма, ₽</div></div>
      <div class="g"><svg viewBox="0 0 200 130" aria-hidden="true" id="g3"></svg><div class="val" id="v3">—</div><div class="cap" id="c3">До закрытия</div></div>
    </div>
    <div class="center"><h1 id="h1"></h1><p id="lead"></p><a class="btn" href="#services">Выбрать работы ↓</a></div>
  </div>
  <section id="services"><div class="sh"><h2 id="sTitle"></h2><span>Включите нужные работы — стрелки на приборах покажут сумму.</span></div><div id="groups"></div></section>
  <section><div class="sh"><h2>Пробег</h2></div><p class="about" id="about"></p><div class="odo" id="odo"></div></section>
  <section id="order"><div class="bc">
    <div class="lcd"><h3>БОРТОВОЙ КОМПЬЮТЕР · ЗАЯВКА</h3><div id="panel"></div></div>
    <div><div class="sh"><h2>Контакты</h2></div><div class="cl" id="cl"></div></div>
  </div></section>
</main>
<footer id="foot"></footer>
<script>
const CONFIG = (function () { var d = /*CONFIG*/{}/*/CONFIG*/; try { if (/[?&]preview/.test(location.search)) { var p = localStorage.getItem("draft:" + location.pathname.replace(/[^/]*$/, "")); if (p) return JSON.parse(p); } } catch (e) {} return d; })();
</script>
<script>
/* ===== ЯДРО: корзина, текст заявки, мессенджеры. Менять не нужно. ===== */
const K = (function () {
  const C = CONFIG;
  const money = (n) => new Intl.NumberFormat("ru-RU").format(n) + " " + C.currency;
  const KEY = "k:" + location.pathname + ":" + C.brand;
  const st = { cart: {}, form: {} };
  try { Object.assign(st, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
  const byId = (id) => C.services.find((s) => s.id === id);
  Object.keys(st.cart).forEach((id) => { if (!byId(id)) delete st.cart[id]; });
  const subs = [];
  const emit = () => { save(); subs.forEach((f) => f()); };
  const pad = (n) => String(n).padStart(2, "0");
  const toMin = (t) => { const [a, b] = t.split(":").map(Number); return a * 60 + b; };
  const B = Object.assign({ open: "10:00", close: "20:00", step: 60, days: [0, 1, 2, 3, 4, 5, 6] }, C.booking);

  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (v == null || v === false) return;
      if (k === "class") e.className = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    });
    kids.flat().forEach((c) => { if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c)); });
    return e;
  }

  const st0 = document.createElement("style");
  st0.textContent = "[hidden]{display:none!important}.k-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:#111;color:#fff;padding:11px 18px;border-radius:12px;font:14px/1.4 system-ui,sans-serif;opacity:0;transition:.25s;z-index:999;pointer-events:none;max-width:calc(100% - 32px);text-align:center}.k-toast.show{opacity:1;transform:translate(-50%,0)}";
  document.head.prepend(st0);
  let toastEl, toastT;
  function toast(msg) {
    if (!toastEl) { toastEl = h("div", { class: "k-toast", role: "status" }); document.body.append(toastEl); }
    toastEl.textContent = msg; toastEl.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove("show"), 2400);
  }

  const api = {
    C, h, money, byId, toast, pad,
    qty: (id) => st.cart[id] || 0,
    set(id, q) { if (q <= 0) delete st.cart[id]; else st.cart[id] = Math.min(q, 99); emit(); },
    toggle(id) { api.set(id, api.qty(id) ? 0 : 1); },
    clear() { st.cart = {}; emit(); },
    items: () => Object.keys(st.cart).map((id) => ({ s: byId(id), q: st.cart[id] })).filter((x) => x.s),
    count: () => api.items().reduce((a, x) => a + x.q, 0),
    total: () => api.items().reduce((a, x) => a + (x.s.price || 0) * x.q, 0),
    onRequest: () => api.items().some((x) => !x.s.price),
    on: (f) => subs.push(f),
    field(k, v) { if (v === undefined) return st.form[k] || ""; st.form[k] = v; save(); },
    cats: () => [...new Set(C.services.map((s) => s.category).filter(Boolean))],
    price: (s) => (s.price ? money(s.price) : "по договорённости"),

    /* текст заявки; extra — массив [подпись, значение] */
    text(extra) {
      const L = [C.order.greeting, ""];
      api.items().forEach((x, i) => L.push((i + 1) + ". " + x.s.name + (x.q > 1 ? " × " + x.q : "") + " — " + (x.s.price ? money(x.s.price * x.q) : "по договорённости")));
      if (!api.items().length) L.push("(услуги обсудим)");
      L.push("");
      if (api.total() > 0) L.push("Итого: " + money(api.total()) + (api.onRequest() ? " + позиции по договорённости" : ""));
      (extra || []).forEach(([k, v]) => { if (v && String(v).trim()) L.push(k + ": " + String(v).trim()); });
      if (C.order.closing) L.push("", C.order.closing);
      return L.join("\n");
    },

    /* ссылки на мессенджеры владельца */
    links(text) {
      const m = C.messengers || {}, out = [];
      if (m.telegram) out.push({ k: "tg", label: "Telegram", href: "https://t.me/" + m.telegram });
      if (m.whatsapp) out.push({ k: "wa", label: "WhatsApp", href: "https://wa.me/" + m.whatsapp + (text ? "?text=" + encodeURIComponent(text) : "") });
      if (m.vk) out.push({ k: "vk", label: "ВКонтакте", href: "https://vk.me/" + m.vk });
      if (C.phone) out.push({ k: "tel", label: "Позвонить", href: "tel:" + C.phone.replace(/[^\d+]/g, "") });
      return out;
    },
    tel: () => (C.phone ? "tel:" + C.phone.replace(/[^\d+]/g, "") : null),

    copy(text) {
      const ok = () => toast("Текст скопирован — вставьте его в чат");
      const fb = () => {
        const t = h("textarea", { style: "position:fixed;opacity:0" }); t.value = text; document.body.append(t); t.select();
        let done = false; try { done = document.execCommand("copy"); } catch (e) {}
        t.remove(); done ? ok() : toast("Не получилось скопировать — выделите текст вручную");
      };
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, fb); else fb();
    },


    /* готовый блок заявки: список, поля, итог, текст, мессенджеры. Оформляется классами op-* */
    panel(box, opt) {
      opt = opt || {};
      const UI = C.ui || {};
      const fields = opt.fields || [["fName", "Ваше имя"], ["fWhen", UI.whenLabel || "Когда удобно"], ["fNote", "Комментарий"]];
      const list = h("div", { class: "op-list" }), total = h("div", { class: "op-total" });
      const ta = h("textarea", { class: "op-text", readonly: true, "aria-label": "Текст заявки" });
      const links = h("div", { class: "op-links" });
      const inputs = fields.map(([id, label]) => {
        const i = h("input", { id: "op-" + id }); i.value = api.field(id);
        i.addEventListener("input", () => { api.field(id, i.value); refreshText(); });
        return h("label", { class: "op-field" }, h("span", {}, label), i);
      });
      box.append(list, h("div", { class: "op-fields" }, inputs), total, ta, links);
      const extra = () => fields.map(([id, label]) => [id === "fWhen" ? (UI.whenText || "Когда") : id === "fName" ? "Имя" : label.replace(/ \(.*\)$/, ""), api.field(id)]).concat(opt.extra ? opt.extra() : []);
      function refreshText() {
        const t = api.text(extra()); ta.value = t; links.innerHTML = "";
        links.append(h("button", { type: "button", class: "op-copy", onclick: () => api.copy(t) }, "Скопировать текст"));
        api.links(t).forEach((x) => links.append(h("a", { class: "op-" + x.k, href: x.href, target: x.k === "tel" ? null : "_blank", rel: "noopener", onclick: () => x.k !== "wa" && x.k !== "tel" && api.copy(t) }, x.label)));
      }
      function refresh() {
        list.innerHTML = "";
        if (!api.items().length) list.append(h("p", { class: "op-empty" }, opt.empty || "Пока ничего не выбрано."));
        api.items().forEach((x) => list.append(h("div", { class: "op-row" },
          h("div", { class: "op-nm" }, x.s.name, h("small", {}, x.s.price ? api.money(x.s.price * x.q) : "по договорённости")),
          h("div", { class: "op-qty" },
            h("button", { type: "button", "aria-label": "Меньше", onclick: () => api.set(x.s.id, x.q - 1) }, "−"),
            h("span", {}, String(x.q)),
            h("button", { type: "button", "aria-label": "Больше", onclick: () => api.set(x.s.id, x.q + 1) }, "+")))));
        total.innerHTML = "";
        if (api.total()) total.append(h("span", {}, "Итого"), h("b", {}, api.money(api.total())));
        refreshText();
      }
      api.on(refresh); refresh();
      return { refresh };
    },
    /* график: открыто ли сейчас, ближайшие рабочие дни, свободное время */
    status() {
      if (!B.status) return { open: false, text: "" };
      const d = new Date(), m = d.getHours() * 60 + d.getMinutes();
      const open = B.days.includes(d.getDay()) && m >= toMin(B.open) && m < toMin(B.close);
      return open ? { open: true, text: "Открыто до " + B.close } : { open: false, text: "Сейчас закрыто · откроемся в " + B.open };
    },
    days(n) {
      const out = [], d = new Date(); d.setHours(0, 0, 0, 0);
      for (let i = 0; out.length < n && i < 60; i++) {
        const x = new Date(d); x.setDate(d.getDate() + i);
        if (B.days.includes(x.getDay())) out.push(x);
      }
      return out;
    },
    slots(date) {
      const out = [], now = new Date(), today = date.toDateString() === now.toDateString();
      for (let t = toMin(B.open); t + B.step <= toMin(B.close); t += B.step) {
        if (today && t <= now.getHours() * 60 + now.getMinutes() + 30) continue;
        out.push(pad(Math.floor(t / 60)) + ":" + pad(t % 60));
      }
      return out;
    },
    dayLabel(d) {
      const now = new Date(); now.setHours(0, 0, 0, 0);
      const diff = Math.round((d - now) / 864e5);
      const wd = d.toLocaleDateString("ru-RU", { weekday: "short" });
      return diff === 0 ? "Сегодня" : diff === 1 ? "Завтра" : wd.charAt(0).toUpperCase() + wd.slice(1) + ", " + d.getDate();
    },
    dateText: (d) => d.toLocaleDateString("ru-RU", { day: "numeric", month: "long", weekday: "long" })
  };
  return api;
})();

</script>
<script>
(function () {
  const { C, h } = K, $ = (id) => document.getElementById(id), U = C.ui || {};
  document.documentElement.style.setProperty("--accent", C.accent);
  $("brand").textContent = C.brand; $("h1").textContent = C.brand; $("lead").textContent = C.tagline + ". " + C.description;
  $("sTitle").textContent = U.servicesTitle || "Услуги";
  const st = K.status(); $("lOpen").classList.add(st.open ? "on" : "warn"); $("lOpen").title = st.text;
  $("lCheck").classList.add("warn");

  // приборы: шкала 0..max, стрелка
  const NS = "http://www.w3.org/2000/svg";
  function gauge(svg, max, ticks, red) {
    let s = '<path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="#2a2f37" stroke-width="10" stroke-linecap="round"/>';
    if (red) s += '<path d="M152 43 A80 80 0 0 1 180 100" fill="none" stroke="#ff4d4d" stroke-width="10" stroke-linecap="round"/>';
    for (let i = 0; i <= ticks; i++) {
      const a = Math.PI - Math.PI * i / ticks, x1 = 100 + 66 * Math.cos(a), y1 = 100 - 66 * Math.sin(a), x2 = 100 + 58 * Math.cos(a), y2 = 100 - 58 * Math.sin(a);
      s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#8a94a3" stroke-width="2"/>`;
      const lx = 100 + 46 * Math.cos(a), ly = 100 - 46 * Math.sin(a) + 4;
      s += `<text x="${lx}" y="${ly}" fill="#8a94a3" font-size="9" text-anchor="middle" font-family="Roboto Mono, monospace">${Math.round(max * i / ticks / (max >= 1000 ? 1000 : 1))}${max >= 1000 ? "k" : ""}</text>`;
    }
    s += '<g class="needle"><line x1="100" y1="100" x2="30" y2="100" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/></g><circle cx="100" cy="100" r="8" fill="#e8edf2"/>';
    svg.innerHTML = s;
    return (v) => { svg.querySelector(".needle").style.transform = "rotate(" + Math.min(180, 180 * v / max) + "deg)"; };
  }
  const maxSum = Math.max(5000, Math.ceil(C.services.reduce((a, s) => a + (s.price || 0), 0) / 5000) * 5000);
  const n1 = gauge($("g1"), Math.max(5, C.services.length), 5, false), n2 = gauge($("g2"), maxSum, 5, true);
  // часы до закрытия
  const B = Object.assign({ open: "10:00", close: "20:00" }, C.booking), now = new Date(), toM = (t) => +t.split(":")[0] * 60 + +t.split(":")[1];
  const left = toM(B.close) - (now.getHours() * 60 + now.getMinutes()), n3 = gauge($("g3"), 12, 6, false);
  if (st.open && left > 0) { n3(left / 60); $("v3").textContent = Math.floor(left / 60) + " ч " + (left % 60) + " м"; }
  else if (!st.text) { n3(0); $("v3").textContent = "по записи"; $("c3").textContent = "Режим"; }
  else { n3(0); $("v3").textContent = B.open; $("c3").textContent = "Откроемся в"; }

  K.cats().forEach((cat) => {
    const g = h("div", { class: "sws" });
    C.services.filter((s) => s.category === cat).forEach((s) => g.append(h("button", { class: "sw", type: "button", "data-id": s.id, "aria-pressed": "false", onclick: () => K.toggle(s.id) },
      h("span", { class: "led", "aria-hidden": "true" }), h("span", { class: "t" }, h("b", {}, s.name), h("small", {}, s.desc || "")), h("span", { class: "p" }, s.price ? K.money(s.price) : "дог."), h("span", { class: "tog", "aria-hidden": "true" }))));
    $("groups").append(h("div", { class: "grp" }, h("h3", {}, cat), g));
  });
  function upd() {
    document.querySelectorAll(".sw").forEach((b) => b.setAttribute("aria-pressed", K.qty(b.dataset.id) ? "true" : "false"));
    n1(K.count()); n2(K.total()); $("v1").textContent = K.count(); $("v2").textContent = K.money(K.total());
  }
  K.on(upd); upd();

  $("about").textContent = (C.about || []).join(" ");
  (C.facts || []).forEach((f) => $("odo").append(h("div", { class: "od" }, h("b", {}, f.value), h("span", {}, f.label))));
  K.panel($("panel"), { empty: "> Работы не выбраны_" });
  const m = C.messengers || {};
  [["Телефон", C.phone, K.tel()], ["Telegram", m.telegram && (/^\+/.test(m.telegram) ? "" : "@") + m.telegram, m.telegram && "https://t.me/" + m.telegram], ["WhatsApp", m.whatsapp && "+" + m.whatsapp, m.whatsapp && "https://wa.me/" + m.whatsapp], ["ВКонтакте", m.vk && "vk.com/" + m.vk, m.vk && "https://vk.com/" + m.vk], ["Адрес", C.address], ["Часы", C.hours]]
    .forEach(([k, v, href]) => v && $("cl").append(h(href ? "a" : "div", { href, target: href && href.startsWith("http") ? "_blank" : null, rel: "noopener" }, h("span", {}, k), v)));
  $("foot").textContent = "© " + new Date().getFullYear() + " " + C.brand;
})();
</script>
