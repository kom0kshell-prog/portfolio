<!doctype html>
<html lang="ru">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annle beauty zone — Маникюр в Казани</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marmelad&family=Mulish:wght@400;600;800&display=swap">
<style>
/* Тематический (средний) · Бьюти · «Палетка»: каждая категория — палетка теней, услуги — рефилы с сиянием.
   Нажатие на «тень» добавляет процедуру в «ваш образ»; пудреница-герой с зеркалом. */
:root{--accent:#b5527a;--bg:#f7ece6;--case:#2a1f24;--case2:#3a2c33;--ink:#2b1d22;--muted:#7d6670;--card:#fffaf7;--line:#ecd9d0;--d:"Marmelad",Georgia,serif;--b:"Mulish",system-ui,sans-serif}
*{box-sizing:border-box}
a{color:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--b)}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:var(--d);font-weight:400;margin:0;line-height:1.1}
.top .wrap{display:flex;align-items:center;gap:16px;height:74px}
.brand{font:400 26px var(--d);margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.look{border:0;background:var(--case);color:#fff;border-radius:999px;padding:11px 18px;font:800 14px var(--b);cursor:pointer;display:flex;gap:8px;align-items:center;white-space:nowrap}
.look b{background:var(--accent);border-radius:999px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:12px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:30px 0 70px}
.hero h1{font-size:clamp(44px,7vw,84px)}
.hero p{font-size:18px;color:var(--muted);max-width:42ch;margin:18px 0 26px}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:15px 26px;font:800 15px var(--b);text-decoration:none;cursor:pointer}
.btn:focus-visible,.pan:focus-visible,.look:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.compact{position:relative;width:min(380px,100%);aspect-ratio:1;margin:0 auto}
.compact .lid{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#f3d9e2 18%,color-mix(in srgb,var(--accent) 40%,#f5dbe3) 60%,color-mix(in srgb,var(--accent) 65%,#7a3a52) 100%);box-shadow:0 30px 50px -20px rgba(90,30,50,.5),inset 0 -8px 20px rgba(0,0,0,.15)}
.compact .mir{position:absolute;inset:12%;border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(255,255,255,.4) 40%,rgba(255,255,255,.75) 60%,rgba(255,255,255,.3));border:6px solid rgba(255,255,255,.7);display:grid;place-items:center;text-align:center;padding:16%}
.compact .mir b{font:400 clamp(22px,3vw,30px) var(--d);color:var(--case)}
.compact .mir small{display:block;color:var(--muted);margin-top:6px}
@media(max-width:820px){.hero{grid-template-columns:1fr}.compact{width:min(300px,100%)}}
section{padding:40px 0}
.sh h2{font-size:clamp(34px,5vw,54px);text-align:center}
.sh p{text-align:center;color:var(--muted);margin:10px auto 34px;max-width:52ch}
.pal{background:var(--case);border-radius:28px;padding:26px 24px 30px;margin-bottom:28px;box-shadow:0 30px 50px -30px rgba(40,10,20,.7),inset 0 1px 0 rgba(255,255,255,.1)}
.pal .ph{display:flex;justify-content:space-between;align-items:baseline;color:#f4dfe6;margin-bottom:18px;gap:10px}
.pal .ph h3{font-size:26px}.pal .ph span{font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.7}
.pans{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,45%),1fr));gap:22px 16px}
.pan{background:none;border:0;padding:0;cursor:pointer;color:#f4dfe6;font:inherit;text-align:center}
.pan .s{display:block;width:min(120px,100%);aspect-ratio:1;margin:0 auto 10px;border-radius:50%;background:var(--c);position:relative;box-shadow:inset 0 0 0 6px var(--case2),inset 0 0 0 8px #000,0 0 0 2px var(--case2);transition:transform .25s}
.pan .s::after{content:"";position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.75),rgba(255,255,255,.15) 30%,transparent 55%);mix-blend-mode:screen}
.pan:hover .s{transform:scale(1.05)}
.pan[aria-pressed="true"] .s{box-shadow:inset 0 0 0 6px var(--case2),inset 0 0 0 8px #000,0 0 0 3px #fff,0 0 22px 4px color-mix(in srgb,var(--c) 70%,#fff)}
.pan[aria-pressed="true"] .s::before{content:"✓";position:absolute;right:2px;top:2px;width:30px;height:30px;border-radius:50%;background:#fff;color:var(--case);display:grid;place-items:center;font-weight:800;z-index:1}
.pan b{display:block;font-weight:600;font-size:15px}
.pan small{color:#c9aab6}
.revs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:16px}
.rev{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px}
.rev p{font:400 19px/1.4 var(--d);margin:8px 0 12px}
.rev .st{color:var(--accent);letter-spacing:2px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px}
.box h3{font-size:26px;margin-bottom:10px}
.cl a,.cl div{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.cl span{color:var(--muted)}
@media(max-width:760px){.info{grid-template-columns:1fr}}
footer{text-align:center;padding:30px 0 50px;color:var(--muted)}
.shade{position:fixed;inset:0;background:rgba(40,15,25,.45);opacity:0;pointer-events:none;transition:.25s;z-index:40}.shade.open{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--card);z-index:41;transform:translateX(100%);transition:transform .3s;overflow:auto;padding:22px;visibility:hidden}
.dr.open{transform:none;visibility:visible}
.dr .t{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dr h2{font-size:32px}
.dr .x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:none;font-size:20px;cursor:pointer}
.op-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.op-nm{flex:1;font-weight:600}.op-nm small{display:block;color:var(--muted);font-weight:400}
.op-qty{display:flex;align-items:center;gap:4px}.op-qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer}.op-qty span{min-width:18px;text-align:center}
.op-empty{color:var(--muted)}
.op-field{display:block;margin-top:12px;font-size:13px;color:var(--muted)}
.op-field input{display:block;width:100%;margin-top:4px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);font:15px var(--b);background:#fff;color:var(--ink)}
.op-total{display:flex;justify-content:space-between;margin-top:14px;font:400 26px var(--d)}
.op-text{width:100%;min-height:150px;margin-top:10px;border-radius:14px;border:1px dashed var(--line);padding:12px;font:14px/1.5 var(--b);resize:vertical;background:#fff;color:var(--ink)}
.op-links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.op-links a,.op-links button{display:flex;justify-content:center;padding:12px;border-radius:999px;font:800 14px var(--b);text-decoration:none;color:#fff;border:0;cursor:pointer}
.op-copy{grid-column:1/-1;background:var(--case)}.op-tg{background:#229ed9}.op-wa{background:#25a244}.op-vk{background:#0077ff}.op-tel{background:var(--accent)}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="brand" id="brand"></div><button class="look" id="lookb" type="button">Мой образ <b id="cnt">0</b></button></div></header>
<main class="wrap">
  <div class="hero"><div><h1 id="h1"></h1><p id="lead"></p><a class="btn" href="#palettes">Открыть палетку ↓</a></div>
    <div class="compact" aria-hidden="true"><div class="lid"></div><div class="mir"><div><b id="mb"></b><small id="ms"></small></div></div></div></div>
  <section id="palettes"><div class="sh"><h2>Соберите свой образ</h2><p>Каждая палетка — направление. Нажмите на оттенок, чтобы добавить процедуру.</p></div><div id="pals"></div></section>
  <section><div class="sh"><h2 id="revH">Отзывы</h2><p id="about"></p></div><div class="revs" id="revs"></div></section>
  <section><div class="info"><div class="box"><h3>Контакты</h3><div class="cl" id="cl"></div></div><div class="box"><h3>Часы работы</h3><p id="hours" style="font:400 22px var(--d);margin:0"></p><p id="addr" style="color:var(--muted)"></p><button class="btn" id="cta2" type="button">Записаться</button></div></div></section>
</main>
<footer id="foot"></footer>
<div class="shade" id="shade"></div>
<aside class="dr" id="dr" role="dialog" aria-modal="true" aria-labelledby="dt"><div class="t"><h2 id="dt">Мой образ</h2><button class="x" id="dx" type="button" aria-label="Закрыть">×</button></div><div id="panel"></div></aside>
<script>
const CONFIG = (function () { var d = /*CONFIG*/{"brand": "Annle beauty zone", "tagline": "Маникюр в Казани", "description": "Аккуратный маникюр и педикюр. Выберите «оттенки» — и отправьте заявку на запись.", "accent": "#d6457a", "currency": "₽", "phone": "+7 953 490-14-54", "email": "", "address": "г. Казань, ул. Дементьева, 26а, оф. 305", "hours": "По предварительной записи", "messengers": {"telegram": "+79534901454", "whatsapp": "", "vk": "id828420056"}, "services": [{"id": "s1", "category": "Маникюр", "name": "Маникюр без покрытия", "desc": "", "price": 800, "unit": ""}, {"id": "s2", "category": "Маникюр", "name": "Маникюр с гель-лаком", "desc": "", "price": 1800, "unit": ""}, {"id": "s3", "category": "Маникюр", "name": "Наращивание", "desc": "", "price": 2800, "unit": "от"}, {"id": "s4", "category": "Маникюр", "name": "Дизайн", "desc": "За ноготь.", "price": 50, "unit": "от"}, {"id": "s5", "category": "Педикюр", "name": "Педикюр с покрытием", "desc": "", "price": 2200, "unit": ""}, {"id": "s6", "category": "Педикюр", "name": "Смарт-педикюр", "desc": "", "price": 1800, "unit": ""}], "worksSubtitle": "Примеры наших работ.", "works": [], "about": ["Аккуратный маникюр и педикюр. Выберите «оттенки» — и отправьте заявку на запись."], "facts": [{"value": "Казань", "label": "ул. Дементьева, 26а, оф. 305"}, {"value": "Онлайн-заявка", "label": "в Telegram и в ВК"}], "order": {"greeting": "Здравствуйте! Хочу записаться:", "closing": "Подскажите, пожалуйста, свободное время. Спасибо!"}, "ui": {"nav": "Услуги", "servicesTitle": "Услуги и цены", "servicesSub": "Выберите процедуры, нажмите «Заказать» — вы получите готовый текст для записи. Окончательную стоимость мастер уточнит на месте.", "chooseBtn": "Выбрать процедуры", "whenLabel": "Удобные дата и время (по желанию)", "whenText": "Удобные дата и время"}, "faq": [], "booking": {"open": "10:00", "close": "20:00", "step": 60, "days": [1, 2, 3, 4, 5, 6], "status": false}, "demo": true}/*/CONFIG*/; try { if (/[?&]preview/.test(location.search)) { var p = localStorage.getItem("draft:" + location.pathname.replace(/[^/]*$/, "")); if (p) return JSON.parse(p); } } catch (e) {} return d; })();
</script>
<script>
/* ===== ЯДРО: корзина, текст заявки, мессенджеры. Менять не нужно. ===== */
const K = (function () {
  const C = CONFIG;
  const money = (n) => new Intl.NumberFormat("ru-RU").format(n) + " " + C.currency;
  const KEY = "k:" + location.pathname + ":" + C.brand;
  const st = { cart: {}, form: {} };
  try { Object.assign(st, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
  const byId = (id) => C.services.find((s) => s.id === id);
  Object.keys(st.cart).forEach((id) => { if (!byId(id)) delete st.cart[id]; });
  const subs = [];
  const emit = () => { save(); subs.forEach((f) => f()); };
  const pad = (n) => String(n).padStart(2, "0");
  const toMin = (t) => { const [a, b] = t.split(":").map(Number); return a * 60 + b; };
  const B = Object.assign({ open: "10:00", close: "20:00", step: 60, days: [0, 1, 2, 3, 4, 5, 6] }, C.booking);

  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (v == null || v === false) return;
      if (k === "class") e.className = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? "" : v);
    });
    kids.flat().forEach((c) => { if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c)); });
    return e;
  }

  const st0 = document.createElement("style");
  st0.textContent = "[hidden]{display:none!important}.k-toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:#111;color:#fff;padding:11px 18px;border-radius:12px;font:14px/1.4 system-ui,sans-serif;opacity:0;transition:.25s;z-index:999;pointer-events:none;max-width:calc(100% - 32px);text-align:center}.k-toast.show{opacity:1;transform:translate(-50%,0)}";
  document.head.prepend(st0);
  let toastEl, toastT;
  function toast(msg) {
    if (!toastEl) { toastEl = h("div", { class: "k-toast", role: "status" }); document.body.append(toastEl); }
    toastEl.textContent = msg; toastEl.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove("show"), 2400);
  }

  const api = {
    C, h, money, byId, toast, pad,
    qty: (id) => st.cart[id] || 0,
    set(id, q) { if (q <= 0) delete st.cart[id]; else st.cart[id] = Math.min(q, 99); emit(); },
    toggle(id) { api.set(id, api.qty(id) ? 0 : 1); },
    clear() { st.cart = {}; emit(); },
    items: () => Object.keys(st.cart).map((id) => ({ s: byId(id), q: st.cart[id] })).filter((x) => x.s),
    count: () => api.items().reduce((a, x) => a + x.q, 0),
    total: () => api.items().reduce((a, x) => a + (x.s.price || 0) * x.q, 0),
    onRequest: () => api.items().some((x) => !x.s.price),
    on: (f) => subs.push(f),
    field(k, v) { if (v === undefined) return st.form[k] || ""; st.form[k] = v; save(); },
    cats: () => [...new Set(C.services.map((s) => s.category).filter(Boolean))],
    price: (s) => (s.price ? money(s.price) : "по договорённости"),

    /* текст заявки; extra — массив [подпись, значение] */
    text(extra) {
      const L = [C.order.greeting, ""];
      api.items().forEach((x, i) => L.push((i + 1) + ". " + x.s.name + (x.q > 1 ? " × " + x.q : "") + " — " + (x.s.price ? money(x.s.price * x.q) : "по договорённости")));
      if (!api.items().length) L.push("(услуги обсудим)");
      L.push("");
      if (api.total() > 0) L.push("Итого: " + money(api.total()) + (api.onRequest() ? " + позиции по договорённости" : ""));
      (extra || []).forEach(([k, v]) => { if (v && String(v).trim()) L.push(k + ": " + String(v).trim()); });
      if (C.order.closing) L.push("", C.order.closing);
      return L.join("\n");
    },

    /* ссылки на мессенджеры владельца */
    links(text) {
      const m = C.messengers || {}, out = [];
      if (m.telegram) out.push({ k: "tg", label: "Telegram", href: "https://t.me/" + m.telegram });
      if (m.whatsapp) out.push({ k: "wa", label: "WhatsApp", href: "https://wa.me/" + m.whatsapp + (text ? "?text=" + encodeURIComponent(text) : "") });
      if (m.vk) out.push({ k: "vk", label: "ВКонтакте", href: "https://vk.me/" + m.vk });
      if (C.phone) out.push({ k: "tel", label: "Позвонить", href: "tel:" + C.phone.replace(/[^\d+]/g, "") });
      return out;
    },
    tel: () => (C.phone ? "tel:" + C.phone.replace(/[^\d+]/g, "") : null),

    copy(text) {
      const ok = () => toast("Текст скопирован — вставьте его в чат");
      const fb = () => {
        const t = h("textarea", { style: "position:fixed;opacity:0" }); t.value = text; document.body.append(t); t.select();
        let done = false; try { done = document.execCommand("copy"); } catch (e) {}
        t.remove(); done ? ok() : toast("Не получилось скопировать — выделите текст вручную");
      };
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, fb); else fb();
    },


    /* готовый блок заявки: список, поля, итог, текст, мессенджеры. Оформляется классами op-* */
    panel(box, opt) {
      opt = opt || {};
      const UI = C.ui || {};
      const fields = opt.fields || [["fName", "Ваше имя"], ["fWhen", UI.whenLabel || "Когда удобно"], ["fNote", "Комментарий"]];
      const list = h("div", { class: "op-list" }), total = h("div", { class: "op-total" });
      const ta = h("textarea", { class: "op-text", readonly: true, "aria-label": "Текст заявки" });
      const links = h("div", { class: "op-links" });
      const inputs = fields.map(([id, label]) => {
        const i = h("input", { id: "op-" + id }); i.value = api.field(id);
        i.addEventListener("input", () => { api.field(id, i.value); refreshText(); });
        return h("label", { class: "op-field" }, h("span", {}, label), i);
      });
      box.append(list, h("div", { class: "op-fields" }, inputs), total, ta, links);
      const extra = () => fields.map(([id, label]) => [id === "fWhen" ? (UI.whenText || "Когда") : id === "fName" ? "Имя" : label.replace(/ \(.*\)$/, ""), api.field(id)]).concat(opt.extra ? opt.extra() : []);
      function refreshText() {
        const t = api.text(extra()); ta.value = t; links.innerHTML = "";
        links.append(h("button", { type: "button", class: "op-copy", onclick: () => api.copy(t) }, "Скопировать текст"));
        api.links(t).forEach((x) => links.append(h("a", { class: "op-" + x.k, href: x.href, target: x.k === "tel" ? null : "_blank", rel: "noopener", onclick: () => x.k !== "wa" && x.k !== "tel" && api.copy(t) }, x.label)));
      }
      function refresh() {
        list.innerHTML = "";
        if (!api.items().length) list.append(h("p", { class: "op-empty" }, opt.empty || "Пока ничего не выбрано."));
        api.items().forEach((x) => list.append(h("div", { class: "op-row" },
          h("div", { class: "op-nm" }, x.s.name, h("small", {}, x.s.price ? api.money(x.s.price * x.q) : "по договорённости")),
          h("div", { class: "op-qty" },
            h("button", { type: "button", "aria-label": "Меньше", onclick: () => api.set(x.s.id, x.q - 1) }, "−"),
            h("span", {}, String(x.q)),
            h("button", { type: "button", "aria-label": "Больше", onclick: () => api.set(x.s.id, x.q + 1) }, "+")))));
        total.innerHTML = "";
        if (api.total()) total.append(h("span", {}, "Итого"), h("b", {}, api.money(api.total())));
        refreshText();
      }
      api.on(refresh); refresh();
      return { refresh };
    },
    /* график: открыто ли сейчас, ближайшие рабочие дни, свободное время */
    status() {
      if (!B.status) return { open: false, text: "" };
      const d = new Date(), m = d.getHours() * 60 + d.getMinutes();
      const open = B.days.includes(d.getDay()) && m >= toMin(B.open) && m < toMin(B.close);
      return open ? { open: true, text: "Открыто до " + B.close } : { open: false, text: "Сейчас закрыто · откроемся в " + B.open };
    },
    days(n) {
      const out = [], d = new Date(); d.setHours(0, 0, 0, 0);
      for (let i = 0; out.length < n && i < 60; i++) {
        const x = new Date(d); x.setDate(d.getDate() + i);
        if (B.days.includes(x.getDay())) out.push(x);
      }
      return out;
    },
    slots(date) {
      const out = [], now = new Date(), today = date.toDateString() === now.toDateString();
      for (let t = toMin(B.open); t + B.step <= toMin(B.close); t += B.step) {
        if (today && t <= now.getHours() * 60 + now.getMinutes() + 30) continue;
        out.push(pad(Math.floor(t / 60)) + ":" + pad(t % 60));
      }
      return out;
    },
    dayLabel(d) {
      const now = new Date(); now.setHours(0, 0, 0, 0);
      const diff = Math.round((d - now) / 864e5);
      const wd = d.toLocaleDateString("ru-RU", { weekday: "short" });
      return diff === 0 ? "Сегодня" : diff === 1 ? "Завтра" : wd.charAt(0).toUpperCase() + wd.slice(1) + ", " + d.getDate();
    },
    dateText: (d) => d.toLocaleDateString("ru-RU", { day: "numeric", month: "long", weekday: "long" })
  };
  return api;
})();
